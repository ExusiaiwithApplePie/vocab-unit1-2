<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>合成大李子岩</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  :root {
    --stage-w: min(420px, 92vw, calc((100vh - 176px) * 0.677));
  }
  @supports (height: 100dvh) {
    :root { --stage-w: min(420px, 92vw, calc((100dvh - 176px) * 0.677)); }
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(900px 640px at 50% -10%, #ffffff 0%, rgba(255, 255, 255, 0) 70%),
      radial-gradient(720px 520px at 94% 112%, #f0f6fc 0%, rgba(255, 255, 255, 0) 68%),
      #fdfeff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #24303f;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }

  .app {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 11px;
    padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
  }

  .topbar {
    width: var(--stage-w);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.4px;
    white-space: nowrap;
  }
  .brand i {
    display: block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #35c1ef;
    box-shadow: 0 0 0 3px rgba(53, 193, 239, 0.15);
  }

  .stats { display: flex; gap: 7px; }

  .stat {
    min-width: 62px;
    padding: 5px 8px 6px;
    border-radius: 12px;
    background: rgba(22, 48, 88, 0.045);
    border: 1px solid rgba(22, 48, 88, 0.07);
    text-align: right;
    line-height: 1.1;
  }
  .stat em {
    display: block;
    font-style: normal;
    font-size: 9.5px;
    letter-spacing: 1.4px;
    color: #8b97a7;
    margin-bottom: 3px;
  }
  .stat strong {
    display: block;
    font-size: 17px;
    font-variant-numeric: tabular-nums;
  }
  .stat strong.bump { animation: bump .3s cubic-bezier(.34,1.56,.64,1); }
  @keyframes bump {
    0%   { transform: scale(1); }
    42%  { transform: scale(1.24); color: #0d8fd6; }
    100% { transform: scale(1); }
  }

  .stage {
    position: relative;
    width: var(--stage-w);
    aspect-ratio: 420 / 620;
    border-radius: 24px;
    overflow: hidden;
    background: #ffffff;
    cursor: crosshair;
    touch-action: none;
    box-shadow:
      0 0 0 1px rgba(22, 48, 88, 0.08),
      0 20px 48px -22px rgba(28, 58, 105, 0.3),
      0 2px 6px rgba(28, 58, 105, 0.05);
  }

  #game { display: block; width: 100%; height: 100%; -webkit-user-drag: none; }

  .next {
    display: flex;
    align-items: center;
    gap: 3px;
    padding: 2px 6px 2px 8px;
    border-radius: 11px;
    background: rgba(22, 48, 88, 0.045);
    border: 1px solid rgba(22, 48, 88, 0.07);
    pointer-events: none;
  }
  .next span {
    font-size: 8.5px;
    letter-spacing: 1.4px;
    color: #8b97a7;
  }
  .next canvas { display: block; width: 48px; height: 48px; }

  /* 重开按钮：常驻右上角，随时可以重来一局 */
  .reset {
    position: absolute;
    top: 10px; right: 10px;
    z-index: 3;
    width: 30px; height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border-radius: 50%;
    border: 1px solid rgba(22, 48, 88, 0.12);
    background: rgba(255, 255, 255, 0.92);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    color: #55708f;
    cursor: pointer;
    box-shadow: 0 2px 8px -3px rgba(28, 58, 105, 0.26);
    transition: transform .16s ease, color .16s ease, border-color .16s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .reset:hover { color: #0d8fd6; border-color: rgba(26, 159, 224, 0.4); }
  .reset:active { transform: scale(0.9); }
  .reset svg { display: block; transform: rotate(0deg); transition: transform .45s ease; }
  .reset:hover svg { transform: rotate(-180deg); }

  @media (max-width: 400px) {
    .next span { display: none; }
  }

  .over {
    position: absolute;
    inset: 0;
    z-index: 5;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    background: rgba(252, 253, 255, 0.88);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
  }
  .over.show { display: flex; animation: fade .28s ease both; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  .over h2 {
    margin: 0;
    font-size: 21px;
    letter-spacing: 1px;
    color: #1d2836;
  }
  .over p {
    margin: 2px 0 0;
    font-size: 13px;
    color: #7a8798;
  }
  .over p b {
    font-size: 25px;
    color: #0d8fd6;
    font-variant-numeric: tabular-nums;
  }
  .over button {
    margin-top: 16px;
    padding: 11px 30px;
    border: 0;
    border-radius: 999px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    color: #ffffff;
    background: linear-gradient(180deg, #4cc6f0, #1a9fe0);
    box-shadow: 0 10px 24px -8px rgba(26, 159, 224, 0.75);
    cursor: pointer;
    transition: transform .12s ease;
  }
  .over button:active { transform: scale(0.955); }

  .hint {
    width: var(--stage-w);
    margin: 0;
    text-align: center;
    font-size: 11.5px;
    line-height: 1.65;
    color: #84909f;
  }
  .hint b { color: #4a5768; font-weight: 600; }
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand"><i></i>合成大李子岩</div>
    <div class="next">
      <span>NEXT</span>
      <canvas id="nextCv"></canvas>
    </div>
    <div class="stats">
      <div class="stat"><em>SCORE</em><strong id="scoreVal">0</strong></div>
      <div class="stat"><em>BEST</em><strong id="bestVal">0</strong></div>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="game"></canvas>

    <button class="reset" id="resetBtn" type="button" title="重开一局" aria-label="重开一局">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
        <path d="M20 12a8 8 0 1 1-2.35-5.65" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/>
        <path d="M20.2 4.3V9.2h-4.9" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <div class="over" id="over">
      <h2>李子岩堆满啦</h2>
      <p>本局得分 <b id="finalScore">0</b></p>
      <button id="againBtn" type="button">再来一局</button>
    </div>
  </div>

  <p class="hint">
    <b>移动</b>选位置 · <b>点击 / 松手</b>投放 · <b>R</b> 重开<br>
    相同的李子岩撞在一起会合体升级，两个 <b>小丑李子岩</b> 相撞会爆开
  </p>
</div>

  // 图片上不叠等级数字（想显示就改成 true）
  var DRAW_NUMBER = false;

  var MAX_LEVEL = LEVELS.length;

  /* ------------------------- 场景常量 ------------------------- */
  var W = 420;                 // 逻辑宽
  var H = 620;                 // 逻辑高
  var DEATH_Y = 122;           // 死亡线（球顶越过这条线并静止就会被判定堆满）
  var SPAWN_Y = 62;            // 投放高度
  var DROP_CD = 340;           // 两次投放的最小间隔 ms
  var POP_MS = 170;            // 合成后新球的弹出动画时长
  var DANGER_HOLD = 2000;      // 越线静止超过这个时间算输
  var SAFE_MS = 950;           // 新球落地前的宽限期

  /* ------------------------- DOM ------------------------- */
  var stage = document.getElementById('stage');
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var nextCv = document.getElementById('nextCv');
  var nctx = nextCv.getContext('2d');
  var scoreVal = document.getElementById('scoreVal');
  var bestVal = document.getElementById('bestVal');
  var finalScore = document.getElementById('finalScore');
  var overEl = document.getElementById('over');
  var againBtn = document.getElementById('againBtn');
  var resetBtn = document.getElementById('resetBtn');

  var DPR = Math.min(window.devicePixelRatio || 1, 2);

  function setupCanvas(cv, c, w, h) {
    cv.width = Math.round(w * DPR);
    cv.height = Math.round(h * DPR);
    c.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  setupCanvas(canvas, ctx, W, H);
  setupCanvas(nextCv, nctx, 100, 100);

  /* ------------------------- 物理世界 ------------------------- */
  var engine = Engine.create({
    gravity: { x: 0, y: 1.15, scale: 0.001 },
    positionIterations: 10,
    velocityIterations: 8
  });

  var wallOpts = { isStatic: true, friction: 0.5, restitution: 0.01 };

  Composite.add(engine.world, [
    Bodies.rectangle(-40, H * 0.4, 80, H * 1.7, wallOpts),        // 左墙
    Bodies.rectangle(W + 40, H * 0.4, 80, H * 1.7, wallOpts),     // 右墙
    Bodies.rectangle(W / 2, H + 24, W + 200, 60, wallOpts)        // 地板
  ]);

  /* ------------------------- 状态 ------------------------- */
  var balls = [];
  var mergeQueue = [];
  var particles = [];
  var floaters = [];
  var score = 0;
  var best = 0;
  var gameOver = false;
  var aimX = W / 2;
  var nextDropAt = 0;
  var dangerSince = 0;
  var shakeAmt = 0;
  var currentLevel = 1;
  var lastT = 0;

  try { best = parseInt(localStorage.getItem('octo_best') || '0', 10) || 0; } catch (e) { best = 0; }
  bestVal.textContent = best;

  /* ------------------------- 音效 ------------------------- */
  var ac = null;
  var muted = false;

  function initAudio() {
    if (!ac) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) { try { ac = new AC(); } catch (e) { ac = null; } }
    }
    if (ac && ac.state === 'suspended') { ac.resume(); }
  }

  function tone(freq, dur, type, vol, sweepTo) {
    if (!ac || muted) return;
    dur = dur || 0.14;
    type = type || 'sine';
    vol = vol || 0.07;
    var t = ac.currentTime;
    var o = ac.createOscillator();
    var g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(30, sweepTo || freq * 1.7), t + dur * 0.85);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(ac.destination);
    o.start(t);
    o.stop(t + dur + 0.03);
  }

  function buzz(ms) {
    if (navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} }
  }

  /* ------------------------- 球 ------------------------- */
  // 出球顺序：从最小的开始，丢得越多才慢慢放出更大的
  //   前 6 个一定全是 1 号；之后 1 号仍占大头，2 号慢慢出现；
  //   3 号要丢够 18 个且场上有 2 级球之后才会解锁，4 号永远不会直接出
  var dropCount = 0;

  function randLevel() {
    var n = dropCount;
    if (n < 6) return 1;                        // 开局只给 1 号
    var canThree = n >= 18;

    var v = Math.random();
    if (n < 14) {
      return v < 0.72 ? 1 : 2;                  // 7-14 球：1 号为主
    }
    if (n < 26) {
      if (canThree && v > 0.93) return 3;
      return v < 0.62 ? 1 : 2;
    }
    // 26 球之后：仍然以小球为主，3 号只是偶尔出现
    if (canThree && v > 0.86) return 3;
    return v < 0.55 ? 1 : 2;
  }

  function createBall(x, y, level) {
    var lv = LEVELS[level - 1];
    var b = Bodies.circle(x, y, lv.r, {
      restitution: 0.14,
      friction: 0.48,
      frictionStatic: 0.9,
      frictionAir: 0.009,
      density: 0.001,
      slop: 0.035
    });
    b.isBall = true;
    b.level = level;
    b.pop = 1;
    b.bornAt = performance.now();
    b.merged = false;
    balls.push(b);
    return b;
  }

  function killBall(b) {
    var i = balls.indexOf(b);
    if (i >= 0) balls.splice(i, 1);
    Composite.remove(engine.world, b);
  }

  /* ------------------------- 碰撞检测：合成 ------------------------- */
  Events.on(engine, 'collisionStart', function (evt) {
    var pairs = evt.pairs;
    for (var i = 0; i < pairs.length; i++) {
      var a = pairs[i].bodyA;
      var b = pairs[i].bodyB;
      if (!a.isBall || !b.isBall) continue;
      if (a.level !== b.level) continue;
      if (a.merged || b.merged) continue;
      a.merged = true;
      b.merged = true;
      mergeQueue.push([a, b]);
    }
  });

  function processMerges() {
    while (mergeQueue.length) {
      var pair = mergeQueue.shift();
      var a = pair[0], b = pair[1];
      var lv = a.level;
      var mx = (a.position.x + b.position.x) / 2;
      var my = (a.position.y + b.position.y) / 2;

      killBall(a);
      killBall(b);

      if (lv < MAX_LEVEL) {
        var nl = createBall(mx, my, lv + 1);
        nl.pop = 0;
        Body.setVelocity(nl, { x: 0, y: -2.4 });
        Composite.add(engine.world, nl);
        addScore(LEVELS[lv].score);
        burst(mx, my, LEVELS[lv], 12, false);
        tone(300 + lv * 85, 0.15, 'sine', 0.075, 520 + lv * 120);
        buzz(12);
        if (lv + 1 === MAX_LEVEL) {
          shakeAmt = Math.max(shakeAmt, 5);
          floater(mx, my - LEVELS[lv].r - 6, 'MAX!', '#d98200');
        }
      } else {
        // 两个 6 号相撞 → 一起爆开
        addScore(100);
        burst(mx, my, LEVELS[MAX_LEVEL - 1], 34, true);
        tone(200, 0.42, 'sine', 0.11, 45);
        shakeAmt = Math.max(shakeAmt, 11);
        buzz([18, 40, 26]);
        floater(mx, my - 40, '+100', '#2f6f9e');
      }
    }
  }

  /* ------------------------- 分数 ------------------------- */
  function addScore(n) {
    if (!n) return;
    score += n;
    scoreVal.textContent = score;
    scoreVal.classList.remove('bump');
    void scoreVal.offsetWidth;
    scoreVal.classList.add('bump');
  }

  function floater(x, y, text, color) {
    floaters.push({ x: x, y: y, text: text, color: color || '#fff', life: 1 });
  }

  /* ------------------------- 粒子 ------------------------- */
  function burst(x, y, lv, count, big) {
    for (var i = 0; i < count; i++) {
      var a = Math.random() * Math.PI * 2;
      var sp = 1.4 + Math.random() * (big ? 6.2 : 3.4);
      particles.push({
        x: x,
        y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 1.2,
        r: 1.8 + Math.random() * (big ? 5 : 3),
        life: 1,
        decay: 0.012 + Math.random() * 0.02,
        color: Math.random() > 0.5 ? lv.pop : lv.body
      });
    }
  }

  /* ------------------------- 投放 ------------------------- */
  function drop() {
    if (gameOver || performance.now() < nextDropAt) return;
    var lv = LEVELS[currentLevel - 1];
    var x = Math.max(lv.r + 4, Math.min(W - lv.r - 4, aimX));

    var b = createBall(x, SPAWN_Y, currentLevel);
    Body.setVelocity(b, { x: 0, y: 1.2 });
    Composite.add(engine.world, b);

    tone(640, 0.07, 'triangle', 0.045, 900);
    nextDropAt = performance.now() + DROP_CD;
    dropCount++;
    currentLevel = randLevel();
    drawNext();
  }

  function drawNext() {
    nctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    nctx.clearRect(0, 0, 100, 100);
    var r = 30 + (currentLevel - 1) * 1.5;
    drawOcto(nctx, 50, 50, r, currentLevel, 1);
  }

  /* ------------------------- 危险线判定 ------------------------- */
  function updateDanger(now) {
    var danger = false;
    for (var i = 0; i < balls.length; i++) {
      var b = balls[i];
      if (now - b.bornAt < SAFE_MS) continue;
      if (b.position.y - b.circleRadius < DEATH_Y && b.speed < 1.6) {
        danger = true;
        break;
      }
    }
    if (!danger) { dangerSince = 0; return; }
    if (!dangerSince) dangerSince = now;
    if (now - dangerSince > DANGER_HOLD) endGame();
  }

  function endGame() {
    if (gameOver) return;
    gameOver = true;
    dangerSince = 0;
    if (score > best) {
      best = score;
      bestVal.textContent = best;
      try { localStorage.setItem('octo_best', String(best)); } catch (e) {}
    }
    finalScore.textContent = score;
    overEl.classList.add('show');
    tone(180, 0.5, 'sine', 0.1, 60);
    buzz([30, 60, 30, 60]);
  }

  function reset() {
    for (var i = 0; i < balls.length; i++) Composite.remove(engine.world, balls[i]);
    balls.length = 0;
    mergeQueue.length = 0;
    particles.length = 0;
    floaters.length = 0;
    score = 0;
    scoreVal.textContent = '0';
    gameOver = false;
    dangerSince = 0;
    nextDropAt = 0;
    shakeAmt = 0;
    aimX = W / 2;
    dropCount = 0;
    currentLevel = randLevel();
    overEl.classList.remove('show');
    drawNext();
  }

  /* ------------------------- 输入 ------------------------- */
  function worldX(clientX) {
    var rect = canvas.getBoundingClientRect();
    return ((clientX - rect.left) / rect.width) * W;
  }

  var pointerDown = false;

  stage.addEventListener('pointerdown', function (e) {
    initAudio();
    pointerDown = true;
    aimX = Math.max(12, Math.min(W - 12, worldX(e.clientX)));
    e.preventDefault();
  });

  stage.addEventListener('pointermove', function (e) {
    if (e.pointerType === 'mouse' || pointerDown) {
      aimX = Math.max(12, Math.min(W - 12, worldX(e.clientX)));
    }
  });

  stage.addEventListener('pointerup', function (e) {
    if (!pointerDown) return;
    pointerDown = false;
    aimX = Math.max(12, Math.min(W - 12, worldX(e.clientX)));
    drop();
    e.preventDefault();
  });

  stage.addEventListener('pointercancel', function () { pointerDown = false; });
  stage.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  [againBtn].forEach(function (btn) {
    btn.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
    btn.addEventListener('pointerup', function (e) { e.stopPropagation(); });
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      initAudio();
      reset();
    });
  });

  // 重开：右上角按钮 / 键盘 R，随时可用
  function restart() {
    initAudio();
    reset();
  }

  resetBtn.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
  resetBtn.addEventListener('pointerup', function (e) { e.stopPropagation(); });
  resetBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    if (score > 0 && !gameOver && !window.confirm('重开一局？当前得分 ' + score + ' 会清零')) return;
    restart();
  });

  window.addEventListener('keydown', function (e) {
    if (e.key !== 'r' && e.key !== 'R') return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (score > 0 && !gameOver && !window.confirm('重开一局？当前得分 ' + score + ' 会清零')) return;
    restart();
  });

  /* ------------------------- 绘制 ------------------------- */
  function easeOutBack(x) {
    var c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
  }

  // 预加载各级头像：LEVELS 里填了 img 才会加载
  // 图片是异步加载的，所以加载完必须重画一次 NEXT，否则会一直停在兜底色圆
  LEVELS.forEach(function (lv) {
    if (!lv.img) return;
    var im = new Image();
    im.onload = function () { lv._ready = true; drawNext(); };
    im.onerror = function () { lv._ready = false; };
    im.src = lv.img;
    lv._img = im;
  });

  // 等级数字：球底部的小角标，不挡脸
  function drawNum(c, r, level) {
    var br = Math.max(4.8, r * 0.26);
    var cy = r * 0.6;
    c.beginPath();
    c.arc(0, cy, br, 0, Math.PI * 2);
    c.fillStyle = 'rgba(12, 18, 32, 0.68)';
    c.fill();
    c.lineWidth = Math.max(0.9, br * 0.15);
    c.strokeStyle = 'rgba(255, 255, 255, 0.55)';
    c.stroke();

    c.font = '800 ' + Math.round(br * 1.42) + 'px "Segoe UI", "PingFang SC", system-ui, sans-serif';
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillStyle = '#ffffff';
    c.fillText(String(level), 0, cy + br * 0.06);
  }

  // 画一颗李子岩：就是个圆，图片按直径铺满，右下角叠个小数字
  function drawOcto(c, x, y, r, level, alpha) {
    var lv = LEVELS[level - 1];
    c.save();
    c.globalAlpha = alpha === undefined ? 1 : alpha;
    c.translate(x, y);

    // 圆形裁剪：图片正好填满这个圆
    c.beginPath();
    c.arc(0, 0, r, 0, Math.PI * 2);
    c.closePath();

    if (lv._ready && lv._img) {
      c.save();
      c.clip();
      c.drawImage(lv._img, -r, -r, r * 2, r * 2);
      // 极淡的一层顶部反光，让它看着像个球而不是一张贴纸
      var gl = c.createLinearGradient(0, -r, 0, r * 0.25);
      gl.addColorStop(0, 'rgba(255, 255, 255, 0.28)');
      gl.addColorStop(0.5, 'rgba(255, 255, 255, 0.05)');
      gl.addColorStop(1, 'rgba(255, 255, 255, 0)');
      c.fillStyle = gl;
      c.fillRect(-r, -r, r * 2, r * 2);
      c.restore();
    } else {
      // 图片没加载出来时的兜底
      c.fillStyle = lv.body;
      c.fill();
    }

    // 描边：白底上必须有一圈轮廓，否则浅色头像会和背景糊在一起
    c.beginPath();
    c.arc(0, 0, Math.max(1, r - 0.5), 0, Math.PI * 2);
    c.lineWidth = Math.max(1, r * 0.055);
    c.strokeStyle = 'rgba(38, 52, 78, 0.18)';
    c.stroke();

    if (DRAW_NUMBER) drawNum(c, r, level);
    c.restore();
  }

  var bubbles = [];
  for (var bi = 0; bi < 22; bi++) {
    bubbles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: 1.2 + Math.random() * 3.4,
      sp: 0.1 + Math.random() * 0.35,
      a: 0.035 + Math.random() * 0.09,
      w: Math.random() * Math.PI * 2
    });
  }

  function drawBg() {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.52, '#ffffff');
    g.addColorStop(1, '#f0f5fb');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    var top = ctx.createLinearGradient(0, 0, 0, DEATH_Y + 50);
    top.addColorStop(0, 'rgba(110, 195, 245, 0.08)');
    top.addColorStop(1, 'rgba(110, 195, 245, 0)');
    ctx.fillStyle = top;
    ctx.fillRect(0, 0, W, DEATH_Y + 50);

    for (var i = 0; i < bubbles.length; i++) {
      var b = bubbles[i];
      ctx.beginPath();
      ctx.arc(b.x + Math.sin(b.w) * 2, b.y, b.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(120, 175, 235, ' + (b.a * 2.2).toFixed(3) + ')';
      ctx.fill();
    }

    var bot = ctx.createRadialGradient(W / 2, H + 40, 12, W / 2, H + 40, 300);
    bot.addColorStop(0, 'rgba(120, 180, 240, 0.14)');
    bot.addColorStop(1, 'rgba(120, 180, 240, 0)');
    ctx.fillStyle = bot;
    ctx.fillRect(0, H - 320, W, 320);
  }

  function drawDeathLine(now) {
    var danger = dangerSince > 0;
    var pulse = 0.5 + 0.5 * Math.sin(now / 170);

    if (danger) {
      var g = ctx.createLinearGradient(0, 0, 0, DEATH_Y);
      g.addColorStop(0, 'rgba(255, 60, 90, ' + (0.07 + pulse * 0.13).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(255, 60, 90, 0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, DEATH_Y);
    }

    ctx.save();
    ctx.setLineDash([10, 8]);
    ctx.lineWidth = 2;
    ctx.strokeStyle = danger
      ? 'rgba(240, 70, 95, ' + (0.45 + pulse * 0.5).toFixed(3) + ')'
      : 'rgba(70, 140, 210, 0.42)';
    ctx.beginPath();
    ctx.moveTo(10, DEATH_Y);
    ctx.lineTo(W - 10, DEATH_Y);
    ctx.stroke();
    ctx.restore();
  }

  function drawAim(now) {
    if (gameOver) return;
    var lv = LEVELS[currentLevel - 1];
    var x = Math.max(lv.r + 4, Math.min(W - lv.r - 4, aimX));

    ctx.save();
    ctx.setLineDash([5, 9]);
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = 'rgba(70, 150, 220, 0.32)';
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, SPAWN_Y + lv.r);
    ctx.stroke();
    ctx.restore();

    // 半透明预览
    drawOcto(ctx, x, SPAWN_Y, lv.r, currentLevel, pointerDown ? 0.82 : 0.56);
  }

  function updateParticles(dt) {
    var k = dt / 16.667;
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.x += p.vx * k;
      p.y += p.vy * k;
      p.vy += 0.24 * k;
      p.vx *= 0.992;
      p.life -= p.decay * k;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (var j = floaters.length - 1; j >= 0; j--) {
      var f = floaters[j];
      f.y -= 0.6 * k;
      f.life -= 0.016 * k;
      if (f.life <= 0) floaters.splice(j, 1);
    }
  }

  function drawParticles() {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * (0.4 + p.life * 0.6), 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (var j = 0; j < floaters.length; j++) {
      var f = floaters[j];
      ctx.globalAlpha = Math.max(0, Math.min(1, f.life));
      ctx.font = '800 20px "Segoe UI", "PingFang SC", system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineJoin = 'round';
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.92)';
      ctx.strokeText(f.text, f.x, f.y);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;
  }

  function draw(now) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);

    if (shakeAmt > 0.3) {
      ctx.translate((Math.random() - 0.5) * shakeAmt, (Math.random() - 0.5) * shakeAmt);
    }

    drawBg();
    drawDeathLine(now);
    drawAim(now);

    for (var i = 0; i < balls.length; i++) {
      var b = balls[i];
      var sc = b.pop < 1 ? 0.34 + 0.66 * easeOutBack(b.pop) : 1;
      drawOcto(ctx, b.position.x, b.position.y, b.circleRadius * sc, b.level, 1);
    }

    drawParticles();
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  /* ------------------------- 主循环 ------------------------- */
  function loop(now) {
    if (!lastT) lastT = now;
    var dt = now - lastT;
    lastT = now;
    if (dt > 50) dt = 50;
    if (dt < 0) dt = 0;

    if (!gameOver) {
      Engine.update(engine, dt);
      processMerges();
      updateDanger(now);
    }

    for (var i = 0; i < balls.length; i++) {
      if (balls[i].pop < 1) balls[i].pop = Math.min(1, balls[i].pop + dt / POP_MS);
    }

    var k = dt / 16.667;
    for (var j = 0; j < bubbles.length; j++) {
      var bb = bubbles[j];
      bb.y -= bb.sp * k;
      bb.w += 0.025 * k;
      if (bb.y < -12) { bb.y = H + 12; bb.x = Math.random() * W; }
    }

    shakeAmt *= Math.pow(0.84, k);
    updateParticles(dt);
    draw(now);

    requestAnimationFrame(loop);
  }

  currentLevel = randLevel();
  drawNext();
  requestAnimationFrame(loop);

})();
</script>
</body>
</html>
