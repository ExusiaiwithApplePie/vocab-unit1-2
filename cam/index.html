<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f3ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="词汇刷题">
<title>大学英语 1 词汇 · 官方词表 U1–U5、U7</title>
<link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiByeD0iMTQiIGZpbGw9IiMxZjI0MzAiLz48dGV4dCB4PSIzMiIgeT0iNDQiIGZvbnQtc2l6ZT0iMjkiIGZvbnQtZmFtaWx5PSJIZWx2ZXRpY2EsQXJpYWwsc2Fucy1zZXJpZiIgZm9udC13ZWlnaHQ9IjcwMCIgZmlsbD0iI2ZmZmZmZiIgdGV4dC1hbmNob3I9Im1pZGRsZSI+QTE8L3RleHQ+PC9zdmc+">
<style>
:root{
  --bg:#f4f3ef; --card:#fff; --ink:#16171a; --ink2:#6d7178; --ink3:#9aa0a6;
  --line:#e7e5df; --ok:#18794e; --no:#b4362b;
  --okbg:#e8f4ec; --nobg:#fbeae8; --warn:#8a5a00;
  --acc:#16171a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:600px;margin:0 auto;padding:14px 14px calc(26px + env(safe-area-inset-bottom))}

/* 顶栏 */
.hd{display:flex;align-items:center;gap:10px;margin:2px 0 2px}
.hd h1{margin:0;font-size:19px;font-weight:680;letter-spacing:-.01em;flex:1}
.icon{border:0;background:transparent;color:var(--ink2);font-size:13.5px;padding:6px 2px;cursor:pointer}
.sub{margin:0 0 14px;font-size:12px;color:var(--ink3);line-height:1.5}

.warnbar{background:#fff7e6;border:1px solid #f0dfb8;color:var(--warn);font-size:12px;line-height:1.55;padding:9px 11px;border-radius:10px;margin:0 0 12px}

/* 统计 */
.stats{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 4px;margin-bottom:14px}
.stats>div{flex:1;text-align:center;position:relative}
.stats>div+div::before{content:"";position:absolute;left:0;top:15%;height:70%;width:1px;background:var(--line)}
.stats b{display:block;font-size:19px;font-weight:680;font-variant-numeric:tabular-nums}
.stats span{font-size:11px;color:var(--ink3)}
.stats .ok b{color:var(--ok)}
.stats .no b{color:var(--no)}

/* 题型卡 */
.lab{font-size:11.5px;color:var(--ink3);letter-spacing:.04em;margin:16px 0 8px;display:flex;justify-content:space-between}
.lab i{font-style:normal;color:var(--ink3)}
.types{display:flex;flex-direction:column;gap:8px}
.type{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:13px;padding:12px 13px;cursor:pointer;font:inherit;color:inherit;transition:.15s}
.type .code{flex:none;width:44px;height:44px;border-radius:11px;background:#f0eee8;color:var(--ink2);
  display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;letter-spacing:.02em}
.type .tx{flex:1;min-width:0}
.type .nm{display:block;font-weight:640;font-size:14.5px;margin-bottom:2px}
.type .ds{display:block;font-size:11.5px;color:var(--ink3);line-height:1.45}
.type.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.type.on .code{background:var(--acc);color:#fff}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink2);font:inherit;font-size:12.5px;
  padding:6px 11px;border-radius:20px;cursor:pointer;transition:.15s;white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip .n{opacity:.55;font-size:11px;margin-left:5px;font-variant-numeric:tabular-nums}
.chip.on .n{opacity:.8}
.chip.parent{border-color:var(--ink);color:var(--ink);background:#ebe9e2}
.chip.sm{padding:5px 10px;font-size:12px}
.chips.sub{margin-top:8px}
.lab.tight{margin-top:12px}

.acts2{display:flex;gap:9px;margin:18px 0 4px}
.btn{flex:1;border:0;border-radius:12px;padding:13px;font:inherit;font-size:15px;font-weight:620;cursor:pointer}
.btn-main{background:var(--acc);color:#fff}
.btn-ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn-sm{padding:9px 12px;font-size:13px;border-radius:10px;flex:none}

/* 答题 */
.pbar{height:3px;background:#e6e3dc;border-radius:3px;overflow:hidden;margin:6px 0 12px}
.pbar>i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.qhead{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink3);margin-bottom:10px}
.qhead .t{font-weight:600;color:var(--ink2)}
.qhead .r{margin-left:auto;font-variant-numeric:tabular-nums}

.stem{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px 14px;font-size:16px;line-height:1.85}
.stem .ln{font-size:11.5px;color:var(--ink3);margin-bottom:7px;font-weight:500}
.big{font-weight:680;letter-spacing:-.01em}
.big.ul{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px}
.big.bd{font-weight:800}
.blank{display:inline-block;min-width:74px;text-align:center;border-bottom:1.6px solid var(--ink3);
  margin:0 3px;font-weight:640;color:var(--ink3);vertical-align:baseline;padding:0 4px}
.blank.cur{border-bottom-color:var(--acc);background:#f0eee6;border-radius:4px 4px 0 0}
.blank.ok{border-bottom-color:var(--ok);color:var(--ok)}
.blank.no{border-bottom-color:var(--no);color:var(--no);text-decoration:line-through}

/* 词库 */
.bank{margin-top:12px}
.btitle{font-size:11.5px;color:var(--ink3);margin:0 0 8px;display:flex;justify-content:space-between}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.bw{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13.5px;
  padding:10px 4px;border-radius:9px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:.12s}
.bw:active{transform:scale(.97)}
.bw.used{color:#c3c0b8;text-decoration:line-through;background:#f7f6f2;border-style:dashed}
.bw.ok{background:var(--okbg);border-color:#a9d7bd;color:var(--ok);font-weight:640}
.bw.no{background:var(--nobg);border-color:#e8b5b0;color:var(--no)}
.bw.ok::after{content:" ✓"}
.bw.no::after{content:" ✕"}

/* 定义列表 (I·B) */
.deflist{margin-top:12px;display:flex;flex-direction:column;gap:7px}
.drow{display:flex;gap:9px;align-items:flex-start;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:10px;padding:10px 11px;font:inherit;font-size:13px;line-height:1.5;cursor:pointer;color:inherit}
.drow .L{flex:none;width:19px;font-weight:700;color:var(--ink2);font-size:12.5px}
.drow.used{background:#f7f6f2;color:#bcb9b1;border-style:dashed}
.drow.used .L{color:#cbc8c0}
.drow.ok{background:var(--okbg);border-color:#a9d7bd}
.drow.ok .L{color:var(--ok)}
.drow.no{background:var(--nobg);border-color:#e8b5b0}
.drow.no .L{color:var(--no)}

/* 选项 (I·C) */
.opts{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:11px;padding:11px 12px;font:inherit;font-size:13.5px;line-height:1.55;cursor:pointer;color:inherit}
.opt .i{flex:none;width:20px;height:20px;border-radius:6px;background:#f0eee8;color:var(--ink2);
  display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700}
.opt.ok{background:var(--okbg);border-color:#a9d7bd}
.opt.ok .i{background:var(--ok);color:#fff}
.opt.no{background:var(--nobg);border-color:#e8b5b0}
.opt.no .i{background:var(--no);color:#fff}

/* 短文 (II·A) */
.passage{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px;
  font-size:15px;line-height:2.05;max-height:42vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.passage .ttl{font-size:12px;color:var(--ink3);margin-bottom:6px}
.passage .blank{min-width:58px}
.passage .bn{display:inline-block;min-width:22px;text-align:center;font-size:10.5px;color:var(--ink3);vertical-align:super;margin-left:1px}

/* 底部反馈 */
.sheet-wrap{position:fixed;inset:0;background:rgba(20,20,22,.34);display:flex;align-items:flex-end;z-index:40;padding:0}
.sheet{background:var(--card);width:100%;max-width:600px;margin:0 auto;border-radius:18px 18px 0 0;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom));animation:up .22s ease-out;max-height:86vh;overflow-y:auto}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet .verd{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:640;margin-bottom:10px}
.sheet .verd.ok{color:var(--ok)}
.sheet .verd.no{color:var(--no)}
.sheet .wline{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:4px}
.sheet .w{font-size:21px;font-weight:700;letter-spacing:-.01em}
.sheet .ipa{font-size:12.5px;color:var(--ink3)}
.spk{border:1px solid var(--line);background:var(--card);border-radius:8px;font-size:12px;padding:3px 8px;cursor:pointer;color:var(--ink2)}
.sheet .def{font-size:12.8px;color:var(--ink2);margin:6px 0 0;line-height:1.6}
.sheet .zh{font-size:13.5px;margin:2px 0 0}
.sheet .ex{margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);font-size:12.8px;line-height:1.65}
.sheet .ex .en{color:var(--ink)}
.sheet .ex .cn{color:var(--ink3);margin-top:2px}
.sheet .acts{display:flex;gap:9px;margin-top:14px}

/* 结果 / 错题本 */
.score{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 16px;text-align:center;margin-bottom:12px}
.score b{display:block;font-size:36px;font-weight:750;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.score b small{font-size:15px;color:var(--ink3);font-weight:600}
.score p{margin:6px 0 0;font-size:12.5px;color:var(--ink2)}
.rows{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden}
.row{display:flex;gap:10px;align-items:center;padding:11px 13px;border-bottom:1px solid var(--line);font-size:13.5px}
.row:last-child{border-bottom:0}
.row .w{font-weight:620;flex:none;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .z{color:var(--ink3);font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .n{color:var(--no);font-size:11.5px;flex:none}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:13px;padding:26px 18px;text-align:center;
  color:var(--ink3);font-size:12.8px;line-height:1.7}
.empty b{display:block;color:var(--ink2);font-size:14px;margin-bottom:5px}

/* 通用弹层 */
.mask{position:fixed;inset:0;background:rgba(20,20,22,.4);display:flex;align-items:center;justify-content:center;z-index:50;padding:18px}
.dlg{background:var(--card);border-radius:16px;width:100%;max-width:460px;padding:18px;max-height:80vh;overflow-y:auto}
.dlg h3{margin:0 0 6px;font-size:15.5px}
.dlg p{margin:0 0 10px;font-size:12px;color:var(--ink3);line-height:1.6}
.dlg textarea{width:100%;height:130px;border:1px solid var(--line);border-radius:10px;padding:10px;
  font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical;color:var(--ink);background:#fbfaf7}
.dlg .acts{display:flex;gap:9px;margin-top:12px}
.msg{font-size:12px;color:var(--ink2);margin-top:8px;line-height:1.6}
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:rgba(24,24,26,.93);color:#fff;font-size:13px;padding:10px 16px;border-radius:20px;z-index:99;max-width:80vw;text-align:center}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="app">

  <div class="hd">
    <h1 id="title">大学英语 1 · 词汇</h1>
    <button class="icon" id="btnBack" hidden>返回</button>
  </div>
  <p class="sub" id="subline">官方词表 U1–U5、U7 · 365 词 · 按考卷 Section A/B/C 出题</p>

  <!-- 首页 -->
  <section id="v-home">
    <div class="warnbar" id="storeWarn" hidden>当前打开方式无法保存进度，关掉页面记录就没了。请把文件用手机自带浏览器（Safari / Chrome）打开，别用微信内置预览。</div>

    <div class="stats">
      <div><b id="sDone">0</b><span>已练</span></div>
      <div class="ok"><b id="sOk">0</b><span>掌握</span></div>
      <div class="no"><b id="sWrong">0</b><span>错词</span></div>
    </div>

    <div class="lab"><span>选择题型</span><i>每组 10 题</i></div>
    <div class="types" id="typeList"></div>

    <div class="lab"><span>出题范围</span><i id="poolN"></i></div>
    <div class="chips" id="scopeChips"></div>
    <div class="lab tight" id="chapLab" hidden><span id="chapTitle">② 课文</span><i>不选就是整个单元</i></div>
    <div class="chips" id="scopeSub" hidden></div>

    <div class="acts2">
      <button class="btn btn-main" id="btnStart">开始做题</button>
      <button class="btn btn-ghost" id="btnWrong">错题本</button>
    </div>
  </section>

  <!-- 答题 -->
  <section id="v-quiz" hidden>
    <div class="qhead">
      <span class="t" id="qtype"></span>
      <span id="cnt"></span>
      <span class="r" id="score"></span>
    </div>
    <div class="pbar"><i id="prog"></i></div>
    <div id="qbody"></div>
  </section>

  <!-- 结果 -->
  <section id="v-done" hidden>
    <div class="score">
      <b><span id="donePts">0</span><small id="doneFull"> / 15</small></b>
      <p id="doneSub"></p>
    </div>
    <div id="doneWrong"></div>
    <div class="acts2" style="margin-top:14px">
      <button class="btn btn-main" id="btnAgain">再来一组</button>
      <button class="btn btn-ghost" id="btnRetryWrong" hidden>只刷这组错的</button>
    </div>
  </section>

  <!-- 错题本 -->
  <section id="v-wrong" hidden>
    <div class="lab"><span>错题本</span><i id="wbN"></i></div>
    <div id="wbList"></div>
    <div class="acts2" style="margin-top:14px">
      <button class="btn btn-main" id="btnPracticeWrong">练这些错词</button>
      <button class="btn btn-ghost" id="btnAddManual">手动加词</button>
    </div>
    <div class="chips" style="margin-top:10px">
      <button class="chip" id="btnImport">从别处导入</button>
      <button class="chip" id="btnExport">备份进度</button>
      <button class="chip" id="btnImportBak">恢复进度</button>
      <button class="chip" id="btnResetWrong">重置错题本</button>
    </div>
  </section>

  <!-- 手动加词 -->
  <section id="v-add" hidden>
    <div class="lab"><span>手动加词</span><i>会加入错题本</i></div>
    <textarea id="addBox" style="width:100%;height:150px;border:1px solid var(--line);border-radius:12px;padding:11px;font:13px/1.6 inherit;background:#fff;color:var(--ink)"></textarea>
    <p class="msg">一行一个，或用逗号、空格分开。输前几个字母也认（输 amor 会命中 amorphous）。</p>
    <div class="acts2">
      <button class="btn btn-main" id="btnAddOk">加入</button>
      <button class="btn btn-ghost" id="btnAddClear">清空</button>
    </div>
    <div class="msg" id="addMsg"></div>
  </section>
</div>

<script>

/* ---------- 存储 ---------- */
function blankStore(){ return {v:2,cards:{},stat:{a:0,r:0}}; }
/* 存储三级降级：localStorage → sessionStorage → 内存
   微信内置预览、部分 file:// 打开方式会禁掉 localStorage，此时不至于崩，也不至于静默丢数据 */
const MEM={};
const STORE_MODE=(function(){
  const probe=w=>{ try{ const k='__p__'; w.setItem(k,'1'); const v=w.getItem(k); w.removeItem(k); return v==='1'; }catch(e){ return false; } };
  try{ if(probe(localStorage)) return 'local'; }catch(e){}
  try{ if(probe(sessionStorage)) return 'session'; }catch(e){}
  return 'memory';
})();
const PERSIST_OK = STORE_MODE==='local';
const IN_WECHAT = /MicroMessenger|QQ\//i.test(navigator.userAgent||'');

function rawGet(){
  try{
    if(STORE_MODE==='local') return localStorage.getItem(KEY);
    if(STORE_MODE==='session') return sessionStorage.getItem(KEY);
  }catch(e){}
  return MEM[KEY]||null;
}
function rawSet(v){
  try{
    if(STORE_MODE==='local'){ localStorage.setItem(KEY,v); return; }
    if(STORE_MODE==='session'){ sessionStorage.setItem(KEY,v); return; }
  }catch(e){}
  MEM[KEY]=v;
}

let store=(function(){
  try{ const o=JSON.parse(rawGet()); if(o&&o.cards) return o; }catch(e){}
  return blankStore();
})();
function save(){ try{ rawSet(JSON.stringify(store)); }catch(e){} }

function cardOf(d){ if(!store.cards[d.id]) store.cards[d.id]={w:0,r:0,t:0}; return store.cards[d.id]; }
function rec(d,good){ const c=cardOf(d); if(good) c.r++; else c.w++; c.l=good?1:0; c.t=Date.now();
  store.stat.a++; if(good) store.stat.r++; save(); }
const mastered=d=>{ const c=store.cards[d.id]; return !!c && c.l===1; };
const wrongList=()=>DATA.filter(d=>{ const c=store.cards[d.id]; return c && c.w>0 && c.l!==1; });

let prefs={type:'IA',scope:'all'};
try{ const p=JSON.parse(localStorage.getItem(PREFS)); if(p&&p.type) prefs=Object.assign(prefs,p); }catch(e){}
function savePrefs(){ try{ localStorage.setItem(PREFS,JSON.stringify(prefs)); }catch(e){} }

/* ---------- 定位单词在句中的位置 ---------- */
function locate(sentence, word){
  const s=String(sentence||'').replace(/\b([A-Za-z]+)\/([A-Za-z]+)\b/g,'$1');
  const lw=String(word).toLowerCase().trim();
  const ec=c=>c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  if(lw.indexOf(' ')>0){
    const parts=word.split(/\s+/).map(p=>ec(p));
    let m=s.match(new RegExp('\\b'+parts.join('\\s+')+'\\b','i'));
    if(m) return {s,i:m.index,j:m.index+m[0].length};
    const head=(word.split(/\s+/).filter(p=>!/^(be|a|an|to|the)$/i.test(p))[0]||word.split(/\s+/)[0]);
    const tail=word.split(/\s+/).pop();
    m=s.match(new RegExp('\\b'+ec(head.slice(0,4))+'[A-Za-z]*\\s+(?:[A-Za-z]+\\s+)?'+ec(tail.slice(0,Math.max(4,tail.length-2)))+'[A-Za-z]*','i'));
    return m?{s,i:m.index,j:m.index+m[0].length}:null;
  }
  const need=lw.length<=4?lw.length:lw.length-3;
  const re=/[A-Za-z][A-Za-z'-]*/g;
  let m,best=null,bestN=0;
  while((m=re.exec(s))){
    const t=m[0].toLowerCase();
    let n=0; while(n<lw.length&&n<t.length&&lw[n]===t[n]) n++;
    if(n>=need&&n>bestN){ best=m; bestN=n; }
  }
  return best?{s,i:best.index,j:best.index+best[0].length}:null;
}
const defOk=e=>!!e && String(e).length<=150;
const toks=e=>new Set(String(e||'').toLowerCase().match(/[a-z]{3,}/g)||[]);
function jac(a,b){
  const A=toks(a),B=toks(b); if(!A.size||!B.size) return 0;
  let x=0; A.forEach(t=>{ if(B.has(t)) x++; });
  return x/(A.size+B.size-x);
}

/* ---------- 组题 ---------- */
function sample(a,n){ return shuffle(a.slice()).slice(0,n); }
function uniqByWord(a){
  const seen=new Set(), out=[];
  a.forEach(x=>{ if(!seen.has(x.w)){ seen.add(x.w); out.push(x); } });
  return out;
}

// 范围里词不够 10 个时：先在同一单元里补，再退回全书
function topUp(pick,n,ok){
  if(n<=0) return [];
  const have=new Set(pick.map(d=>d.id));
  const su=scopeUnitOf(pick);
  const tiers=su?[DATA.filter(d=>d.u===su),DATA]:[DATA];
  const out=[];
  for(const t of tiers){
    if(out.length>=n) break;
    const rest=uniqByWord(t.filter(d=>ok(d)&&!have.has(d.id)&&!out.some(o=>o.id===d.id)));
    out.push(...sample(rest,n-out.length));
  }
  return out;
}

// I·A：10 空 + 15 词库
function buildIA(scope){
  const ok=d=>d.x&&locate(d.x,d.w);
  const cand=scope.filter(ok);
  let pick=sample(cand,SET);
  if(pick.length<SET) pick=pick.concat(topUp(pick,SET-pick.length,ok));
  const items=pick.map(d=>{
    const L=locate(d.x,d.w);
    return {kind:'IA',d,pre:L.s.slice(0,L.i),post:L.s.slice(L.j),ans:d.w};
  });
  const answers=new Set(items.map(i=>i.ans));
  const extra=bankDistractors(items.map(i=>i.d),answers,5);
  return {kind:'IA',items,bank:shuffle([...answers].map(w=>({w})).concat(extra))};
}

function bankDistractors(answersD,answersSet,n){
  const cands=[];
  answersD.forEach(d=>{ (NEAR[d.id]||[]).forEach(id=>{ const x=byId[id]; if(x&&!answersSet.has(x.w)) cands.push(x); }); });
  let out=uniqByWord(cands).filter(x=>!answersSet.has(x.w));
  if(out.length<n){
    const pos=new Set(answersD.map(d=>d.o));
    const more=DATA.filter(x=>pos.has(x.o)&&!answersSet.has(x.w)&&!out.some(o=>o.w===x.w));
    out=out.concat(sample(more,n-out.length));
  }
  return sample(out,n).map(x=>({w:x.w}));
}

// I·B：10 句划线词 + A–J 定义
function buildIB(scope){
  const ok=d=>defOk(d.e)&&d.x&&locate(d.x,d.w);
  let cand=scope.filter(ok);
  if(cand.length<SET) cand=cand.concat(topUp(cand,SET-cand.length,ok));
  const picked=[];
  for(const d of sample(cand,cand.length)){
    if(picked.length>=SET) break;
    if(picked.some(p=>jac(p.e,d.e)>0.28)) continue;
    picked.push(d);
  }
  const defs=shuffle(picked.map(d=>d.e));
  const items=picked.map(d=>{
    const L=locate(d.x,d.w);
    return {kind:'IB',d,pre:L.s.slice(0,L.i),mid:L.s.slice(L.i,L.j),post:L.s.slice(L.j),
      ans:letter(defs.indexOf(d.e))};
  });
  return {kind:'IB',items,defs};
}

// A 部分：给释义选单词（四选一）
function buildIC(scope){
  const ok=d=>defOk(d.e);
  let cand=scope.filter(ok);
  if(cand.length<6) cand=cand.concat(topUp(cand,6-cand.length,ok));
  const pick=sample(cand,6);
  const items=pick.map(d=>{
    const opts=[d.w];
    for(const x of shuffle(DATA.filter(x=>x.o===d.o&&x.w!==d.w))){
      if(opts.length>=4) break;
      if(opts.indexOf(x.w)<0) opts.push(x.w);
    }
    for(const x of shuffle(DATA)){
      if(opts.length>=4) break;
      if(opts.indexOf(x.w)<0) opts.push(x.w);
    }
    const bag=shuffle(opts.slice(0,4));
    return {kind:'IC',d,opts:bag,ans:bag.indexOf(d.w)};
  });
  return {kind:'IC',items};
}

// II·A：短文 10 空 + 15 词库
function buildIIA(scope){
  const scopeIds=new Set(scope.map(d=>d.id));
  const full=scopeIds.size>=DATA.length;
  // 只有命中所选范围的短文才可选，避免选 Unit 3 却出 Unit 1 的词
  const scored=PASS.map(p=>{
    const idx=p.seg.map((s,i)=>s.id?i:-1).filter(i=>i>=0);
    return {p, idx, hit:idx.filter(i=>scopeIds.has(p.seg[i].id)).length};
  });
  let cand=scored;
  if(!full){
    cand=scored.filter(s=>s.hit>0);
    if(!cand.length) cand=scored;                 // 范围里没有任何短文词时才兜底
  }
  const pick=cand[Math.floor(Math.random()*cand.length)];
  const p=pick.p;
  let inScope=pick.idx.filter(i=>scopeIds.has(p.seg[i].id));
  if(!inScope.length) inScope=pick.idx.slice();
  // 短文里属于本范围的词不足 10 个时，先用同单元的补
  let slots=inScope.slice();
  if(slots.length<SET){
    const rest=pick.idx.filter(i=>slots.indexOf(i)<0);
    const su=scopeUnitOf(scope);
    const same=su?rest.filter(i=>{ const d=byId[p.seg[i].id]; return d&&d.u===su; }):[];
    slots=slots.concat(same);
    if(slots.length<SET) slots=slots.concat(rest.filter(i=>slots.indexOf(i)<0));
  }
  const n=Math.min(SET,slots.length);
  const chosen=sample(slots,n).sort((a,b)=>a-b);
  const items=chosen.map(i=>{
    const d=byId[p.seg[i].id];
    return {kind:'IIA',d,slot:i,ans:d.w};
  });
  const answers=new Set(items.map(i=>i.ans));
  const extra=bankDistractors(items.map(i=>i.d),answers,5);
  return {kind:'IIA',items,pass:p,slotOf:{},bank:shuffle([...answers].map(w=>({w})).concat(extra))};
}

/* ---------- 状态 ---------- */
let set=null, cursor=0, answered=[], score=0, wrongD=[];
const build={
  IA:buildIA, IB:buildIB, IC:buildIC, IIA:buildIIA
};

/* ---------- 范围：单元 → 课文 两级 ---------- */
const unitNo=u=>parseInt((String(u).match(/\d+/)||[0])[0],10)||0;
const chKey=c=>{ const m=String(c).match(/Ch\s*(\d+)\s*R\s*(\d+)/i); return m?(+m[1])*100+(+m[2]):0; };
const unitsAll=()=>[...new Set(DATA.map(d=>d.u))].sort((a,b)=>unitNo(a)-unitNo(b));
const chaptersOf=u=>[...new Set(DATA.filter(d=>d.u===u).map(d=>d.c))].sort((a,b)=>chKey(a)-chKey(b));
const chUnit=c=>{ const d=DATA.find(x=>x.c===c); return d?d.u:null; };
const countU=u=>DATA.filter(d=>d.u===u).length;
const countC=c=>DATA.filter(d=>d.c===c).length;
// 某篇课文在短文（II·A 用）里被用到的词数，取覆盖最多的那篇
const passHits=c=>{ let m=0; PASS.forEach(p=>{ const n=p.seg.filter(s=>s.id&&s.id.split('|')[1]===c).length; if(n>m) m=n; }); return m; };

function activeUnit(){
  const s=prefs.scope||'all';
  if(s.indexOf('u:')===0) return s.slice(2);
  if(s.indexOf('ch:')===0) return chUnit(s.slice(3));
  return null;
}
function scopeUnitOf(arr){
  const us=[...new Set(arr.map(d=>d.u))];
  return us.length===1?us[0]:null;
}

function pool(){
  const s=prefs.scope||'all';
  if(s==='all') return DATA;
  if(s==='unmastered') return DATA.filter(d=>!mastered(d));
  if(s.indexOf('u:')===0) return DATA.filter(d=>d.u===s.slice(2));
  if(s.indexOf('tag:')===0) return DATA.filter(d=>d.t===s.slice(4));
  if(s.indexOf('ch:')===0) return DATA.filter(d=>d.c===s.slice(3));
  return DATA;
}

/* ---------- 首页 ---------- */
function renderHome(){
  $('sDone').textContent=store.stat.a||0;
  $('sOk').textContent=DATA.filter(mastered).length;
  $('sWrong').textContent=wrongList().length;

  $('typeList').innerHTML=TYPES.map(t=>
    `<button class="type${prefs.type===t.k?' on':''}" data-k="${t.k}">
      <span class="code">${t.code}</span>
      <span class="tx"><span class="nm">${t.nm}</span><span class="ds">${t.ds}</span></span>
    </button>`).join('');

  const au=null;  /* 只见单元，不做课文细分 */
  const top=[['all','全部',DATA.length]]
    .concat(unitsAll().map(u=>['u:'+u,(DATA.find(d=>d.u===u)||{}).c||u,countU(u)]))
    .concat([['unmastered','没掌握',DATA.filter(d=>!mastered(d)).length]]);
  $('scopeChips').innerHTML=top.map(([v,n,c])=>{
    const cls=prefs.scope===v?' on':(v.indexOf('u:')===0&&au===v.slice(2)?' parent':'');
    return `<button class="chip sm${cls}" data-s="${v}">${n}<span class="n">${c}</span></button>`;
  }).join('');

  if(au){
    $('chapLab').hidden=false; $('scopeSub').hidden=false;
    $('chapTitle').textContent='② 课文 · '+au;
    const subs=[['u:'+au,'整个单元',countU(au)]]
      .concat(chaptersOf(au).map(c=>['ch:'+c,c,countC(c)]));
    $('scopeSub').innerHTML=subs.map(([v,n,c])=>
      `<button class="chip sm${prefs.scope===v?' on':''}" data-s="${v}">${n}<span class="n">${c}</span></button>`).join('');
  }else{
    $('chapLab').hidden=true; $('scopeSub').hidden=true; $('scopeSub').innerHTML='';
  }

  const p=pool(), su=scopeUnitOf(p);
  let note='';
  if(prefs.type==='IIA' && (prefs.scope||'').indexOf('ch:')===0 && passHits(prefs.scope.slice(3))<5)
    note=' · 该课文无配文，II·A 用同单元短文';
  $('poolN').textContent='本组范围 '+p.length+' 词'+
    (p.length<SET?'（不足 '+SET+'，从'+(su?'同单元':'全书')+'补足）':'')+note;
}

/* ---------- 开始 ---------- */
function startSet(list, type){
  const t=type||prefs.type;
  const sc=list||pool();
  if(sc.length<3) toast('范围里的词太少，先选大一点的范围');
  set=build[t](sc);
  if(!set.items.length){ toast('这个范围出不了题，换一个范围'); return; }
  cursor=0; answered=set.items.map(()=>false); score=0; wrongD=[]; usedDefs=new Set();
  $('qtype').textContent=TYPES.find(x=>x.k===t).code+' · '+TYPES.find(x=>x.k===t).nm;
  $('prog').style.width='0%';
  show('quiz');
  renderItem();
}

/* ---------- 渲染当前题 ---------- */
function renderItem(){
  const it=set.items[cursor];
  $('cnt').textContent=(cursor+1)+' / '+set.items.length;
  $('score').textContent='得分 '+(+score.toFixed(1));
  $('prog').style.width=(cursor/set.items.length*100)+'%';
  const box=$('qbody');

  if(it.kind==='IA'){
    box.innerHTML=`
      <div class="stem"><div class="ln">第 ${slotNo()} 空 · 从词库中选词填入</div>
        ${esc(it.pre)}<span class="blank cur" id="blank">${answered[cursor]?'':''}</span>${esc(it.post)}</div>
      <div class="bank"><div class="btitle"><span>词库 ${set.bank.length} 词（含干扰词）</span><span>已用 <b id="usedN">0</b></span></div>
        <div class="bgrid" id="bgrid">${bankHTML()}</div></div>`;
  }else if(it.kind==='IIA'){
    const filled=slotFilled();
    box.innerHTML=`
      <div class="passage" id="passage">${passageHTML()}</div>
      <div class="bank"><div class="btitle"><span>词库 ${set.bank.length} 词（含干扰词）</span><span>已用 <b id="usedN">0</b></span></div>
        <div class="bgrid" id="bgrid">${bankHTML()}</div></div>`;
    const cur=$('passage').querySelector('.blank.cur');
  }else if(it.kind==='IB'){
    box.innerHTML=`
      <div class="stem"><div class="ln">划线词的意思是</div>
        ${esc(it.pre)}<span class="big ul">${esc(it.mid)}</span>${esc(it.post)}</div>
      <div class="deflist" id="dl">${set.defs.map((d,i)=>
        `<button class="drow${usedDefs.has(letter(i))?' used':''}" data-l="${letter(i)}">
          <span class="L">${letter(i)}</span><span>${esc(d)}</span></button>`).join('')}</div>`;
  }else{
    box.innerHTML=`
      <div class="stem"><div class="ln">根据释义选出正确的单词</div>
        <span class="big">${esc(it.d.e)}</span></div>
      <div class="opts" id="opts">${it.opts.map((o,i)=>
        `<button class="opt" data-i="${i}"><span class="i">${letter(i)}</span><span>${esc(o)}</span></button>`).join('')}</div>`;
  }

  if(it.kind==='IA'||it.kind==='IIA'){
    const n=[...set.bank].filter(b=>b.used).length;
    const u=$('usedN'); if(u) u.textContent=n;
  }
}

let usedDefs=new Set();
function slotNo(){ return cursor+1; }

function bankHTML(){
  return set.bank.map((b,i)=>
    `<button class="bw${b.used?' used':''}${b.ok?' ok':''}${b.no?' no':''}" data-i="${i}">${esc(b.w)}</button>`
  ).join('');
}

function passageHTML(){
  const p=set.pass;
  const map={}; set.items.forEach((it,k)=>{ map[it.slot]={k,it}; });
  let html='', cur=set.items[cursor];
  p.seg.forEach((s,i)=>{
    if(!s.id){ html+=esc(s.t); return; }
    const m=map[i];
    if(!m){ html+=esc(s.t); return; }
    const it=m.it, done=answered[m.k];
    const cls='blank'+(m.k===cursor?' cur':'')+(done?(it._good?' ok':(it._picked?' no':'')):'');
    const txt=done&&it._picked?esc(it._picked):'';
    html+=`<span class="${cls}">${txt||'&nbsp;'}</span><span class="bn">(${m.k+1})</span>`;
  });
  return html;
}

function slotFilled(){
  return set.items.map(it=>it._picked||'').filter(Boolean);
}

/* ---------- 作答 ---------- */
function bindQuiz(){
  $('qbody').addEventListener('click',e=>{
    const bw=e.target.closest('.bw');
    if(bw){ pickWord(+bw.dataset.i); return; }
    const dr=e.target.closest('.drow');
    if(dr){ pickDef(dr.dataset.l); return; }
    const op=e.target.closest('.opt');
    if(op){ pickOpt(+op.dataset.i); return; }
  });
}

function pickWord(idx){
  if(answered[cursor]) return;
  const b=set.bank[idx];
  if(!b||b.used) return;
  const it=set.items[cursor];
  const good=b.w===it.ans;
  answered[cursor]=true;
  b.used=true; b.ok=good; if(!good) b.no=false;
  if(!good){ /* 干扰词或错词：标红但归还 */ b.used=false; b.no=true; }
  it._picked=b.w; it._good=good;

  // 空格立即回填
  if(it.kind==='IA'){ const bl=$('blank'); if(bl){ bl.textContent=b.w; bl.classList.add(good?'ok':'no'); bl.classList.remove('cur'); } }
  if(it.kind==='IIA'){ const p=$('passage'); if(p) p.innerHTML=passageHTML(); }

  if(good){ score+=PTS[it.kind]; }
  else { wrongD.push(it.d); }

  // 答错时把正确词标绿
  if(!good){ const c=set.bank.find(x=>x.w===it.ans); if(c) c.ok=true; }
  rec(it.d,good);
  reveal(it,good);
}

function pickDef(L){
  if(answered[cursor]) return;
  const it=set.items[cursor];
  const good=L===it.ans;
  answered[cursor]=true; it._picked=L; it._good=good;
  if(good) score+=PTS[it.kind]; else wrongD.push(it.d);
  if(good) usedDefs.add(L);
  const rows=$('dl');
  if(rows){
    [...rows.children].forEach(r=>{
      if(r.dataset.l===L) r.classList.add(good?'ok':'no');
      if(!good&&r.dataset.l===it.ans) r.classList.add('ok');
      if(r.dataset.l===it.ans) r.classList.add('used');
    });
  }
  rec(it.d,good);
  reveal(it,good);
}

function pickOpt(i){
  if(answered[cursor]) return;
  const it=set.items[cursor];
  const good=i===it.ans;
  answered[cursor]=true; it._picked=i; it._good=good;
  if(good) score+=PTS[it.kind]; else wrongD.push(it.d);
  const box=$('opts');
  if(box) [...box.children].forEach((b,k)=>{
    if(k===i) b.classList.add(good?'ok':'no');
    if(!good&&k===it.ans) b.classList.add('ok');
  });
  rec(it.d,good);
  reveal(it,good);
}

/* ---------- 反馈弹层 ---------- */
function reveal(it,good){
  const d=it.d;
  const head=good?'<span class="verd ok">✓ 答对了</span>':'<span class="verd no">✕ 答错了</span>';
  let ansLine='';
  if(it.kind==='IB') ansLine=`<div class="def" style="margin:0 0 6px">正确项 <b>${it.ans}</b>：${esc(d.e)}</div>`;
  if(it.kind==='IC') ansLine=`<div class="def" style="margin:0 0 6px">正确项 <b>${letter(it.ans)}</b></div>`;

  const wrap=document.createElement('div');
  wrap.className='sheet-wrap';
  wrap.innerHTML=`<div class="sheet">
    ${head}
    ${ansLine}
    <div class="wline"><span class="w">${esc(d.w)}</span>
      <span class="ipa">${d.p?'/'+esc(d.p)+'/':''}</span>
      <button class="spk" data-say="${esc(d.w)}">🔊</button>
      <span class="ipa">${esc(d.o)}</span></div>
    <div class="zh">${esc(d.z)}</div>
    ${defOk(d.e)?`<div class="def">${esc(d.e)}</div>`:''}
    <div class="ex"><div class="en">${esc(d.x)}</div><div class="cn">${esc(d.y)}</div></div>
    <div class="acts"><button class="btn btn-main" id="btnNext">${cursor===set.items.length-1?'看结果':'下一题'}</button></div>
  </div>`;
  document.body.appendChild(wrap);
  $('score').textContent='得分 '+(+score.toFixed(1));
  $('prog').style.width=((cursor+1)/set.items.length*100)+'%';

  wrap.addEventListener('click',e=>{
    if(e.target.closest('[data-say]')){ say(e.target.closest('[data-say]').dataset.say); return; }
    if(e.target.closest('#btnNext')){ wrap.remove(); advance(); return; }
  });
  if(good&&prefs.autoSay) say(d.w);
}

function say(t){
  try{
    const u=new SpeechSynthesisUtterance(t); u.lang='en-US'; u.rate=.95;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}

function advance(){
  if(cursor===set.items.length-1){ finish(); return; }
  cursor++; renderItem();
}

/* ---------- 结果 ---------- */
function finish(){
  const full=+(set.items.length*PTS[set.kind]).toFixed(1);
  $('donePts').textContent=(+score.toFixed(1));
  $('doneFull').textContent=' / '+full;
  const right=set.items.length-wrongD.length;
  $('doneSub').textContent=`答对 ${right} / ${set.items.length} 题　正确率 ${Math.round(right/set.items.length*100)}%`;
  $('doneWrong').innerHTML=wrongD.length
    ? `<div class="lab"><span>这组答错的词</span><i>${wrongD.length}</i></div>
       <div class="rows">${wrongD.map(d=>`<div class="row"><span class="w">${esc(d.w)}</span><span class="z">${esc(d.z)}</span></div>`).join('')}</div>`
    : `<div class="empty"><b>全对</b>这一组没有答错的词</div>`;
  $('btnRetryWrong').hidden=!wrongD.length;
  show('done');
  renderHome();
}

/* ---------- 视图切换 ---------- */
function show(v){
  ['home','quiz','done','wrong','add'].forEach(k=>{ $('v-'+k).hidden=(k!==v); });
  $('btnBack').hidden=(v==='home');
  $('title').textContent={home:'大学英语 1 · 词汇',quiz:'答题',done:'本组结果',wrong:'错题本',add:'手动加词'}[v];
  $('subline').hidden=(v!=='home');
  try{ window.scrollTo(0,0); }catch(e){}
}

/* ---------- 错题本 ---------- */
function renderWrong(){
  const list=wrongList();
  $('wbN').textContent=list.length+' 词 · 答对自动移出';
  $('wbList').innerHTML=list.length
    ? `<div class="rows">${list.map(d=>{
        const c=store.cards[d.id];
        return `<div class="row"><span class="w">${esc(d.w)}</span><span class="z">${esc(d.z)}</span><span class="n">错 ${c.w}</span></div>`;
      }).join('')}</div>`
    : `<div class="empty"><b>错题本是空的</b>做几组题，答错的词会自动收进来<br>同一个词再答对一次就移出</div>`;
  $('btnPracticeWrong').disabled=!list.length;
  $('btnPracticeWrong').style.opacity=list.length?1:.45;
}

/* ---------- 事件 ---------- */
$('btnStart').onclick=()=>startSet();
$('btnBack').onclick=()=>{ if(!$('v-quiz').hidden&&set&&!confirm('退出这一组？本组进度不保留')) return; show('home'); renderHome(); };
$('btnWrong').onclick=()=>{ renderWrong(); show('wrong'); };
$('btnPracticeWrong').onclick=()=>{ const l=wrongList(); if(l.length) startSet(l); };

/* 重置错题本：只清掉错词标记，已练次数与掌握记录保持不变 */
$('btnResetWrong').onclick=()=>{
  const list=wrongList();
  if(!list.length){ toast('错题本已经是空的'); return; }
  if(!confirm('清空错题本？\n\n将移除 '+list.length+' 个错词的记录，已练次数和掌握数不变。此操作无法撤销。')) return;
  let n=0;
  list.forEach(d=>{ const c=store.cards[d.id]; if(c){ c.w=0; n++; } });
  save(); renderWrong(); renderHome();
  toast('已清空 '+n+' 个错词');
};
$('btnAgain').onclick=()=>startSet();
$('btnRetryWrong').onclick=()=>{ if(wrongD.length) startSet(wrongD.slice()); };
$('btnAddManual').onclick=()=>{ show('add'); };
$('btnAddClear').onclick=()=>{ $('addBox').value=''; $('addMsg').textContent=''; };

$('typeList').addEventListener('click',e=>{
  const b=e.target.closest('.type'); if(!b) return;
  prefs.type=b.dataset.k; savePrefs(); renderHome();
});
const pickScope=e=>{
  const b=e.target.closest('.chip'); if(!b) return;
  prefs.scope=b.dataset.s; savePrefs(); renderHome();
};
$('scopeChips').addEventListener('click',pickScope);
$('scopeSub').addEventListener('click',pickScope);

$('btnAddOk').onclick=()=>{
  const raw=$('addBox').value.trim();
  if(!raw){ $('addMsg').textContent='先贴几个词进来'; return; }
  const parts=raw.split(/[\n,;，；\s]+/).map(s=>s.trim().toLowerCase()).filter(Boolean);
  const hit=[],miss=[];
  parts.forEach(t=>{
    let d=byWord[t];
    if(!d){ const c=DATA.filter(x=>x.w.toLowerCase().startsWith(t)); if(c.length===1) d=c[0]; }
    if(d){ const c=cardOf(d); if(!c.w) c.w=1; c.l=0; c.t=Date.now(); hit.push(d.w); } else miss.push(t);
  });
  save(); renderHome();
  $('addMsg').innerHTML=`已加入 ${hit.length} 个${hit.length?'：'+esc(hit.join('、')):''}`+
    (miss.length?`<br>词库里没有：${esc(miss.join('、'))}`:'');
};

/* 导入 / 备份 */
function doImport(text){
  let added=0,skipped=0;
  const t=String(text||'').trim();
  let obj=null;
  try{ obj=JSON.parse(t); }catch(e){}
  if(obj&&obj.cards){
    Object.keys(obj.cards).forEach(k=>{
      const v=obj.cards[k]||{};
      const d=byId[k]||byWord[String(k).split('|')[0].trim().toLowerCase()];
      if(!d){ skipped++; return; }
      const c=cardOf(d);
      if((v.w||0)>0&&(v.l!==1)){ c.w=Math.max(c.w,v.w||1); c.l=0; added++; }
    });
  }else{
    t.split(/[\n,;，；\s"'\[\]{}|]+/).map(s=>s.trim().toLowerCase()).filter(Boolean).forEach(w=>{
      const d=byWord[w]||(DATA.filter(x=>x.w.toLowerCase().startsWith(w)).length===1?DATA.find(x=>x.w.toLowerCase().startsWith(w)):null);
      if(d){ const c=cardOf(d); if(!c.w) c.w=1; c.l=0; c.t=Date.now(); added++; } else skipped++;
    });
  }
  save(); renderHome();
  return {added,skipped};
}

function toast(msg){
  const el=document.createElement('div'); el.className='toast'; el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1800);
}

/* 弹层 */
function dlg(title,desc,val,okText,onOk){
  const wrap=document.createElement('div'); wrap.className='mask';
  wrap.innerHTML=`<div class="dlg"><h3>${esc(title)}</h3><p>${esc(desc)}</p>
    <textarea id="dlgBox"></textarea><div class="msg" id="dlgMsg"></div>
    <div class="acts"><button class="btn btn-ghost" id="dlgCancel">关闭</button>
    <button class="btn btn-main" id="dlgOk">${esc(okText)}</button></div></div>`;
  document.body.appendChild(wrap);
  const box=wrap.querySelector('#dlgBox'); box.value=val||'';
  wrap.querySelector('#dlgCancel').onclick=()=>wrap.remove();
  wrap.addEventListener('click',e=>{ if(e.target===wrap) wrap.remove(); });
  wrap.querySelector('#dlgOk').onclick=()=>{ onOk(box.value,wrap); };
  setTimeout(()=>box.focus(),80);
  return wrap;
}

$('btnExport').onclick=()=>{
  const w=dlg('备份进度','复制这段文本，换手机或清缓存后用「恢复进度」粘回来。',JSON.stringify(store),'复制',(v,wrap)=>{
    const box=wrap.querySelector('#dlgBox'); box.select();
    try{ document.execCommand('copy'); wrap.querySelector('#dlgOk').textContent='已复制 ✓'; }
    catch(e){ wrap.querySelector('#dlgOk').textContent='请长按手动复制'; }
  });
};
$('btnImportBak').onclick=()=>{
  dlg('恢复进度','把备份内容整段粘进来，会覆盖当前进度。','','恢复',(v,wrap)=>{
    try{
      const o=JSON.parse(v); if(!o||!o.cards) throw 0;
      store=o; if(!store.stat) store.stat={a:0,r:0}; save();
      wrap.remove(); renderHome(); show('home');
      toast('已恢复 '+Object.keys(o.cards).length+' 条记录');
    }catch(e){ wrap.querySelector('#dlgMsg').textContent='格式不对，要贴完整的备份文本'; }
  });
};
$('btnImport').onclick=()=>{
  const wrap=document.createElement('div'); wrap.className='mask';
  wrap.innerHTML=`<div class="dlg"><h3>从别处导入错词</h3>
    <p>支持：闪卡的进度 JSON、本应用备份、纯词表（一行一个）。</p>
    <div class="acts" style="margin-top:0">
      <button class="btn btn-ghost" id="impClip">读剪贴板</button>
      <button class="btn btn-ghost" id="impFile">选文件</button>
    </div>
    <textarea id="impBox" style="margin-top:10px" placeholder="也可以直接粘贴到这里"></textarea>
    <div class="msg" id="impMsg"></div>
    <div class="acts"><button class="btn btn-ghost" id="impCancel">关闭</button>
      <button class="btn btn-main" id="impOk">导入</button></div>
    <input type="file" id="fileInput" accept=".json,.txt,text/plain,application/json" hidden></div>`;
  document.body.appendChild(wrap);
  const box=wrap.querySelector('#impBox'), msg=wrap.querySelector('#impMsg');
  const run=(text)=>{
    if(!String(text||'').trim()){ msg.textContent='没有内容'; return; }
    const r=doImport(text);
    msg.textContent=`导入了 ${r.added} 个错词`+(r.skipped?`，${r.skipped} 个没匹配上`:'');
    setTimeout(()=>{ wrap.remove(); renderWrong(); },700);
  };
  wrap.querySelector('#impClip').onclick=async()=>{
    try{ const t=await navigator.clipboard.readText(); box.value=t; run(t); }
    catch(e){ msg.textContent='读不到剪贴板，请手动粘贴'; }
  };
  wrap.querySelector('#impFile').onclick=()=>wrap.querySelector('#fileInput').click();
  wrap.querySelector('#fileInput').onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    const rd=new FileReader(); rd.onload=()=>{ box.value=rd.result; run(rd.result); }; rd.readAsText(f);
  };
  wrap.querySelector('#impCancel').onclick=()=>wrap.remove();
  wrap.querySelector('#impOk').onclick=()=>run(box.value);
  wrap.addEventListener('click',e=>{ if(e.target===wrap) wrap.remove(); });
};

bindQuiz();
renderHome();
show('home');

  w.hidden=false;

/* 链接导入：#w=sexism,bias */
(function(){
  const m=location.hash.match(/[#&]w=([^&]+)/);
  if(!m) return;
  try{
    doImport(decodeURIComponent(m[1]).replace(/\+/g,' '));
    history.replaceState(null,'',location.pathname+location.search);
    renderWrong(); show('wrong');
  }catch(e){}
})();
</script>
