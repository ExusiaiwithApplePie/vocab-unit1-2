<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f3ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="词汇刷题">
<title>学术英语 1 词汇刷题 · Unit 1–2</title>
<link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiByeD0iMTQiIGZpbGw9IiMxZjI0MzAiLz48dGV4dCB4PSIzMiIgeT0iNDQiIGZvbnQtc2l6ZT0iMjkiIGZvbnQtZmFtaWx5PSJIZWx2ZXRpY2EsQXJpYWwsc2Fucy1zZXJpZiIgZm9udC13ZWlnaHQ9IjcwMCIgZmlsbD0iI2ZmZmZmZiIgdGV4dC1hbmNob3I9Im1pZGRsZSI+QTE8L3RleHQ+PC9zdmc+">
<style>
:root{
  --bg:#f4f3ef; --card:#fff; --ink:#16171a; --ink2:#6d7178; --ink3:#9aa0a6;
  --line:#e7e5df; --ok:#18794e; --no:#b4362b;
  --okbg:#e8f4ec; --nobg:#fbeae8; --warn:#8a5a00;
  --acc:#16171a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:600px;margin:0 auto;padding:14px 14px calc(26px + env(safe-area-inset-bottom))}

/* 顶栏 */
.hd{display:flex;align-items:center;gap:10px;margin:2px 0 2px}
.hd h1{margin:0;font-size:19px;font-weight:680;letter-spacing:-.01em;flex:1}
.icon{border:0;background:transparent;color:var(--ink2);font-size:13.5px;padding:6px 2px;cursor:pointer}
.sub{margin:0 0 14px;font-size:12px;color:var(--ink3);line-height:1.5}

.warnbar{background:#fff7e6;border:1px solid #f0dfb8;color:var(--warn);font-size:12px;line-height:1.55;padding:9px 11px;border-radius:10px;margin:0 0 12px}

/* 统计 */
.stats{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 4px;margin-bottom:14px}
.stats>div{flex:1;text-align:center;position:relative}
.stats>div+div::before{content:"";position:absolute;left:0;top:15%;height:70%;width:1px;background:var(--line)}
.stats b{display:block;font-size:19px;font-weight:680;font-variant-numeric:tabular-nums}
.stats span{font-size:11px;color:var(--ink3)}
.stats .ok b{color:var(--ok)}
.stats .no b{color:var(--no)}

/* 题型卡 */
.lab{font-size:11.5px;color:var(--ink3);letter-spacing:.04em;margin:16px 0 8px;display:flex;justify-content:space-between}
.lab i{font-style:normal;color:var(--ink3)}
.types{display:flex;flex-direction:column;gap:8px}
.type{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:13px;padding:12px 13px;cursor:pointer;font:inherit;color:inherit;transition:.15s}
.type .code{flex:none;width:44px;height:44px;border-radius:11px;background:#f0eee8;color:var(--ink2);
  display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;letter-spacing:.02em}
.type .tx{flex:1;min-width:0}
.type .nm{font-weight:640;font-size:14.5px;margin-bottom:2px}
.type .ds{font-size:11.5px;color:var(--ink3);line-height:1.45}
.type.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.type.on .code{background:var(--acc);color:#fff}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink2);font:inherit;font-size:12.5px;
  padding:6px 11px;border-radius:20px;cursor:pointer;transition:.15s;white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}

.acts2{display:flex;gap:9px;margin:18px 0 4px}
.btn{flex:1;border:0;border-radius:12px;padding:13px;font:inherit;font-size:15px;font-weight:620;cursor:pointer}
.btn-main{background:var(--acc);color:#fff}
.btn-ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn-sm{padding:9px 12px;font-size:13px;border-radius:10px;flex:none}

/* 答题 */
.pbar{height:3px;background:#e6e3dc;border-radius:3px;overflow:hidden;margin:6px 0 12px}
.pbar>i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.qhead{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink3);margin-bottom:10px}
.qhead .t{font-weight:600;color:var(--ink2)}
.qhead .r{margin-left:auto;font-variant-numeric:tabular-nums}

.stem{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px 14px;font-size:16px;line-height:1.85}
.stem .ln{font-size:11.5px;color:var(--ink3);margin-bottom:7px;font-weight:500}
.big{font-weight:680;letter-spacing:-.01em}
.big.ul{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px}
.big.bd{font-weight:800}
.blank{display:inline-block;min-width:74px;text-align:center;border-bottom:1.6px solid var(--ink3);
  margin:0 3px;font-weight:640;color:var(--ink3);vertical-align:baseline;padding:0 4px}
.blank.cur{border-bottom-color:var(--acc);background:#f0eee6;border-radius:4px 4px 0 0}
.blank.ok{border-bottom-color:var(--ok);color:var(--ok)}
.blank.no{border-bottom-color:var(--no);color:var(--no);text-decoration:line-through}

/* 词库 */
.bank{margin-top:12px}
.btitle{font-size:11.5px;color:var(--ink3);margin:0 0 8px;display:flex;justify-content:space-between}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.bw{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13.5px;
  padding:10px 4px;border-radius:9px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:.12s}
.bw:active{transform:scale(.97)}
.bw.used{color:#c3c0b8;text-decoration:line-through;background:#f7f6f2;border-style:dashed}
.bw.ok{background:var(--okbg);border-color:#a9d7bd;color:var(--ok);font-weight:640}
.bw.no{background:var(--nobg);border-color:#e8b5b0;color:var(--no)}
.bw.ok::after{content:" ✓"}
.bw.no::after{content:" ✕"}

/* 定义列表 (I·B) */
.deflist{margin-top:12px;display:flex;flex-direction:column;gap:7px}
.drow{display:flex;gap:9px;align-items:flex-start;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:10px;padding:10px 11px;font:inherit;font-size:13px;line-height:1.5;cursor:pointer;color:inherit}
.drow .L{flex:none;width:19px;font-weight:700;color:var(--ink2);font-size:12.5px}
.drow.used{background:#f7f6f2;color:#bcb9b1;border-style:dashed}
.drow.used .L{color:#cbc8c0}
.drow.ok{background:var(--okbg);border-color:#a9d7bd}
.drow.ok .L{color:var(--ok)}
.drow.no{background:var(--nobg);border-color:#e8b5b0}
.drow.no .L{color:var(--no)}

/* 选项 (I·C) */
.opts{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:11px;padding:11px 12px;font:inherit;font-size:13.5px;line-height:1.55;cursor:pointer;color:inherit}
.opt .i{flex:none;width:20px;height:20px;border-radius:6px;background:#f0eee8;color:var(--ink2);
  display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700}
.opt.ok{background:var(--okbg);border-color:#a9d7bd}
.opt.ok .i{background:var(--ok);color:#fff}
.opt.no{background:var(--nobg);border-color:#e8b5b0}
.opt.no .i{background:var(--no);color:#fff}

/* 短文 (II·A) */
.passage{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px;
  font-size:15px;line-height:2.05;max-height:42vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.passage .ttl{font-size:12px;color:var(--ink3);margin-bottom:6px}
.passage .blank{min-width:58px}
.passage .bn{display:inline-block;min-width:22px;text-align:center;font-size:10.5px;color:var(--ink3);vertical-align:super;margin-left:1px}

/* 底部反馈 */
.sheet-wrap{position:fixed;inset:0;background:rgba(20,20,22,.34);display:flex;align-items:flex-end;z-index:40;padding:0}
.sheet{background:var(--card);width:100%;max-width:600px;margin:0 auto;border-radius:18px 18px 0 0;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom));animation:up .22s ease-out;max-height:86vh;overflow-y:auto}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet .verd{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:640;margin-bottom:10px}
.sheet .verd.ok{color:var(--ok)}
.sheet .verd.no{color:var(--no)}
.sheet .wline{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:4px}
.sheet .w{font-size:21px;font-weight:700;letter-spacing:-.01em}
.sheet .ipa{font-size:12.5px;color:var(--ink3)}
.spk{border:1px solid var(--line);background:var(--card);border-radius:8px;font-size:12px;padding:3px 8px;cursor:pointer;color:var(--ink2)}
.sheet .def{font-size:12.8px;color:var(--ink2);margin:6px 0 0;line-height:1.6}
.sheet .zh{font-size:13.5px;margin:2px 0 0}
.sheet .ex{margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);font-size:12.8px;line-height:1.65}
.sheet .ex .en{color:var(--ink)}
.sheet .ex .cn{color:var(--ink3);margin-top:2px}
.sheet .acts{display:flex;gap:9px;margin-top:14px}

/* 结果 / 错题本 */
.score{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 16px;text-align:center;margin-bottom:12px}
.score b{display:block;font-size:36px;font-weight:750;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.score b small{font-size:15px;color:var(--ink3);font-weight:600}
.score p{margin:6px 0 0;font-size:12.5px;color:var(--ink2)}
.rows{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden}
.row{display:flex;gap:10px;align-items:center;padding:11px 13px;border-bottom:1px solid var(--line);font-size:13.5px}
.row:last-child{border-bottom:0}
.row .w{font-weight:620;flex:none;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .z{color:var(--ink3);font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .n{color:var(--no);font-size:11.5px;flex:none}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:13px;padding:26px 18px;text-align:center;
  color:var(--ink3);font-size:12.8px;line-height:1.7}
.empty b{display:block;color:var(--ink2);font-size:14px;margin-bottom:5px}

/* 通用弹层 */
.mask{position:fixed;inset:0;background:rgba(20,20,22,.4);display:flex;align-items:center;justify-content:center;z-index:50;padding:18px}
.dlg{background:var(--card);border-radius:16px;width:100%;max-width:460px;padding:18px;max-height:80vh;overflow-y:auto}
.dlg h3{margin:0 0 6px;font-size:15.5px}
.dlg p{margin:0 0 10px;font-size:12px;color:var(--ink3);line-height:1.6}
.dlg textarea{width:100%;height:130px;border:1px solid var(--line);border-radius:10px;padding:10px;
  font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical;color:var(--ink);background:#fbfaf7}
.dlg .acts{display:flex;gap:9px;margin-top:12px}
.msg{font-size:12px;color:var(--ink2);margin-top:8px;line-height:1.6}
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:rgba(24,24,26,.93);color:#fff;font-size:13px;padding:10px 16px;border-radius:20px;z-index:99;max-width:80vw;text-align:center}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="app">

  <div class="hd">
    <h1 id="title">学术英语词汇刷题</h1>
    <button class="icon" id="btnBack" hidden>返回</button>
  </div>
  <p class="sub" id="subline">《大学学术英语读写教程》上册 · Unit 1–2 · 243 词</p>

  <!-- 首页 -->
  <section id="v-home">
    <div class="warnbar" id="storeWarn" hidden>当前打开方式无法保存进度，关掉页面记录就没了。请把文件用手机自带浏览器（Safari / Chrome）打开，别用微信内置预览。</div>

    <div class="stats">
      <div><b id="sDone">0</b><span>已练</span></div>
      <div class="ok"><b id="sOk">0</b><span>掌握</span></div>
      <div class="no"><b id="sWrong">0</b><span>错词</span></div>
    </div>

    <div class="lab"><span>选择题型</span><i>每组 10 题</i></div>
    <div class="types" id="typeList"></div>

    <div class="lab"><span>出题范围</span><i id="poolN"></i></div>
    <div class="chips" id="scopeChips"></div>

    <div class="acts2">
      <button class="btn btn-main" id="btnStart">开始做题</button>
      <button class="btn btn-ghost" id="btnWrong">错题本</button>
    </div>
  </section>

  <!-- 答题 -->
  <section id="v-quiz" hidden>
    <div class="qhead">
      <span class="t" id="qtype"></span>
      <span id="cnt"></span>
      <span class="r" id="score"></span>
    </div>
    <div class="pbar"><i id="prog"></i></div>
    <div id="qbody"></div>
  </section>

  <!-- 结果 -->
  <section id="v-done" hidden>
    <div class="score">
      <b><span id="donePts">0</span><small id="doneFull"> / 15</small></b>
      <p id="doneSub"></p>
    </div>
    <div id="doneWrong"></div>
    <div class="acts2" style="margin-top:14px">
      <button class="btn btn-main" id="btnAgain">再来一组</button>
      <button class="btn btn-ghost" id="btnRetryWrong" hidden>只刷这组错的</button>
    </div>
  </section>

  <!-- 错题本 -->
  <section id="v-wrong" hidden>
    <div class="lab"><span>错题本</span><i id="wbN"></i></div>
    <div id="wbList"></div>
    <div class="acts2" style="margin-top:14px">
      <button class="btn btn-main" id="btnPracticeWrong">练这些错词</button>
      <button class="btn btn-ghost" id="btnAddManual">手动加词</button>
    </div>
    <div class="chips" style="margin-top:10px">
      <button class="chip" id="btnImport">从别处导入</button>
      <button class="chip" id="btnExport">备份进度</button>
      <button class="chip" id="btnImportBak">恢复进度</button>
      <button class="chip" id="btnResetWrong">重置错题本</button>
    </div>
  </section>

  <!-- 手动加词 -->
  <section id="v-add" hidden>
    <div class="lab"><span>手动加词</span><i>会加入错题本</i></div>
    <textarea id="addBox" style="width:100%;height:150px;border:1px solid var(--line);border-radius:12px;padding:11px;font:13px/1.6 inherit;background:#fff;color:var(--ink)"></textarea>
    <p class="msg">一行一个，或用逗号、空格分开。输前几个字母也认（输 amor 会命中 amorphous）。</p>
    <div class="acts2">
      <button class="btn btn-main" id="btnAddOk">加入</button>
      <button class="btn btn-ghost" id="btnAddClear">清空</button>
    </div>
    <div class="msg" id="addMsg"></div>
  </section>
</div>

<script>

"id":"negative|Ch1 R3"},{"w":"positive","p":"ˈpɒzətɪv","o":"adj","e":"directed at dealing with sth. or producing a successful result","z":"积极的，建设性的；朝着成功的","x":"It will require positive action by all in the industry.","y":"这将需要业内全体同人和衷共济。","c":"Ch1 R3","u":"Unit 1","t":"学术","id":"positive|Ch1 R3"},{"w":"disobedient","p":"ˌdɪsəˈbi:diənt","o":"adj","e":"failing or refusing to obey","z":"不服从的；违抗的","x":"Her tone was that of a parent to a disobedient child.","y":"她的语气就像是一个家长在训自己不听话的孩子。","c":"Ch1 R3","u":"Unit 1","t":"六级","id":"disobedient|Ch1 R3"},{"w":"assume","p":"əˈsju:m","o":"v","e":"to think or accept that sth. is true but without having proof of it","z":"假定；认为","x":"It is reasonable to assume that the economy will continue to improve.","y":"认为经济将继续好转是有道理的。","c":"Ch1 R3","u":"Unit 1","t":"学术","id":"assume|Ch1 R3"},{"w":"reveal","p":"rɪˈvi:l","o":"v","e":"to make sth. known to sb.","z":"揭示；显示；透露","x":"The report reveals that the company made a loss of £20 million last year.","y":"报告显示，公司去年亏损2000万英镑。","c":"Ch1 R3","u":"Unit 1","t":"四级","id":"reveal|Ch1 R3"},{"w":"chore","p":"tʃɔ:(r)","o":"n","e":"a task that you do regularly","z":"日常事务；例行工作","x":"My husband and I both go out to work so we share the household chores.","y":"我和丈夫都出去工作，所以我们家务活分摊。","c":"Ch1 R3","u":"Unit 1","t":"四级","id":"chore|Ch1 R3"},{"w":"trait","p":"treɪt","o":"n","e":"a particular quality in your personality","z":"（个性方面的）特征，特点","x":"Creativity is a human trait.","y":"创造力是人类的一种特性。","c":"Ch1 R3","u":"Unit 1","t":"六级","id":"trait|Ch1 R3"},{"w":"circumstance","p":"ˈsɜ:kəmstəns","o":"n","e":"(usu pl.) the conditions and facts that are connected with and affect a situation, an event or an action","z":"（常复数）条件，环境，状况","x":"I know I can trust her in any circumstance.","y":"我知道我在任何情况下都能信任她。","c":"Ch1 R3","u":"Unit 1","t":"学术","id":"circumstance|Ch1 R3"},{"w":"influence","p":"ˈɪnfluəns","o":"n","e":"the power to affect the way sb. or sth. develops, behaves, or thinks, without using direct force or orders","z":"影 ，明白的，知道的","x":"Mr. Braley has been made aware of the need for absolute secrecy.","y":"布雷利先生被告知需要绝对保密。","c":"Ch2 R1","u":"Unit 1","t":"学术","id":"aware|Ch2 R1"},{"w":"courtesy","p":"ˈkɜ:təsi","o":"n","e":"polite behaviour and respect for other people","z":"有礼的举止，礼貌","x":"It’s a matter of common courtesy to acknowledge letters.","y":"确认收到来信是起码的礼貌。","c":"Ch2 R1","u":"Unit 1","t":"六级","id":"courtesy|Ch2 R1"},{"w":"violation","p":"ˌvaɪəˈleɪʃn","o":"n","e":"an action that breaks a law, agreement, principle, etc.","z":"（对法律、协议、原则等的）违背，违反","x":"Troops crossed the border in violation of the agreement.","y":"部队违反协议，越过了边界。","c":"Ch2 R1","u":"Unit 1","t":"学术","id":"violation|Ch2 R1"},{"w":"severe","p":"sɪˈvɪə(r)","o":"adj","e":"(problems, injuries, illnesses, etc.) very bad or serious","z":"（问题、伤势、疾病等）很严重的","x":"His injuries were quite severe.","y":"他的伤势很严重。","c":"Ch2 R1","u":"Unit 1","t":"四级","id":"severe|Ch2 R1"},{"w":"enforce","p":"ɪnˈfɔ:s","o":"v","e":"to make people obey a rule or law","z":"执行，实施（法律）","x":"Parking restrictions will be strictly enforced.","y":"停车限制将会严格执行。","c":"Ch2 R1","u":"Unit 1","t":"学术","id":"enforce|Ch2 R1"},{"w":"crime","p":"kraɪm","o":"n","e":"illegal activities in general","z":"（泛指）犯罪活动","x":"We moved here because there was very little crime.","y":"我们搬到这里来是因为这里的犯罪率很低。","c":"Ch2 R1","u":"Unit 1","t":"四级","id":"crime|Ch2 R1"},{"w":"underlying","p":"ˌʌndəˈlaɪɪŋ","o":"adj","e":"in the nature of sth. though not readily apparent","z":"潜在的；根本的","x":"There is an underlying assumption that younger workers are easier to train.","y":"有一种潜在的假设，认为年轻一些的雇员容易培训。","c":"Ch2 R1","u":"Unit 1","t":"六级","id":"underlying|Ch2 R1"},{"w":"humility","p":"hju:ˈmɪləti","o":"n","e":"the quality of not being too proud about yourself","z":"谦逊，谦恭","x":"Her first defeat was an early lesson in humility.","y":"她的第一次失败使她很早便懂得了谦逊。","c":"Ch2 R1","u":"Unit 1","t":"六级","id":"humility|Ch2 R1"},{"w":"persist","p":"pəˈsɪst","o":"v","e":"to continue to exist","z":"持续；存留","x":"Fog will persist throughout the night.","y":"雾将整夜不散。","c":"Ch2 R1","u":"Unit 1","t":"学术","id":"persist|Ch2 R1"},{"w":"fertility","p":"fəˈtɪləti","o":"n","e":"the ability of a person, animal, or plant to produce babies, young animals, or seeds","z":"多产，生育能力，繁殖力","x":"Eggs symbolize fertility in some culture.","y":"某些文化中，蛋是多产的象征。","c":"Ch2 R1","u":"Unit 1","t":"四级","id":"fertility|Ch2 R1"},{"w":"peer","p":"pɪə(r)","o":"n","e":"the people who are the same age, or who have the same type of job, social class, etc.","z":"同龄人；社会地位相同的人","x":"American children did less well in math than their peers in Japan.","y":"美国儿童的数学成绩不如日本的同龄儿童。","c":"Ch2 R2","u":"Unit 1","t":"四级","id":"peer|Ch2 R2"},{"w":"adolescence","p":"ˌædəˈlesns","o":"n","e":"the time, usually between the ages of 12 and 18, when a young person is developing into an adult","z":"青春期","x":"No one wants to go through adolescence again.","y":"没人想再一次经历青春期。","c":"Ch2 R2","u":"Unit 1","t":"六级","id":"adolescence|Ch2 R2"},{"w":"involve","p":"ɪnˈvɒlv","o":"v","e":"cause sb./sth. to take part in (an activity or a situation)","z":"使…参与（某活动）或陷入（某情况）","x":"We want to involve the workforce at all stages of the decision-making process.","y":"我们希望让职员全程参与决策。","c":"Ch2 R2","u":"Unit 1","t":"学术","id":"involve|Ch2 R2"},{"w":"be involved with","p":"","o":"phr.","e":"to connect closely","z":"涉及，与…有关联","x":"I don’t want my son to be involved with criminals.","y":"我不想让我的儿子同犯罪分子来往。","c":"Ch2 R2","u":"Unit 1","t":"学术","id":"be involved with|Ch2 R2"},{"w":"authority","p":"ɔ:ˈθɒrəti","o":"n","e":"power to give orders and make others obey","z":"权力；权威","x":"Only the president has the authority to declare war.","y":"只有总统才有权宣战。","c":"Ch2 R2","u":"Unit 1","t":"学术","id":"authority|Ch2 R2"},{"w":"ignore","p":"ɪgˈnɔ:(r)","o":"v","e":"to deliberately pay no attention to sth. that you have been told or that you know about","z":"（故意对知道的事）置之不理","x":"You can’t ignore the fact that many criminals never go to prison.","y":"你不能无视很多罪犯从未获刑的事实。","c":"Ch2 R2","u":"Unit 1","t":"学术","id":"ignore|Ch2 R2"},{"w":"rebel","p":"rɪˈbel","o":"v","e":"to oppose or fight against someone in a position of control","z":"反叛","x":"The people have rebelled against their foreign rulers.","y":"人民反抗他们的外国统治者。","c":"Ch2 R2","u":"Unit 1","t":"四级","id":"rebel|Ch2 R2"},{"w":"rebellious","p":"rɪˈbeljəs","o":"adj","e":"disobedient and hard to control","z":"反抗的，难控制的，反叛的","x":"The rebellious troops attempted to subvert the present government.","y":"叛军曾企图推翻现政府。","c":"Ch2 R2","u":"Unit 1","t":"四级","id":"rebellious|Ch2 R2"},{"w":"individualism","p":"ˌɪndɪˈvɪdʒuəlɪzəm","o":"n","e":"the belief that the rights and freedom of individual people are the most important rights in a society","z":"个人主义（视个人权利和自由至上的信仰）","x":"Capitalism encourages competition and individualism.","y":"资本主义鼓励竞争，提倡个人主义。","c":"Ch2 R2","u":"Unit 1","t":"四级","id":"individualism|Ch2 R2"},{"w":"distinct","p":"dɪˈstɪŋkt","o":"adj","e":"clearly different or separate","z":"明显的，独特的","x":"The party split into two distinct groups.","y":"该党分裂成两个截然不同的团体。","c":"Ch2 R2","u":"Unit 1","t":"学术","id":"distinct|Ch2 R2"},{"w":"celebrity","p":"səˈlebrəti","o":"n","e":"a famous living person","z":"名人，明星","x":"He’s a national celebrity.","y":"他是全国有名的人物。","c":"Ch2 R2","u":"Unit 1","t":"六级","id":"celebrity|Ch2 R2"},{"w":"recreation","p":"ˌrekriˈeɪʃn","o":"n","e":"an activity that you do for pleasure or amusement","z":"娱乐，消遣","x":"His only recreations are drinking beer and watching football.","y":"他唯一的消遣就是喝啤酒、看球赛。","c":"Ch2 R2","u":"Unit 1","t":"四级","id":"recreation|Ch2 R2"},{"w":"incline","p":"ɪnˈklaɪn","o":"v","e":"to influence someone towards a particular action or opinion","z":"使倾向于（某种行动或观点）","x":"The accident inclined him to reconsider his career.","y":"这次意外使他重新考虑他的职业。","c":"Ch2 R2","u":"Unit 1","t":"四级","id":"incline|Ch2 R2"},{"w":"be inclined to","p":"","o":"phr.","e":"to have a tendency to do","z":"倾向于…","x":"The car is inclined to stall when it’s cold outside.","y":"这辆汽车天冷时爱熄火。","c":"Ch2 R2","u":"Unit 1","t":"四级","id":"be inclined to|Ch2 R2"},{"w":"financial","p":"faɪˈnænʃl","o":"adj","e":"relating to money or the management of money","z":"财政的，金融的，财务的","x":"Organic farmers should be encouraged with financial incentives.","y":"应对实行有机栽培的农民给予经济上的鼓励。","c":"Ch2 R2","u":"Unit 1","t":"四级","id":"financial|Ch2 R2"},{"w":"approval","p":"əˈpru:vl","o":"n","e":"feeling or showing or saying that one thinks sth. is good or acceptable or satisfactory","z":"赞成；认可；满意；同意","x":"The president has already given his approval to the plan.","y":"总统已经批准了这个计划。","c":"Ch2 R2","u":"Unit 1","t":"四级","id":"approval|Ch2 R2"},{"w":"conformity","p":"kənˈfɔ:məti","o":"n","e":"behaving in the same way as most other people","z":"遵从，一致","x":"We must act in conformity with local regulations.","y":"我们必须按当地的法规行事。","c":"Ch2 R2","u":"Unit 1","t":"学术","id":"conformity|Ch2 R2"},{"w":"exclude","p":"ɪkˈsklu:d","o":"v","e":"to deliberately not include sth.","z":"（故意）不包括；把…排除在外","x":"The judges decided to exclude evidence which had been unfairly attained.","y":"法官裁决不接纳以不正当手段获取的证据。","c":"Ch2 R2","u":"Unit 1","t":"四级","id":"exclude|Ch2 R2"},{"w":"clique","p":"klik","o":"n","e":"a small group of people who think they are special and do not want other people to join them","z":"派系；小圈子；小集团（含贬义）","x":"All of the cliques were formed by high school students.","y":"这些都是由中学生组成的小圈子。","c":"Ch2 R2","u":"Unit 1","t":"六级","id":"clique|Ch2 R2"},{"w":"bullying","p":"ˈbuliŋ","o":"n","e":"the act of intimidating a weaker person to make them do sth.","z":"欺凌，恃强凌弱的行为","x":"She measured \"bullying incidents\" by distributing surveys to both the students and the teachers and found the answers to be remarkably consistent.","y":"她就“欺负事件”的发生次数向老师和同学进行了调查，发现两者的答案高度一致。","c":"Ch2 R2","u":"Unit 1","t":"四级","id":"bullying|Ch2 R2"},{"w":"tease","p":"tiz","o":"v","e":"to laugh at someone and make jokes in order to have fun by embarrassing them, either in a friendly way or in an unkind way","z":"戏弄，逗弄；拿…开玩笑","x":"Don’t get upset. I was only teasing.","y":"别生气，我只是在逗你玩。","c":"Ch2 R2","u":"Unit 1","t":"六级","id":"tease|Ch2 R2"},{"w":"harassment","p":"ˈhærəsmənt","o":"n","e":"the act of tormenting by continued persistent attacks and criticism","z":"骚扰","x":"African-Americans have been complaining about police harassment for years.","y":"美国黑人多年来一直抱怨受到警察的骚扰。","c":"Ch2 R2","u":"Unit 1","t":"六级","id":"harassment|Ch2 R2"},{"w":"abuse","p":"əˈbju:s","o":"n","e":"cruel or violent treatment of someone","z":"虐待","x":"Many children suffer racial abuse at school.","y":"许多孩子在学校遭受种族虐待。","c":"Ch2 R2","u":"Unit 1","t":"四级","id":"abuse|Ch2 R2"},{"w":"be involved in","p":"","o":"phr.","e":"to engage as a participant","z":"包括到…中，被卷入…中","x":"Try to focus on the processes and people that will be involved in bringing your vision to reality.","y":"尽量聚焦于将您的远景变为现实所涉及到的流程和人员。","c":"Ch2 R3","u":"Unit 1","t":"四级","id":"be involved in|Ch2 R3"},{"w":"collective","p":"kəˈlektɪv","o":"adj","e":"shared or made by every member of a group or society","z":"集体的，共同的，共有的","x":"This is our collective responsibility for the environment.","y":"这是我们对环境的共同责任。","c":"Ch2 R3","u":"Unit 1","t":"四级","id":"collective|Ch2 R3"},{"w":"spontaneous","p":"spɒnˈteɪniəs","o":"adj","e":"said or done without having been planned or written in advance","z":"自发的；一时冲动的","x":"The crowd gave a spontaneous cheer.","y":"人群自发地欢呼起来。","c":"Ch2 R3","u":"Unit 1","t":"四级","id":"spontaneous|Ch2 R3"},{"w":"institutional","p":"ˌɪnstɪˈtju:ʃənl","o":"adj","e":"existing for a long time in an organization","z":"已形成制度的；惯例的","x":"There are accusations of institutional racism in the police force.","y":"对警察队伍中形成风气的种族主义有谴责的声音。","c":"Ch2 R3","u":"Unit 1","t":"四级","id":"institutional|Ch2 R3"},{"w":"occur","p":"əˈkɜ:(r)","o":"v","e":"to happen","z":"发生","x":"A third of accidental deaths occur in the home.","y":"有三分之一的意外死亡发生在家里。","c":"Ch2 R3","u":"Unit 1","t":"四级","id":"occur|Ch2 R3"},{"w":"religious","p":"rɪˈlɪdʒəs","o":"adj","e":"relating to religion in general or to a particular religion","z":"宗教的","x":"I don’t share her religious beliefs.","y":"我的宗教信仰和她的不同。","c":"Ch2 R3","u":"Unit 1","t":"四级","id":"religious|Ch2 R3"},{"w":"categorize","p":"ˈkætəɡəraɪz","o":"v","e":"to put people or things into groups according to the type of person or thing they are","z":"对…进行分类","x":"The population is categorized according to age, gender, and social group.","y":"人口根据年龄、性别和社会群体进行了分类。","c":"Ch2 R3","u":"Unit 1","t":"四级","id":"categorize|Ch2 R3"},{"w":"protest","p":"prəˈtest","o":"v","e":"express strong disagreement or disapproval about sth.","z":"抗议，反对","x":"Demonstrators protested outside the country’s embassies all over Europe.","y":"该国驻欧洲各国的大使馆外都有群众进行抗议。","c":"Ch2 R3","u":"Unit 1","t":"四级","id":"protest|Ch2 R3"},{"w":"tragedy","p":"ˈtrædʒədi","o":"n","e":"a very sad event that shocks people","z":"悲剧性事件，惨剧","x":"The tragedy happened as they were returning home from a night out.","y":"悲剧发生在他们夜里外出归来的路上。","c":"Ch2 R3","u":"Unit 1","t":"四级","id":"tragedy|Ch2 R3"},{"w":"hostile","p":"ˈhɒstaɪl","o":"adj","e":"angry and deliberately unfriendly towards someone, and ready to argue with them","z":"怀有敌意的，敌对的，不友善的","x":"Southampton fans gave their former coach a hostile reception.","y":"南安普敦队的球迷对前任教练很不友善。","c":"Ch2 R3","u":"Unit 1","t":"四级","id":"hostile|Ch2 R3"},{"w":"violent","p":"ˈvaɪələnt","o":"adj","e":"involving actions that are intended to injure or kill people, by hitting them, shooting them, etc.","z":"暴力的；强暴的","x":"31 people have been injured in violent incidents throughout the day.","y":"今天一天有31人在暴力事件中受伤。","c":"Ch2 R3","u":"Unit 1","t":"四级","id":"violent|Ch2 R3"},{"w":"panic","p":"ˈpænɪk","o":"n","e":"a sudden strong feeling of fear or nervousness that makes you unable to think clearly or behave sensibly","z":"惶恐，惊恐，惊慌","x":"She got into a panic when she couldn’t find the tickets.","y":"她找不到票，慌了起来。","c":"Ch2 R3","u":"Unit 1","t":"四级","id":"panic|Ch2 R3"},{"w":"irrational","p":"ɪˈræʃənl","o":"adj","e":"not based on clear thought or reason","z":"非理性的，不合理的，荒谬的","x":"He’s becoming increasingly irrational.","y":"他变得越来越不可理喻了。","c":"Ch2 R3","u":"Unit 1","t":"四级","id":"irrational|Ch2 R3"},{"w":"pilgrim","p":"ˈpɪlgrɪm","o":"n","e":"a religious person who travels a long way to a holy place","z":"朝圣者，香客","x":"Thousands of pilgrims visit the holy shrine every year.","y":"每年有成千上万的朝圣者来祭拜圣庙。","c":"Ch2 R3","u":"Unit 1","t":"六级","id":"pilgrim|Ch2 R3"},{"w":"stampede","p":"stæmˈpi:d","o":"n","e":"sudden wild rush or mass movement of people","z":"（指人）突然的大规模移动","x":"There was a stampede towards the stage when the singer appeared.","y":"歌手出现时，观众向台前涌去。","c":"Ch2 R3","u":"Unit 1","t":"六级","id":"stampede|Ch2 R3"},{"w":"contagion","p":"kənˈteɪdʒən","o":"n","e":"a situation in which a disease is spread by people touching each other","z":"（疾病的）接触传染","x":"There is some danger of contagion.","y":"有接触传染的危险。","c":"Ch2 R3","u":"Unit 1","t":"六级","id":"contagion|Ch2 R3"},{"w":"primitive","p":"ˈprɪmətɪv","o":"adj","e":"belonging to a simple way of life that existed in the past and does not have modern industries and machines","z":"原始的，远古的","x":"A group of people were attacked by a primitive nomadic tribe.","y":"一伙人受了到一个原始游牧部落的攻击。","c":"Ch2 R3","u":"Unit 1","t":"四级","id":"primitive|Ch2 R3"},{"w":"emerge","p":"iˈmɜ:dʒ","o":"v","e":"to appear or come out from somewhere","z":"出现，浮现","x":"Eventually the truth emerged.","y":"真相终于大白。","c":"Ch2 R3","u":"Unit 1","t":"四级","id":"emerge|Ch2 R3"},{"w":"civilize","p":"ˈsɪvəlaɪz","o":"v","e":"to influence someone’s behaviour, making or teaching them to act in a more sensible or gentle way","z":"教化，使有教养","x":"The missionaries went out to civilize other places.","y":"传教士们去异乡教化当地人民。","c":"Ch2 R3","u":"Unit 1","t":"四级","id":"civilize|Ch2 R3"},{"w":"perspective","p":"pəˈspektɪv","o":"n","e":"a way of thinking about sth., especially one that is influenced by the type of person you are or by your experiences","z":"（思考问题的）角度，观点，想法","x":"His father’s death gave him a whole new perspective on life.","y":"父亲的死使他对生活有了全新的看法。","c":"Ch2 R3","u":"Unit 1","t":"四级","id":"perspective|Ch2 R3"},{"w":"emergent","p":"iˈmɜ:dʒənt","o":"adj","e":"coming into existence","z":"新出现的；处于萌芽阶段的","x":"Bioengineering is an emergent branch of learning.","y":"生物工程是一门新兴的学问。","c":"Ch2 R3","u":"Unit 1","t":"四级","id":"emergent|Ch2 R3"},{"w":"destructive","p":"dɪˈstrʌktɪv","o":"adj","e":"causing damage to people or things","z":"毁灭性的，造成破坏的","x":"What is good for the individual can be destructive to the family.","y":"个人的好处对于家庭来说有可能是破坏性的。","c":"Ch2 R3","u":"Unit 1","t":"四级","id":"destructive|Ch2 R3"},{"w":"oppose","p":"əˈpəʊz","o":"v","e":"to disagree with sth. such as a plan or idea and try to prevent it from happening or succeeding","z":"反对；阻碍","x":"Congress is continuing to oppose the President’s health care budget.","y":"国会继续反对总统的医疗保健预算。","c":"Ch2 R3","u":"Unit 1","t":"四级","id":"oppose|Ch2 R3"},{"w":"collapse","p":"kəˈlæps","o":"v","e":"fall down or in suddenly","z":"突然倒塌，坍塌","x":"Uncle Ted’s chair collapsed under his weight.","y":"椅子承受不了泰德叔叔的重量，塌架了。","c":"Ch2 R3","u":"Unit 1","t":"四级","id":"collapse|Ch2 R3"},{"w":"riot","p":"ˈraɪət","o":"v","e":"behave in a violent and uncontrolled way, especially when people are protesting about sth.","z":"暴乱，暴动","x":"Last year 600 inmates rioted, starting fires and building barricades.","y":"去年，600名犯人闹事，他们纵火并设置路障。","c":"Ch2 R3","u":"Unit 1","t":"四级","id":"riot|Ch2 R3"},{"w":"tend to","p":"","o":"phr.","e":"to be likely to do sth. or to happen in a particular way because this is what often or usually happens","z":"往往会；常常就","x":"Women tend to live longer than men.","y":"女人往往比男人长寿。","c":"Ch3 R1","u":"Unit 2","t":"四级","id":"tend to|Ch3 R1"},{"w":"handle","p":"ˈhændl","o":"v","e":"to deal with a situation, a person, an area of work or a strong emotion","z":"处理，应付（局势、人、工作或感情）","x":"She’s very good at handling her patients.","y":"她对待病人很有办法。","c":"Ch3 R1","u":"Unit 2","t":"四级","id":"handle|Ch3 R1"},{"w":"cuddle","p":"ˈkʌdl","o":"v","e":"to hold sb./sth. close in your arms to show love or affection","z":"拥抱；搂抱","x":"The little boy cuddled the teddy bear close.","y":"小男孩紧紧地搂着玩具熊。","c":"Ch3 R1","u":"Unit 2","t":"四级","id":"cuddle|Ch3 R1"},{"w":"bounce","p":"baʊns","o":"v","e":"to move a child up and down while he or she is sitting on your knee in order to entertain him or her","z":"把小孩放在膝上颠着玩","x":"Patsy had picked up the baby and was bouncing him on her knee.","y":"帕齐抱起婴儿放在膝上颠动着。","c":"Ch3 R1","u":"Unit 2","t":"四级","id":"bounce|Ch3 R1"},{"w":"socialize","p":"ˈsəʊʃəlaɪz","o":"v","e":"(formal) to teach people to behave in ways that are acceptable to their society","z":"使社会化","x":"The family has the important function of socializing children.","y":"家庭有教孩子适应社会的重要作用。","c":"Ch3 R1","u":"Unit 2","t":"六级","id":"socialize|Ch3 R1"},{"w":"transfer","p":"trænsˈfɜ:(r)","o":"v","e":"to move from one place to another; to move sb./sth. from one place to another","z":"（使）转移，搬迁","x":"I couldn’t transfer all my credits from junior college.","y":"我无法把我在专科学校的所有学分都转过来。","c":"Ch3 R1","u":"Unit 2","t":"学术","id":"transfer|Ch3 R1"},{"w":"fit","p":"fɪt","o":"v","e":"If something fits something else or fits into it, it goes together well with that thing or is able to be part of it.","z":"与相配；相协调；符合","x":"Fostering is a full-time job and you should carefully consider how it will fit into your career.","y":"抚养孩子是全天候的事，你应该仔细考虑如何将它与事业协调起来。","c":"Ch3 R1","u":"Unit 2","t":"四级","id":"fit|Ch3 R1"},{"w":"furthermore","p":"ˌfɜ:ðəˈmɔ:(r)","o":"adv","e":"(formal) in addition to what has just been stated, used especially to add a point to an argument","z":"此外；而且；再者","x":"Furthermore, they claim that any such interference is completely ineffective.","y":"此外，他们还声称任何这样的干预都是完全无效的。","c":"Ch3 R1","u":"Unit 2","t":"学术","id":"furthermore|Ch3 R1"},{"w":"imitate","p":"ˈɪmɪteɪt","o":"v","e":"to copy sb./sth.","z":"模仿；仿效","x":"Teachers provide a model for children to imitate.","y":"教师是孩子仿效的典范。","c":"Ch3 R1","u":"Unit 2","t":"四级","id":"imitate|Ch3 R1"},{"w":"rely on","p":"","o":"phr.","e":"to need or depend on sb./sth.","z":"依赖；依靠","x":"As babies, we rely entirely on others for food.","y":"在婴儿时期，我们完全依赖别人喂食。","c":"Ch3 R1","u":"Unit 2","t":"四级","id":"rely on|Ch3 R1"},{"w":"intelligence","p":"ɪnˈtelɪdʒəns","o":"n","e":"the ability to learn, understand and think in a logical way about things; the ability to do this well","z":"智力；才智；智慧","x":"He didn’t even have the intelligence to call for an ambulance.","y":"他连呼叫救护车的头脑都没有。","c":"Ch3 R1","u":"Unit 2","t":"四级","id":"intelligence|Ch3 R1"},{"w":"feminine","p":"ˈfemənɪn","o":"adj","e":"having the qualities or appearance considered to be typical of women; connected with women","z":"（指气质或外貌）女性特有的，女性的，妇女的","x":"He had delicate, almost feminine, features.","y":"他面目清秀，跟女性差不多。","c":"Ch3 R1","u":"Unit 2","t":"六级","id":"feminine|Ch3 R1"},{"w":"macho","p":"ˈmætʃəʊ","o":"adj","e":"(usually disapproving) male in an aggressive way","z":"大男子气的；男子汉的","x":"He’s too macho to ever admit he was wrong.","y":"他太大男子主义了，从不认错。","c":"Ch3 R1","u":"Unit 2","t":"四级","id":"macho|Ch3 R1"},{"w":"masculine","p":"ˈmæskjəlɪn","o":"adj","e":"having the qualities or appearance considered to be typical of men; connected with or like men","z":"男子汉的；男人的；像男人的","x":"He was handsome and strong, and very masculine.","y":"他英俊强壮，富有男子汉气概","c":"Ch3 R1","u":"Unit 2","t":"六级","id":"masculine[ˈmæskjəlɪn|Ch3 R1"},{"w":"rough","p":"rʌf","o":"adj","e":"not gentle or careful; violent","z":"粗暴的；粗野的；猛烈的","x":"They complained of rough handling by the guards.","y":"他们投诉警卫对他们动粗了。","c":"Ch3 R1","u":"Unit 2","t":"四级","id":"rough|Ch3 R1"},{"w":"physical","p":"ˈfɪzɪkl","o":"adj","e":"connected with a person’s body rather than their mind","z":"身体的；肉体的；躯体的","x":"He tends to avoid all physical contact.","y":"他倾向于避免一切身体接触。","c":"Ch3 R1","u":"Unit 2","t":"四级","id":"physical|Ch3 R1"},{"w":"engage","p":"ɪnˈgeɪdʒ","o":"v","e":"If you engage in an activity, you do it or are actively involved with it.","z":"参与；从事","x":"I have no time to engage in gossip.","y":"我无暇闲聊。","c":"Ch3 R1","u":"Unit 2","t":"四级","id":"engage|Ch3 R1"},{"w":"dominant","p":"ˈdɒmɪnənt","o":"adj","e":"more important, powerful or noticeable than other things","z":"首要的；占支配地位的；占优势的；显著的","x":"The dominant feature of the room was the large fireplace.","y":"这间屋子要数那个大壁炉最显眼了。","c":"Ch3 R1","u":"Unit 2","t":"六级","id":"dominant|Ch3 R1"},{"w":"intense","p":"ɪnˈtens","o":"adj","e":"very great; very strong","z":"很大的；十分强烈的","x":"The President is under intense pressure to resign.","y":"总统承受着沉重的辞职压力。","c":"Ch3 R1","u":"Unit 2","t":"学术","id":"intense|Ch3 R1"},{"w":"focus","p":"ˈfəʊkəs","o":"v","e":"to give attention, effort, etc. to one particular subject, situation or person rather than another","z":"集中（注意力、精力等）于","x":"The discussion focused on three main problems.","y":"讨论集中在三个主要问题上。","c":"Ch3 R1","u":"Unit 2","t":"学术","id":"focus|Ch3 R1"},{"w":"expectation","p":"ekspekˈteɪʃn","o":"n","e":"a belief that sth. will happen because it is likely","z":"预料；预期；期待","x":"Against all expectations, she was enjoying herself.","y":"完全没想到她过得非常快活。","c":"Ch3 R1","u":"Unit 2","t":"四级","id":"expectation|Ch3 R1"},{"w":"forbid","p":"fəˈbɪd","o":"v","e":"to order sb. not to do sth.; to order that sth. must not be done","z":"禁止；不准","x":"Her father forbade the marriage.","y":"她的父亲不允许这桩婚事。","c":"Ch3 R1","u":"Unit 2","t":"四级","id":"forbid|Ch3 R1"},{"w":"resist","p":"rɪˈzɪst","o":"v","e":"to refuse to accept sth. and try to stop it from happening","z":"抵制；阻挡","x":"They are determined to resist the call for reform.","y":"他们决心拒绝实施改革的号召。","c":"Ch3 R1","u":"Unit 2","t":"四级","id":"resist|Ch3 R1"},{"w":"traditional","p":"trəˈdɪʃənl","o":"adj","e":"(sometimes disapproving) following older methods and ideas rather than modern or different ones","z":"传统的；因袭的；守旧的","x":"We’re still a traditional school in a lot of ways.","y":"我们在很多方面仍是一所旧式学校。","c":"Ch3 R1","u":"Unit 2","t":"学术","id":"traditional|Ch3 R1"},{"w":"bring up","p":"","o":"phr.","e":"to care for a child, teaching him or her how to behave, etc.","z":"抚养；养育；教养","x":"He was brought up by his aunt.","y":"他是由姨妈带大的。","c":"Ch3 R1","u":"Unit 2","t":"四级","id":"bring up|Ch3 R1"},{"w":"neutral","p":"ˈnju:trəl","o":"adj","e":"not supporting or helping either side in a disagreement, competition, etc.","z":"中立的；持平的；无倾向性的","x":"Journalists are supposed to be politically neutral.","y":"新闻工作者在政治上应持中立态度。","c":"Ch3 R1","u":"Unit 2","t":"学术","id":"neutral|Ch3 R1"},{"w":"mechanical","p":"məˈkænɪkl","o":"adj","e":"relating to machines and engines and the way they work","z":"机械方面的；机械原理的","x":"The company undertakes mechanical work on all types of cars.","y":"该公司承接各类汽车的修理工作。","c":"Ch3 R2","u":"Unit 2","t":"四级","id":"mechanical|Ch3 R2"},{"w":"consistently","p":"kən'sɪstəntlɪ","o":"adv","e":"(approving) always behaving in the same way, or having the same opinions, standards, etc.","z":"一致的；始终如一的","x":"Her work has been of a consistently high standard.","y":"她的工作一直是高水准的。","c":"Ch3 R2","u":"Unit 2","t":"学术","id":"consistently|Ch3 R2"},{"w":"remain","p":"rɪˈmeɪn","o":"v","e":"to continue to be sth.; to be still in the same state or condition","z":"仍然是；保持不变","x":"Train fares are likely to remain unchanged.","y":"火车票价很可能会保持不变。","c":"Ch3 R2","u":"Unit 2","t":"四级","id":"remain|Ch3 R2"},{"w":"bias","p":"ˈbaɪəs","o":"n","e":"a strong feeling in favour of or against one group of people, or one side in an argument, often not based on fair judgement","z":"偏见；偏心；偏向","x":"Some institutions still have a strong bias against women.","y":"有些机构仍然对妇女持有很大偏见。","c":"Ch3 R2","u":"Unit 2","t":"六级","id":"bias|Ch3 R2"},{"w":"unintentional","p":"ʌnɪnˈtenʃənl","o":"adj","e":"not done deliberately, but happening by accident","z":"无意的；非故意的；偶然的","x":"Perhaps I misled you, but it was quite unintentional.","y":"也许我误导了你，但那绝不是有意的。","c":"Ch3 R2","u":"Unit 2","t":"四级","id":"unintentional|Ch3 R2"},{"w":"setting","p":"ˈsetɪŋ","o":"n","e":"a set of surroundings; the place at which sth. happens","z":"环境；背景","x":"It was the perfect setting for a wonderful Christmas.","y":"环境气氛无可挑剔，正是一个美好的圣诞节所需要的。","c":"Ch3 R2","u":"Unit 2","t":"四级","id":"setting|Ch3 R2"},{"w":"devote","p":"dɪˈvəʊt","o":"v","e":"to give an amount of time, attention, etc. to sth.","z":"把…用于","x":"I could only devote two hours a day to the work.","y":"我一天只能在这个工作上花两个小时。","c":"Ch3 R2","u":"Unit 2","t":"学术","id":"devote|Ch3 R2"},{"w":"assertive","p":"əˈsɜ:tɪv","o":"adj","e":"expressing opinions or desires strongly and with confidence, so that people take notice","z":"坚定自信的；主张坚决的","x":"Women have become more assertive in the past decade.","y":"女性在过去十年中已变得更加自信。","c":"Ch3 R2","u":"Unit 2","t":"六级","id":"assertive|Ch3 R2"},{"w":"self-esteem","p":"selfɪˈsti:m","o":"n","e":"a feeling of being happy with your own character and abilities","z":"自尊（心）","x":"Poor self-esteem is at the centre of many of the difficulties we experience in our relationships.","y":"缺乏自尊心是我们之间关系所遭遇的重重困难中的核心问题。","c":"Ch3 R2","u":"Unit 2","t":"六级","id":"self-esteem|Ch3 R2"},{"w":"suggest","p":"səˈdʒest","o":"v","e":"to put an idea into sb.’s mind; to make sb. think that sth. is true","z":"使想到；使认为；表明","x":"Thesymptoms suggestaminorheartattack.","y":"症状显示这是轻微心脏病发作。","c":"Ch3 R2","u":"Unit 2","t":"四级","id":"suggest|Ch3 R2"},{"w":"industrialized","p":"ɪnˈdʌstriəlaɪzd","o":"adj","e":"An industrialized area or place is one which has a lot of industries.","z":"工业化的","x":"Industrialized countries must reduce carbon dioxide emissions.","y":"工业化国家必须减少二氧化碳的排放。","c":"Ch3 R2","u":"Unit 2","t":"四级","id":"industrialized|Ch3 R2"},{"w":"superior","p":"su:ˈpɪəriə(r)","o":"adj","e":"better in quality than sb./sth. else; greater than sb./sth. else","z":"更好的；占优势的；更胜一筹的","x":"This model is technically superior to its competitors.","y":"这一款式在技术上超过了与之竞争的产品。","c":"Ch3 R2","u":"Unit 2","t":"四级","id":"superior|Ch3 R2"},{"w":"emphasize","p":"ˈemfəsaɪz","o":"v","e":"to give special importance to sth.","z":"强调；重视；着重","x":"His speech emphasized the importance of attracting industry to the town.","y":"他的发言强调了吸引工业到这个城镇的重要性。","c":"Ch3 R2","u":"Unit 2","t":"学术","id":"emphasize|Ch3 R2"},{"w":"mature","p":"məˈtʃʊə(r)","o":"v","e":"to become fully grown or developed","z":"成熟；长成","x":"This particular breed of cattle matures early.","y":"这一品种的牛发育成熟快。","c":"Ch3 R2","u":"Unit 2","t":"学术","id":"mature|Ch3 R2"},{"w":"consequently","p":"ˈkɒnsɪkwəntli","o":"adv","e":"as a result; therefore","z":"因此；所以","x":"This poses a threat to agriculture and the food chain, and consequently to human health.","y":"这会对农业和食物链造成威胁，并由此危及人的健康。","c":"Ch3 R2","u":"Unit 2","t":"四级","id":"consequently|Ch3 R2"},{"w":"commit","p":"kəˈmɪt","o":"v","e":"to do sth. wrong or illegal","z":"做（错误或非法的事）；犯（罪或错等）","x":"Most crimes are committed by young men.","y":"多数罪行都是年轻男性犯下的。","c":"Ch3 R2","u":"Unit 2","t":"学术","id":"commit|Ch3 R2"},{"w":"agent","p":"ˈeɪdʒənt","o":"n","e":"If you refer to sb. or sth. as the agent of a particular effect, you mean that they cause this effect.","z":"动力；媒介；因素；工具","x":"In many societies young men regard themselves as highly active, the agents of change, shapers of the world.","y":"许多社会中，年轻人将自己看成是高度活跃的分子，是变革的推动者和世界的塑造者。","c":"Ch3 R3","u":"Unit 2","t":"四级","id":"agent|Ch3 R3"},{"w":"mass media","p":"","o":"phr.","e":"communications media that reach a large audience, for example, television, newspapers, and the Internet","z":"大众传媒","x":"The mass media have been vested with significant power as social and political agents in modern developed societies.","y":"在现代发达社会中，作为社会和政治媒介，大众传媒被赋予了很大的权力。","c":"Ch3 R3","u":"Unit 2","t":"学术","id":"mass media|Ch3 R3"},{"w":"primarily","p":"praɪˈmerəli","o":"adv","e":"mainly","z":"主要地；根本地","x":"The problem is not primarily a financial one.","y":"这个问题基本上不是财政问题。","c":"Ch3 R3","u":"Unit 2","t":"学术","id":"primarily|Ch3 R3"},{"w":"dutiful","p":"ˈdju:tɪfl","o":"adj","e":"doing everything that you are expected to do; willing to obey and to show respect","z":"尽职的；顺从的；恭敬的","x":"The days of the dutiful wife, who sacrifices her career for her husband, are over.","y":"贤妻为了丈夫而牺牲自己事业的时代已经结束了。","c":"Ch3 R3","u":"Unit 2","t":"六级","id":"dutiful|Ch3 R3"},{"w":"homemaker","p":"ˈhəʊmmeɪkə(r)","o":"n","e":"(especially North American English) a person who works at home and takes care of the house and family","z":"料理家务者；操持家务者","x":"Her mother is a homemaker.","y":"她的母亲是个家庭主妇","c":"Ch3 R3","u":"Unit 2","t":"四级","id":"homemaker|Ch3 R3"},{"w":"portray","p":"pɔ:ˈtreɪ","o":"v","e":"to describe or show sb./sth. in a particular way, especially when this does not give a complete or accurate impression of what they are like","z":"将…描写成；给人以某种印象","x":"Throughout the trial, he portrayed himself as the victim.","y":"在审讯过程中，他始终把自己说成是受害者。","c":"Ch3 R3","u":"Unit 2","t":"四级","id":"portray|Ch3 R3"},{"w":"body image","p":"","o":"phr.","e":"a person’s perception of his or her body’s appearance","z":"（人们通过外界对自己体形及性别特征吸引力的评价而形成的）自我感觉","x":"From the survey, we can know 80% of men are not satisfied with their body image.","y":"根据调查，我们能知道八成的男性不满自己的形象。","c":"Ch3 R3","u":"Unit 2","t":"学术","id":"body image|Ch3 R3"},{"w":"close-up","p":"ˈkləʊsʌp","o":"n","e":"a photograph, or picture in a film/movie, taken very close to sb./sth. so that it shows a lot of details","z":"（照相、电影的）特写，特写镜头","x":"It was strange to see her own face in close-up on the screen.","y":"在屏幕上看见她自己的脸部特写感觉很陌生。","c":"Ch3 R3","u":"Unit 2","t":"六级","id":"close-up|Ch3 R3"},{"w":"perceive","p":"pəˈsi:v","o":"v","e":"to notice or become aware of sth.","z":"注意到；意识到；察觉到","x":"She perceived that all was not well.","y":"她意识到并非一切都顺利。","c":"Ch3 R3","u":"Unit 2","t":"学术","id":"perceive|Ch3 R3"},{"w":"survey","p":"sɜ:ˈveɪ","o":"v","e":"to investigate the opinions or behaviour of a group of people by asking them a series of questions","z":"调查（某部分人）的行为﹑意见等","x":"We surveyed 500 smokers and found that over three quarters would like to give up.","y":"我们对500名吸烟者进行了调查，发现有超过四分之三的人愿意戒烟。","c":"Ch3 R3","u":"Unit 2","t":"四级","id":"survey|Ch3 R3"},{"w":"muscular","p":"ˈmʌskjələ(r)","o":"adj","e":"having large strong muscles","z":"强壮的；肌肉发达的","x":"Like most female athletes, she was lean and muscular.","y":"像大多女运动员一样，她清瘦但肌肉发达。","c":"Ch3 R3","u":"Unit 2","t":"六级","id":"muscular|Ch3 R3"},{"w":"stereotype","p":"ˈsteriətaɪp","o":"n","e":"a fixed idea or image that many people have of a particular type of person or thing, but which is often not true in reality","z":"模式化观念（或形象）；老一套；刻板印象","x":"Many men feel their body shape doesn’t live up to the stereotype of the ideal man.","y":"很多男人都觉得自己的体形不符合人们心目中惯有的理想男性形象。","c":"Ch3 R3","u":"Unit 2","t":"六级","id":"stereotype|Ch3 R3"},{"w":"co-star","p":"ˈkəʊstɑ:","o":"n","e":"one of two or more famous actors who appear together in a film/movie or play","z":"（电影或戏剧中的）联袂主演明星","x":"During the filming, Curtis fell in love with his co-star, Christine Kaufmann.","y":"在电影摄制过程中，柯蒂斯爱上了同他联袂主演的明星克里斯汀·考夫曼。","c":"Ch3 R3","u":"Unit 2","t":"四级","id":"co-star|Ch3 R3"},{"w":"storyline","p":"ˈstɔ:rilaɪn","o":"n","e":"the basic story in a novel, play, film/movie, etc.","z":"（小说、戏剧、电影等的）故事情节","x":"The surprise twists in the storyline are the film’s greatest strength.","y":"该影片最精彩之处就是剧情的曲折离奇。","c":"Ch3 R3","u":"Unit 2","t":"六级","id":"storyline|Ch3 R3"},{"w":"defend","p":"dɪˈfend","o":"v","e":"to protect sb./sth. from attack","z":"防御；保护；保卫","x":"All our officers are trained to defend themselves against knife attacks.","y":"我们所有的警察都接受过自卫训练，能够对付持刀袭击。","c":"Ch3 R3","u":"Unit 2","t":"四级","id":"defend|Ch3 R3"},{"w":"reinforce","p":"ˌri:ɪnˈfɔ:s","o":"v","e":"to make a feeling, an idea, etc. stronger","z":"加强；充实；使更强烈","x":"Such jokes tend to reinforce racial stereotypes.","y":"这样的笑话容易渲染种族偏见。","c":"Ch3 R3","u":"Unit 2","t":"学术","id":"reinforce|Ch3 R3"},{"w":"comic","p":"ˈkɒmɪk","o":"n","e":"a magazine, especially for children, that tells stories through pictures","z":"（尤指儿童看的）连环画杂志","x":"Joe loved to read “Superman” comics.","y":"乔喜欢看《超人》的漫画","c":"Ch3 R3","u":"Unit 2","t":"四级","id":"comic|Ch3 R3"},{"w":"source","p":"sɔ:s","o":"n","e":"a place, person or thing that you get sth. from","z":"来源；出处","x":"Our local library will be a useful source of information.","y":"我们当地的图书馆就是很好的资料来源。","c":"Ch3 R3","u":"Unit 2","t":"四级","id":"source|Ch3 R3"},{"w":"submissive","p":"səbˈmɪsɪv","o":"adj","e":"willing to accept sb. else’s authority and willing to obey them without questioning anything they want you to do","z":"唯命是从的；顺从的；驯服的；听话的","x":"He expected his daughters to be meek and submissive.","y":"他期望女儿们都温顺听话。","c":"Ch3 R3","u":"Unit 2","t":"六级","id":"submissive|Ch3 R3"},{"w":"sexualize","p":"ˈsekʃuəlaɪz","o":"v","e":"To sexualize sb./sth. means to make them sexual or consider them in a sexual way.","z":"使有性别；使有性征","x":"Referring to children’s friends as girlfriends and boyfriends sexualizes them.","y":"将孩子们的朋友称为女朋友或男朋友就把他们的性别差异凸显出来了。","c":"Ch3 R3","u":"Unit 2","t":"六级","id":"sexualize|Ch3 R3"},{"w":"exaggerate","p":"ɪgˈzædʒəreɪt","o":"v","e":"to make sth. seem larger, better, worse or more important than it really is","z":"夸张；夸大","x":"He tends to exaggerate the difficulties.","y":"他往往夸大困难。","c":"Ch3 R3","u":"Unit 2","t":"四级","id":"exaggerate|Ch3 R3"},{"w":"feature","p":"ˈfi:tʃə(r)","o":"n","e":"something important, interesting or typical of a place or thing","z":"特色；特征；特点","x":"An interesting feature of the city is the old market.","y":"老市场是这座城市有趣的特点。","c":"Ch3 R3","u":"Unit 2","t":"学术","id":"feature|Ch3 R3"},{"w":"initial","p":"ɪˈnɪʃl","o":"adj","e":"happening at the beginning; first","z":"最初的；开始的；第一的","x":"My initial reaction was to decline the offer.","y":"我最初的反应是要拒绝这个提议。","c":"Ch3 R3","u":"Unit 2","t":"四级","id":"initial|Ch3 R3"},{"w":"privilege","p":"ˈprɪvəlɪdʒ","o":"n","e":"a special right or advantage that a particular person or group of people has","z":"特殊利益；优惠待遇","x":"Education should be a universal right and not a privilege.","y":"教育应当是全民的权利，而非某部分人特别享有的。","c":"Ch3 R3","u":"Unit 2","t":"四级","id":"privilege|Ch3 R3"},{"w":"pharmacist","p":"ˈfɑ:məsɪst","o":"n","e":"(North American English also druggist) a person whose job is to prepare medicines and sell or give them to the public in a shop/store or in a hospital","z":"药剂师","x":"We had to wait for the pharmacist to make up her prescription.","y":"我们只得等药剂师给她配好药。","c":"Ch4 R1","u":"Unit 2","t":"六级","id":"pharmacist|Ch4 R1"},{"w":"labor","p":"ˈleɪbə(r)","o":"n","e":"work, especially physical work","z":"劳动；（尤指）体力劳动","x":"Division of labour is important in industry today.","y":"劳动分工在今天的行业中很重要。","c":"Ch4 R1","u":"Unit 2","t":"学术","id":"labor|Ch4 R1"},{"w":"struggle","p":"ˈstrʌgl","o":"n","e":"a hard fight in which people try to obtain or achieve sth., especially sth. that sb. else does not want them to have","z":"斗争；奋斗；努力","x":"She will not give up her children without a struggle.","y":"她不会轻易放弃自己的孩子","c":"Ch4 R1","u":"Unit 2","t":"四级","id":"struggle|Ch4 R1"},{"w":"shift","p":"ʃɪft","o":"v","e":"(of a situation, an opinion, a policy, etc.) to change from one state, position, etc. to another","z":"（情况、意见、政策等）变换；更替；变动","x":"Public attitudes towards marriage have shifted over the past 50 years.","y":"50年来，公众对婚姻的态度已经改变。","c":"Ch4 R1","u":"Unit 2","t":"四级","id":"shift|Ch4 R1"},{"w":"contribution","p":"ˌkɒntrɪˈbju:ʃn","o":"n","e":"an action or a service that helps to cause or increase sth.","z":"贡献；促成作用","x":"He made a very positive contribution to the success of the project.","y":"他对项目的成功贡献良多。","c":"Ch4 R1","u":"Unit 2","t":"学术","id":"contribution|Ch4 R1"},{"w":"period","p":"ˈpɪəriəd","o":"n","e":"a particular length of time","z":"一段时间；时期","x":"All these changes happened over a period of time.","y":"所有这些变化都是在一段时间内发生的","c":"Ch4 R1","u":"Unit 2","t":"学术","id":"period|Ch4 R1"},{"w":"approximately","p":"əˈprɒksɪmətli","o":"adv","e":"used to show that sth. is almost, but not completely, accurate or correct","z":"大概；大约；约莫","x":"The journey took approximately seven hours.","y":"旅程大约花了七个小时。","c":"Ch4 R1","u":"Unit 2","t":"学术","id":"approximately|Ch4 R1"},{"w":"panel","p":"ˈpænl","o":"n","e":"A panel is a small group of people who are chosen to do sth., for example to discuss sth. in public or to make a decision.","z":"（进行公开讨论或作决策的）专门小组","x":"He assembled a panel of scholars to advise him.","y":"他组织了一个学者小组为他出谋划策。","c":"Ch4 R1","u":"Unit 2","t":"四级","id":"panel|Ch4 R1"},{"w":"dynamics","p":"daɪˈnæmɪks","o":"n","e":"the way in which people or things behave and react to each other in a particular situation","z":"（人或事物）相互作用的方式，动态","x":"The interchange of ideas aids an understanding of family dynamics.","y":"思想的交流有助于理解家庭动态。","c":"Ch4 R1","u":"Unit 2","t":"六级","id":"dynamics|Ch4 R1"},{"w":"commitment","p":"kəˈmɪtmənt","o":"n","e":"the willingness to work hard and give your energy and time to a job or an activity","z":"（对工作或某活动）献身，奉献，投入","x":"A career as an actor requires one hundred percent commitment.","y":"干演员这一行需要百分之百的投入。","c":"Ch4 R1","u":"Unit 2","t":"六级","id":"commitment|Ch4 R1"},{"w":"flexibility","p":"ˌfleksəˈbɪlətɪ","o":"n","e":"the quality of being able to change or be changed easily according to the situation","z":"灵活可变性","x":"I enjoyed the flexibility of the schedule.","y":"我喜欢这个有弹性的时间安排。","c":"Ch4 R1","u":"Unit 2","t":"六级","id":"flexibility|Ch4 R1"},{"w":"sole","p":"səʊl","o":"adj","e":"only; single","z":"仅有的；唯一的","x":"This is the sole means of access to the building.","y":"这是这栋建筑物唯一的入口。","c":"Ch4 R1","u":"Unit 2","t":"学术","id":"sole|Ch4 R1"},{"w":"provider","p":"prəˈvaɪdə(r)","o":"n","e":"a person or an organization that supplies sb. with sth. they need or want","z":"供应者；提供者；供养人","x":"The eldest son is the family’s sole provider.","y":"这家的长子是唯一养家糊口的人。","c":"Ch4 R1","u":"Unit 2","t":"四级","id":"provider|Ch4 R1"},{"w":"micromanage","p":"ˈmaɪkrəʊmænɪdʒ","o":"v","e":"to control every part of a situation, even small details","z":"细致入微地管理","x":"We wish to empower our people rather than micromanage them.","y":"我们希望赋予员工广泛的权力，而不进行琐碎的管理。","c":"Ch4 R1","u":"Unit 2","t":"学术","id":"micromanage|Ch4 R1"},{"w":"apparent","p":"əˈpærənt","o":"adj","e":"easy to see or understand","z":"显而易见的；明白易懂的；显然的","x":"Their devotion was apparent.","y":"他们的忠诚显而易见。","c":"Ch4 R1","u":"Unit 2","t":"四级","id":"apparent|Ch4 R1"},{"w":"complex","p":"ˈkɒmpleks","o":"adj","e":"made of many different things or parts that are connected; difficult to understand","z":"复杂的；难懂的；费解的","x":"Today’s complex buildings require close teamwork between the architect and the builders.","y":"如今的建筑结构复杂，需要建筑师和施工人员密切协作。","c":"Ch4 R2","u":"Unit 2","t":"学术","id":"complex|Ch4 R2"},{"w":"discrimination","p":"dɪˌskrɪmɪˈneɪʃn","o":"n","e":"the practice of treating sb. or a particular group in society less fairly than others","z":"区别对待；歧视；偏袒","x":"The Sex Discrimination Act has not eliminated discrimination in employment.","y":"《反性别歧视法》并未根除工作场合的歧视。","c":"Ch4 R2","u":"Unit 2","t":"学术","id":"discrimination|Ch4 R2"},{"w":"in-law","p":"ˈɪn lɔ:","o":"n","e":"a parent of your husband or wife or a member of his or her family","z":"姻亲；内亲","x":"Interfering in-laws are the prime sources of the blues.","y":"喜欢指手画脚的姻亲最让人头疼。","c":"Ch4 R2","u":"Unit 2","t":"六级","id":"in-law|Ch4 R2"},{"w":"identity","p":"aɪˈdentəti","o":"n","e":"who or what sb./sth. is","z":"身份","x":"They are a lost generation in search of an identity.","y":"他们属于迷惘的一代，想要找寻自我。","c":"Ch4 R2","u":"Unit 2","t":"六级","id":"identity|Ch4 R2"},{"w":"regard","p":"rɪˈgɑ:d","o":"v","e":"to think about sb./sth. in a particular way","z":"将…认为；把…视为；看待","x":"Capital punishment was regarded as inhuman and immoral.","y":"死刑过去被认为是非人道且不道德的。","c":"Ch4 R2","u":"Unit 2","t":"四级","id":"regard|Ch4 R2"},{"w":"crush","p":"krʌʃ","o":"v","e":"to destroy sb.’s confidence or happiness","z":"破坏，毁坏（某人的信心或幸福）","x":"She felt completely crushed by the teacher’s criticism.","y":"老师的批评使她觉得自己全完了。","c":"Ch4 R2","u":"Unit 2","t":"四级","id":"crush|Ch4 R2"},{"w":"equate","p":"ɪˈkweɪt","o":"v","e":"to think that sth. is the same as sth. else or is as important","z":"同等看待；使等同","x":"Some parents equate education with exam success.","y":"有些父母认为教育就是考试成绩优秀。","c":"Ch4 R2","u":"Unit 2","t":"学术","id":"equate|Ch4 R2"},{"w":"identification","p":"aɪˌdentɪfɪˈkeɪʃn","o":"n","e":"the process of recognizing that sth. exists, or is important","z":"确认；识别","x":"The early identification of children with special educational needs is very important.","y":"早期确认儿童有特殊教育需求很重要。","c":"Ch4 R2","u":"Unit 2","t":"六级","id":"identification|Ch4 R2"},{"w":"strain","p":"streɪn","o":"n","e":"severe demand on one’s mental or physical strength, resources, abilities, etc.","z":"对智力﹑体力﹑财力﹑能力等的严格要求；负担；压力","x":"Their marriage is under great strain at the moment.","y":"眼下他们的婚姻关系非常紧张","c":"Ch4 R2","u":"Unit 2","t":"四级","id":"strain|Ch4 R2"},{"w":"masculinity","p":"ˌmæskjuˈlɪnəti","o":"n","e":"the quality of being masculine","z":"男子气概；男性；阳性","x":"The old ideas of masculinity do not work for most men.","y":"对于大多数男人来说，关于男子气概的老套观点现在已不再适用了。","c":"Ch4 R2","u":"Unit 2","t":"学术","id":"masculinity|Ch4 R2"},{"w":"self-reliant","p":"ˌself rɪˈlaɪənt","o":"adj","e":"able to do or decide things by yourself, rather than depending on other people for help","z":"自立的；自力更生的；自主的","x":"Raising self-reliant children requires parents at times to lead with their heads and not their hearts.","y":"培养有自立能力的孩子要求家长们不时地用理智而不是感情来引导孩子。","c":"Ch4 R2","u":"Unit 2","t":"六级","id":"self-reliant|Ch4 R2"},{"w":"urge","p":"ɜ:dʒ","o":"v","e":"to advise or try hard to persuade sb. to do sth.","z":"敦促；催促；力劝","x":"The report urged that all children be taught to swim.","y":"这份报告呼吁给所有的儿童教授游泳。","c":"Ch4 R2","u":"Unit 2","t":"四级","id":"urge|Ch4 R2"},{"w":"stressful","p":"ˈstresfl","o":"adj","e":"causing a lot of anxiety and worry","z":"压力重的；紧张的","x":"Parenting can be a stressful business.","y":"为人父母是一件压力很大的事。","c":"Ch4 R2","u":"Unit 2","t":"学术","id":"stressful|Ch4 R2"},{"w":"depression","p":"dɪˈpreʃn","o":"n","e":"the state of feeling very sad and without hope","z":"抑郁；沮丧；消沉","x":"Lack of exercise can lead to feelings of depression and exhaustion.","y":"缺乏锻炼会导致抑郁和疲劳。","c":"Ch4 R2","u":"Unit 2","t":"六级","id":"depression|Ch4 R2"},{"w":"conform to","p":"","o":"phr.","e":"to behave and think in the same way as most other people in a group or society","z":"顺从，顺应（大多数人或社会）；随潮流","x":"He refused to conform to the local customs.","y":"他拒绝遵从当地的风俗习惯。","c":"Ch4 R2","u":"Unit 2","t":"六级","id":"conform to|Ch4 R2"},{"w":"humiliation","p":"hju:ˌmɪlɪˈeɪʃn","o":"n","e":"Humiliation is the embarrassment and shame you feel when someone makes you appear stupid, or when you make a mistake in public.","z":"耻辱；屈辱；丢脸；蒙羞","x":"She faced the humiliation of discussing her husband’s affair.","y":"她面临要谈及丈夫外遇的羞辱。","c":"Ch4 R2","u":"Unit 2","t":"六级","id":"humiliation|Ch4 R2"},{"w":"life expectancy","p":"","o":"phr.","e":"average expected length of life","z":"预期寿命","x":"Researchers find that life expectancy actually increased during the years of the Great Depression.","y":"研究人员发现大萧条的这几年里，人的预期寿命其实增长了。","c":"Ch4 R2","u":"Unit 2","t":"六级","id":"life expectancy|Ch4 R2"},{"w":"consistent","p":"kənˈsɪstənt","o":"adj","e":"happening in the same way and continuing for a period of time","z":"一贯的；持续的","x":"There has been consistent growth in GSM mobile subscribers.","y":"全球通手机用户持续增长。","c":"Ch4 R2","u":"Unit 2","t":"四级","id":"consistent|Ch4 R2"},{"w":"persistent","p":"pəˈsɪstənt","o":"adj","e":"continuing for a long period of time without interruption, or repeating frequently, especially in a way that is annoying and cannot be stopped","z":"连绵的；持续的；反复出现的","x":"Persistent disapproval or criticism can be highly demoralizing.","y":"一再的否定和批评可能会对信心造成严重打击。","c":"Ch4 R2","u":"Unit 2","t":"学术","id":"persistent|Ch4 R2"},{"w":"longevity","p":"lɒnˈdʒevəti","o":"n","e":"(formal) long life; the fact of lasting a long time","z":"长寿；持久","x":"We wish you both health and longevity.","y":"我们祝愿您二位健康长寿。","c":"Ch4 R2","u":"Unit 2","t":"六级","id":"longevity|Ch4 R2"},{"w":"hormone","p":"ˈhɔ:məʊn","o":"n","e":"a chemical substance produced in the body or in a plant that encourages growth or influences how the cells and tissues function; an artificial substance that has similar effects","z":"荷尔蒙；激素","x":"This hormone interacts closely with other hormones in the body.","y":"这种荷尔蒙与体内其他荷尔蒙紧密地相互作用。","c":"Ch4 R2","u":"Unit 2","t":"六级","id":"hormone|Ch4 subordinate|Ch4 R3"},{"w":"executive","p":"ɪgˈzekjətɪv","o":"n","e":"​a person who has an important job as a manager of a company or an organization","z":"（公司或机构的）经理，主管领导，管理人员","x":"He is respected as a very aggressive and competitive executive.","y":"他是一位锐意进取、竞争意识很强的主管，颇受尊敬。","c":"Ch4 R3","u":"Unit 2","t":"四级","id":"executive|Ch4 R3"},{"w":"respondent","p":"rɪˈspɒndənt","o":"n","e":"​a person who answers questions, especially in a survey","z":"回答问题的人；（尤指）调查对象","x":"60% of the respondents agreed with the suggestion.","y":"回复调查的人中60%同意这项建议。","c":"Ch4 R3","u":"Unit 2","t":"学术","id":"respondent|Ch4 R3"},{"w":"prohibit","p":"prəˈhɪbɪt","o":"v","e":"​to stop sth. from being done","z":"（尤指以法令）禁止","x":"Local zoning laws prohibit building near property lines.","y":"本地的规划法禁止在地产边界附近进行建筑施工。","c":"Ch4 R3","u":"Unit 2","t":"四级","id":"prohibit|Ch4 R3"},{"w":"disparity","p":"dɪˈspærəti","o":"n","e":"​(formal) a difference, especially one connected with unfair treatment","z":"（尤指因不公正对待引起的）不同，不等，差异","x":"The disparity in incomes among different professions was small.","y":"各职业收入的差距比较小。","c":"Ch4 R3","u":"Unit 2","t":"学术","id":"disparity|Ch4 R3"},{"w":"rear","p":"rɪə(r)","o":"v","e":"​to care for young children or animals until they are fully grown","z":"抚养；养育；培养","x":"She reared a family of five on her own.","y":"她一个人养活一家五口。","c":"Ch4 R3","u":"Unit 2","t":"四级","id":"rear|Ch4 R3"},{"w":"compensation","p":"ˌkɒmpenˈseɪʃn","o":"n","e":"​something, especially money, that sb. gives you because they have hurt you, or damaged sth. that you own; the act of giving this to sb.","z":"赔偿物；补偿金；赔偿","x":"He received one year’s salary as compensation for loss of office.","y":"他得到一年的工资作为失业补偿金。","c":"Ch4 R3","u":"Unit 2","t":"学术","id":"compensation|Ch4 R3"},{"w":"forum","p":"ˈfɔ:rəm","o":"n","e":"​a place where people can exchange opinions and ideas on a particular issue; a meeting organized for this purpose","z":"公共讨论场所；论坛；讨论会","x":"Television is now an important forum for political debate.","y":"电视已 const PASS=[{"ti":"Marriage in transition","u":"Unit 1","seg":[{"t":"Marriage as an "},{"t":"institution","id":"institution|Ch1 R1"},{"t":" has changed a great deal in fifty years. The clearest "},{"t":"trend","id":"trend|Ch1 R1"},{"t":" is that couples now "},{"t":"postpone","id":"postpone|Ch1 R1"},{"t":" the wedding until both partners have finished their education. In most large cities the "},{"t":"majority","id":"majority|Ch1 R1"},{"t":" of young people live together before they marry, while a small "},{"t":"minority","id":"minority|Ch1 R1"},{"t":" decide not to marry at all. Sociologists disagree about the "},{"t":"primary","id":"primary|Ch1 R1"},{"t":" cause. Some argue that it is economic: a single "},{"t":"spouse","id":"spouse|Ch1 R1"},{"t":" can no longer support a family on one salary. Others point to a "},{"t":"considerable","id":"considerable|Ch1 R1"},{"t":" change in values, and to the fact that a "},{"t":"community","id":"community|Ch1 R1"},{"t":" now expects far less of a wedding and far more of a partnership. Whatever the explanation, the birth rate continues to "},{"t":"decline","id":"decline|Ch1 R1"},{"t":", and old customs have had to "},{"t":"adapt","id":"adapt|Ch1 R1"},{"t":". Most couples "},{"t":"eventually","id":"eventually|Ch1 R1"},{"t":" settle into arrangements their grandparents would not recognise."}]},{"ti":"When a family is rebuilt","u":"Unit 1","seg":[{"t":"When a single parent remarries, the new "},{"t":"household","id":"household|Ch1 R2"},{"t":" has to be rebuilt from nothing. Children often "},{"t":"resent","id":"resent|Ch1 R2"},{"t":" the stranger who suddenly shares their home, and small disagreements can turn into open "},{"t":"conflict","id":"conflict|Ch1 R2"},{"t":". Parents tend to "},{"t":"assume","id":"assume|Ch1 R3"},{"t":" that affection will grow by itself, but research "},{"t":"reveals","id":"reveal|Ch1 R3"},{"t":" a more complicated picture: a child's first reaction is usually "},{"t":"negative","id":"negative|Ch1 R3"},{"t":" and may last for years. What matters is whether adults handle the "},{"t":"shift","id":"shift|Ch1 R2"},{"t":" "},{"t":"appropriately","id":"appropriately|Ch1 R3"},{"t":". Those who discuss the new rules openly, and who accept that loyalty to the absent parent is not "},{"t":"disobedient","id":"disobedient|Ch1 R3"},{"t":" behaviour, do far better. One "},{"t":"consequence","id":"consequence|Ch1 R2"},{"t":" is that the couple needs time alone; another is that each child develops a different "},{"t":"trait","id":"trait|Ch1 R3"},{"t":" in response to the same "},{"t":"circumstance","id":"circumstance|Ch1 R3"},{"t":"."}]},{"ti":"The picture on the screen","u":"Unit 2","seg":[{"t":"The "},{"t":"mass media","id":"mass media|Ch3 R3"},{"t":" still "},{"t":"portray","id":"portray|Ch3 R3"},{"t":" men and women in very different ways. Advertisements "},{"t":"reinforce","id":"reinforce|Ch3 R3"},{"t":" an old "},{"t":"stereotype","id":"stereotype|Ch3 R3"},{"t":": the man is "},{"t":"dominant","id":"dominant|Ch3 R1"},{"t":" and "},{"t":"muscular","id":"muscular|Ch3 R3"},{"t":", the woman gentle and "},{"t":"submissive","id":"submissive|Ch3 R3"},{"t":". Viewers "},{"t":"perceive","id":"perceive|Ch3 R3"},{"t":" these images as harmless, yet they "},{"t":"exaggerate","id":"exaggerate|Ch3 R3"},{"t":" a difference between the sexes that is in fact small. Studies of television "},{"t":"feature","id":"feature|Ch3 R3"},{"t":" two findings. The "},{"t":"initial","id":"initial|Ch3 R3"},{"t":" effect is that children imitate what they see; the lasting effect is that adults stop noticing it. Producers "},{"t":"defend","id":"defend|Ch3 R3"},{"t":" such programmes by saying that they merely reflect society. But the "},{"t":"privilege","id":"privilege|Ch3 R3"},{"t":" of appearing on screen is not shared equally, and the picture on the screen slowly becomes the picture in people's heads."}]},{"ti":"Work, care and health","u":"Unit 2","seg":[{"t":"Women now enter almost every "},{"t":"occu
