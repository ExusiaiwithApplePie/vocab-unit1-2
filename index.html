y sensitive issue.","y":"种族关系是个非常敏感的话题。","c":"Ch6 R1","u":"Unit 3","t":"四级","id":"sensitive|Ch6 R1","b":"read"},{"w":"leak","p":"liːk","o":"v.","e":"to deliberately give secret information to a newspaper, television company, etc.","z":"透露，泄露（秘密给报纸、电视台等）","x":"The report’s findings had been leaked.","y":"这份报告的调查结果已被泄露。","c":"Ch6 R1","u":"Unit 3","t":"四级","id":"leak|Ch6 R1","b":"read"},{"w":"enormous","p":"ɪˈnɔːməs","o":"adj.","e":"very big in size or in amount","z":"（尺寸、数量）巨大的，庞大的","x":"The team made an enormous effort.","y":"该队付出了巨大的努力。","c":"Ch6 R1","u":"Unit 3","t":"四级","id":"enormous|Ch6 R1","b":"read"},{"w":"contribute to","p":"","o":"","e":"to help to make sth. happen","z":"促成，造成","x":"Alcohol contributes to 100,000 deaths a year in the US.","y":"在美国，饮酒每年造成10万人死亡。","c":"Ch6 R1","u":"Unit 3","t":"四级","id":"contribute to|Ch6 R1","b":"read"},{"w":"unrest","p":"ʌnˈrest","o":"n.","e":"a political situation in which people protest or behave violently","z":"动荡，动乱，骚动","x":"There is growing unrest throughout the country.","y":"全国各地日益动荡不安。","c":"Ch6 R1","u":"Unit 3","t":"六级","id":"unrest|Ch6 R1","b":"read"},{"w":"mention","p":"ˈmenʃən","o":"n.","e":"reference to sb./sth.","z":"提及，说起","x":"He made no mention of his wife’s illness.","y":"他没有提起他妻子生病的事。","c":"Ch6 R1","u":"Unit 3","t":"四级","id":"mention|Ch6 R1","b":"read"},{"w":"navigate","p":"ˈnævɪɡeɪt","o":"v.","e":"to find which way you need to go when you are travelling from one place to another","z":"导航，指引方向","x":"Early explorers used to navigate by the stars.","y":"早期的探险家靠星辰确定方向。","c":"Ch6 R1","u":"Unit 3","t":"六级","id":"navigate|Ch6 R1","b":"read"},{"w":"inaccessible","p":"ˌɪnækˈsesəbl","o":"adj.","e":"difficult or impossible to reach","z":"难到达的；不可及的","x":"In winter, the villages are inaccessible by road.","y":"冬天时，进入这些村子的路很难走。","c":"Ch6 R1","u":"Unit 3","t":"学术","id":"inaccessible|Ch6 R1","b":"read"},{"w":"interactive","p":"ˌɪntərˈæktɪv","o":"adj.","e":"An interactive computer program, television system, etc. allows you to communicate directly with it, and reacts to your actions","z":"（人与计算机程序、电视系统等）交互的，互动的","x":"People are astonished at the interactive computer systems.","y":"人们为交互式电脑系统而惊叹。","c":"Ch6 R1","u":"Unit 3","t":"四级","id":"interactive|Ch6 R1","b":"read"},{"w":"in comparison","p":"","o":"","e":"the process of comparing two or more people or things","z":"比较","x":"He was a loud friendly man. In comparison, his brother was rather shy.","y":"他是个热情的大嗓门儿，相比之下他弟弟就有些腼腆。","c":"Ch6 R1","u":"Unit 3","t":"四级","id":"in comparison|Ch6 R1","b":"read"},{"w":"directory","p":"daɪˈrektəri","o":"n.","e":"a book or list of names, facts, etc., usually arranged in alphabetical order","z":"姓名地址录，名录，电话簿","x":"I couldn’t find your number in the telephone directory.","y":"我在电话簿上找不到你的电话号码","c":"Ch6 R1","u":"Unit 3","t":"六级","id":"directory|Ch6 R1","b":"read"},{"w":"collaborate","p":"kəˈlæbəreɪt","o":"v.","e":"to work together with a person or group in order to achieve sth., especially in science or art","z":"（尤指在科学或艺术方面）合作，协作","x":"The two nations are collaborating on several satellite projects.","y":"两国在几个人造卫星项目上展开合作。","c":"Ch6 R1","u":"Unit 3","t":"六级","id":"collaborate|Ch6 R1","b":"read"},{"w":"drawback","p":"ˈdrɔːbæk","o":"n.","e":"a disadvantage of a situation, plan, product, etc.","z":"不利因素；缺点，毛病","x":"It’s a great city — the only drawback is the weather.","y":"这是座很不错的城市，唯一的不足就是天气。","c":"Ch6 R1","u":"Unit 3","t":"六级","id":"drawback|Ch6 R1","b":"read"},{"w":"cautious","p":"ˈkɔːʃəs","o":"adj.","e":"careful to avoid danger or risks","z":"小心的，谨慎的，慎重的","x":"The air-pollution board has reacted with cautious optimism to the announcement.","y":"空气污染委员会对这项通告表示谨慎乐观。","c":"Ch6 R1","u":"Unit 3","t":"四级","id":"cautious|Ch6 R1","b":"read"},{"w":"explosive","p":"ɪkˈspləʊsɪv","o":"adj.","e":"increasing suddenly or quickly in amount or number","z":"（数量或数字）激增的","x":"The explosive growth of microcomputers has changed the world.","y":"微型计算机的迅猛发展改变了世界。","c":"Ch6 R2","u":"Unit 3","t":"六级","id":"explosive|Ch6 R2","b":"read"},{"w":"pervasive","p":"pəˈveɪsɪv","o":"adj.","e":"existing everywhere","z":"到处存在的，到处弥漫着的，遍布的","x":"People are accustomed to the pervasive influence of television.","y":"人们已习惯了电视无所不在的影响。","c":"Ch6 R2","u":"Unit 3","t":"六级","id":"pervasive|Ch6 R2","b":"read"},{"w":"preceding","p":"prɪˈsiːdɪŋ","o":"adj.","e":"happening or coming before the time, place, or part mentioned","z":"在前的，在先的；前面的","x":"Each generation surpasses the preceding one.","y":"一代更比一代强。","c":"Ch6 R2","u":"Unit 3","t":"四级","id":"preceding|Ch6 R2","b":"read"},{"w":"currency","p":"ˈkʌrənsi","o":"n.","e":"the system or type of money that a country uses","z":"货币，通货","x":"The bank can supply you with foreign currency.","y":"这家银行能为你提供外币。","c":"Ch6 R2","u":"Unit 3","t":"六级","id":"currency|Ch6 R2","b":"read"},{"w":"in contrast","p":"","o":"","e":"on the contrary","z":"相反","x":"In contrast, others insist on reading extensively.","y":"与此相反，其他人坚持阅读广泛。","c":"Ch6 R2","u":"Unit 3","t":"四级","id":"in contrast|Ch6 R2","b":"read"},{"w":"take over","p":"","o":"","e":"seize and take control without authority and possibly with force; take as one’s right or possession","z":"接管，接收","x":"He will take over Class 9801 next week.","y":"下星期他将接管 9801 班。","c":"Ch6 R2","u":"Unit 3","t":"四级","id":"take over|Ch6 R2","b":"read"},{"w":"isolate","p":"ˈaɪsəleɪt","o":"v.","e":"to separate one person, group, or thing from other people or things","z":"孤立，隔离","x":"The US has sought to isolate Cuba both economically and politically.","y":"美国一直想在经济和政治上孤立古巴。","c":"Ch6 R2","u":"Unit 3","t":"四级","id":"isolate|Ch6 R2","b":"read"},{"w":"anonymously","p":"əˈnɒnəməslɪ","o":"adv.","e":"unknown by name","z":"无名地，不署名地","x":"According to one employee who remarked anonymously, the company engaged in illegal activities.","y":"根据一位不愿透露姓名的员工所述，这家公司曾从事非法活动。","c":"Ch6 R2","u":"Unit 3","t":"六级","id":"anonymously|Ch6 R2","b":"read"},{"w":"harass","p":"ˈhærəs","o":"v.","e":"to make someone’s life unpleasant, for example by frequently saying offensive things to them or threatening them","z":"骚扰","x":"A number of black youths have complained of being harassed by the police.","y":"一些黑人青年投诉称受到警察骚扰。","c":"Ch6 R2","u":"Unit 3","t":"六级","id":"harass|Ch6 R2","b":"read"},{"w":"rumor","p":"ˈruːmə","o":"n.","e":"information or a story that is passed from one person to another and which may or may not be true","z":"谣言，传闻","x":"I’ve heard all sorts of rumors about him and his secretary.","y":"我听说了有关他和他秘书的种种传闻。","c":"Ch6 R2","u":"Unit 3","t":"六级","id":"rumor|Ch6 R2","b":"read"},{"w":"victim","p":"ˈvɪktɪm","o":"n.","e":"person, animal or thing that is injured, killed or destroyed as the result of carelessness, crime or misfortune","z":"受害者","x":"The victim received head injuries from which she died a week later.","y":"受害人头部受伤，一周后死亡。","c":"Ch6 R2","u":"Unit 3","t":"四级","id":"victim|Ch6 R2","b":"read"},{"w":"upset","p":"ˌʌpˈset","o":"adj.","e":"unhappy and worried because sth. unpleasant or disappointing has happened","z":"不快的，心烦意乱的，烦恼的","x":"She was deeply upset about the way her father treated her.","y":"父亲那样对她，她非常难过。","c":"Ch6 R2","u":"Unit 3","t":"四级","id":"upset|Ch6 R2","b":"read"},{"w":"minimize","p":"ˈmɪnɪmaɪz","o":"v.","e":"to reduce sth. that is difficult, dangerous, or unpleasant to the smallest possible amount or degree","z":"把…减至最小量（程度）","x":"Every effort is being made to minimize civilian casualties.","y":"正在尽最大努力减少平民伤亡。","c":"Ch6 R2","u":"Unit 3","t":"四级","id":"minimize|Ch6 R2","b":"read"},{"w":"accessible","p":"əkˈsesɪbəl","o":"adj.","e":"A place, building, or object that is accessible is easy to reach or get into.","z":"易到达的；易进入的","x":"The island is only accessible by boat.","y":"这个岛只有坐船才能到。","c":"Ch6 R2","u":"Unit 3","t":"四级","id":"accessible|Ch6 R2","b":"read"},{"w":"expand","p":"ɪkˈspænd","o":"v.","e":"to become larger in size, number, or amount, or to make sth. become larger","z":"（使）扩大；增加","x":"Water expands as it freezes.","y":"水结冰时会膨胀。","c":"Ch6 R3","u":"Unit 3","t":"四级","id":"expand|Ch6 R3","b":"read"},{"w":"distraction","p":"dɪˈstrækʃən","o":"n.","e":"sth. that stops you paying attention to what you are doing","z":"使人分心的事物","x":"I study in the library as there are too many distractions at home.","y":"我在图书馆学习，家里分心的事太多。","c":"Ch6 R3","u":"Unit 3","t":"六级","id":"distraction|Ch6 R3","b":"read"},{"w":"account","p":"əˈkaʊnt","o":"n.","e":"a formal contractual relationship established to provide for regular banking or brokerage or business services","z":"账号","x":"He asked to see the executive who handled his account.","y":"他要求见负责他帐号的管理人员。","c":"Ch6 R3","u":"Unit 3","t":"四级","id":"account|Ch6 R3","b":"read"},{"w":"enhance","p":"ɪnˈhɑːns","o":"v.","e":"to improve sth.","z":"提高；改进；增强","x":"Good lighting will enhance any room.","y":"良好的照明能给房间增色不少。","c":"Ch6 R3","u":"Unit 3","t":"四级","id":"enhance|Ch6 R3","b":"read"},{"w":"definition","p":"ˌdefɪˈnɪʃn","o":"n.","e":"a phrase or sentence that says exactly what a word, phrase, or idea means","z":"定义，释义","x":"There are many definitions of the word “feminism”.","y":"“女权主义” 一词有许多定义。","c":"Ch6 R3","u":"Unit 3","t":"四级","id":"definition|Ch6 R3","b":"read"},{"w":"entry","p":"ˈentri","o":"n.","e":"a piece of writing in a diary, or in a book containing information such as a dictionary","z":"（日记的）一则；（词典等的）条目","x":"She marked a dictionary entry on Page 1.","y":"她在词典第一页的条目上做了记号。","c":"Ch6 R3","u":"Unit 3","t":"六级","id":"entry|Ch6 R3","b":"read"},{"w":"opponent","p":"əˈpəʊnənt","o":"n.","e":"someone who you try to defeat in a competition, game, fight, or argument","z":"（竞争、比赛、打斗、争执等的）对手，敌手","x":"Graf’s opponent in today’s final will be Sukova.","y":"格拉芙今天的决赛对手将是苏科娃。","c":"Ch6 R3","u":"Unit 3","t":"六级","id":"opponent|Ch6 R3","b":"read"},{"w":"complexity","p":"kəmˈpleksɪti","o":"n.","e":"the state of being complicated","z":"复杂性，错综复杂","x":"There is increasing recognition of the complexity of the causes of poverty.","y":"人们越来越认识到，造成贫困的原因错综复杂。","c":"Ch6 R3","u":"Unit 3","t":"四级","id":"complexity|Ch6 R3","b":"read"},{"w":"literacy","p":"ˈlɪtərəsi","o":"n.","e":"the state of being able to read and write","z":"读写能力，识字","x":"The government has started a new adult literacy campaign.","y":"政府开始了新一轮成人识字（扫盲）运动。","c":"Ch6 R3","u":"Unit 3","t":"六级","id":"literacy|Ch6 R3","b":"read"},{"w":"deviance","p":"'di:vɪəns","o":"n.","e":"a state or condition markedly different from the norm","z":"偏常，异常，异常行为","x":"It is a study of social deviance and crime.","y":"这是一个对社会偏常行为和犯罪行为的研究。","c":"Ch7 R1","u":"Unit 4","t":"六级","id":"deviance|Ch7 R1","b":"read"},{"w":"deviant","p":"ˈdi:viənt","o":"adj.","e":"different from what most people consider to be normal and acceptable","z":"不正常的；异常的；偏离常轨的","x":"Of course, not all alcoholics and drug abusers produce deviant offspring.","y":"当然，并不是所有的酗酒者和吸毒者都会生育出不正常的后代。","c":"Ch7 R1","u":"Unit 4","t":"六级","id":"deviant|Ch7 R1","b":"read"},{"w":"prostitution","p":"ˌprɒstɪˈtju:ʃn","o":"n.","e":"having sex with people in exchange for money","z":"卖淫；为娼","x":"Many women were forced into prostitution.","y":"许多妇女被迫为娼。","c":"Ch7 R1","u":"Unit 4","t":"六级","id":"prostitution|Ch7 R1","b":"read"},{"w":"legitimate","p":"lɪˈdʒɪtɪmət","o":"adj.","e":"for which there is a fair and acceptable reason","z":"正当合理的；合情合理的","x":"The New York Times has a legitimate claim to be a national newspaper.","y":"《纽约时报》有理由称自己是一份全国性报纸。","c":"Ch7 R1","u":"Unit 4","t":"六级","id":"legitimate|Ch7 R1","b":"read"},{"w":"assault","p":"əˈsɔ:lt","o":"n.","e":"the crime of attacking sb. physically","z":"侵犯他人身体（罪）","x":"A significant number of indecent assaults on women go unreported.","y":"很大数量的猥亵妇女罪没有被报。","c":"Ch7 R1","u":"Unit 4","t":"六级","id":"assault|Ch7 R1","b":"read"},{"w":"ethnicity","p":"eθˈnɪsəti","o":"n.","e":"the fact of belonging to a particular race","z":"种族渊源；种族特点","x":"Many factors are important, for example class, gender, age and ethnicity.","y":"许多因素都很重要，如阶级、性别、年龄及民族。","c":"Ch7 R1","u":"Unit 4","t":"六级","id":"ethnicity|Ch7 R1","b":"read"},{"w":"corporate","p":"ˈkɔ:pərət","o":"adj.","e":"connected with a corporation","z":"公司的","x":"Airlines are very keen on their corporate identity.","y":"航空公司非常重视自身的企业形象。","c":"Ch7 R2","u":"Unit 4","t":"学术","id":"corporate|Ch7 R2","b":"read"},{"w":"embezzlement","p":"ɪmˈbezlmənt","o":"n.","e":"the crime of stealing money that you are responsible for or that belongs to your employer","z":"盗用，挪用，贪污，侵吞（款项）","x":"She was found guilty of embezzlement.","y":"她被判犯有贪污罪。","c":"Ch7 R2","u":"Unit 4","t":"六级","id":"embezzlement|Ch7 R2","b":"read"},{"w":"trafficking","p":"ˈtræfikɪŋ","o":"n.","e":"the buying and selling of illegal goods, especially drugs","z":"（尤指毒品的）非法买卖，非法交易","x":"Those who are involved in drug trafficking should be brought to justice.","y":"那些非法贩卖毒品的人都应依法受到惩处。","c":"Ch7 R2","u":"Unit 4","t":"六级","id":"trafficking|Ch7 R2","b":"read"},{"w":"bully","p":"ˈbʊli","o":"v.","e":"to frighten or hurt a weaker person; to use your strength or power to make sb. do sth.","z":"恐吓；伤害；胁迫","x":"My son is being bullied at school.","y":"我儿子在学校里受欺负。","c":"Ch7 R2","u":"Unit 4","t":"四级","id":"bully|Ch7 R2","b":"read"},{"w":"decline","p":"dɪˈklaɪn","o":"n.","e":"a continuous decrease in the number, value, quality, etc.","z":"（数量、价值、质量等的）减少，下降，衰落，衰退","x":"An increase in cars has resulted in the decline of public transport.","y":"汽车的增加导致了公共交通的减少","c":"Ch7 R2","u":"Unit 4","t":"学术","id":"decline|Ch7 R2","b":"read"},{"w":"statistics","p":"stəˈtɪstɪks","o":"n.","e":"a collection of information shown in numbers","z":"统计数字；统计资料","x":"According to official statistics the disease killed over 500 people.","y":"根据官方的统计数字，500多人死于这种疾病。","c":"Ch7 R2","u":"Unit 4","t":"学术","id":"statistics|Ch7 R2","b":"read"},{"w":"mental","p":"ˈmentl","o":"adj.","e":"connected with the state of health of the mind or with the treatment of illnesses of the mind","z":"精神的，心理的","x":"She was suffering from physical and mental exhaustion.","y":"她当时已经是身心俱疲。","c":"Ch7 R2","u":"Unit 4","t":"学术","id":"mental|Ch7 R2","b":"read"},{"w":"demographics","p":"ˌdeməˈgræfɪks","o":"n.","e":"data relating to the population and different groups within it","z":"人口统计数据","x":"The target market for a product describes demographics as well as lifestyles and sometimes job roles.","y":"产品的目标市场描述了人群统计、生活方式，有时也涉及职业角色。","c":"Ch7 R2","u":"Unit 4","t":"六级","id":"demographics|Ch7 R2","b":"read"},{"w":"potential","p":"pəˈtenʃl","o":"adj.","e":"that can develop into sth. or be developed in the future","z":"潜在的；可能的","x":"The firm has identified 60 potential customers at home and abroad.","y":"该公司已在国内外找到60个潜在客户。","c":"Ch7 R2","u":"Unit 4","t":"学术","id":"potential|Ch7 R2","b":"read"},{"w":"socioeconomic group","p":"","o":"","e":"a group within a particular social structure, which depends on several factors, including occupation, education, and income","z":"社会经济群体","x":"Different socioeconomic groups are likely to have different tastes.","y":"不同的社会经济群体会有不同的品味。","c":"Ch7 R2","u":"Unit 4","t":"学术","id":"socioeconomic group|Ch7 R2","b":"read"},{"w":"regulation","p":"ˌreɡjʊˈleɪʃn","o":"n.","e":"an official rule made by a government or some other authority","z":"（常用复数）章程；规章制度；规则；法规","x":"Under the new regulations spending on office equipment will be strictly controlled.","y":"根据新的规定，办公设备开支将受到严格控制。","c":"Ch7 R2","u":"Unit 4","t":"学术","id":"regulation|Ch7 R2","b":"read"},{"w":"obvious","p":"ˈɒbviəs","o":"adj.","e":"easy to see or understand","z":"明显的；显然的；易理解的","x":"It was obvious to everyone that the child had been badly treated.","y":"所有人一看便知，那个孩子受过虐待。","c":"Ch7 R2","u":"Unit 4","t":"学术","id":"obvious|Ch7 R2","b":"read"},{"w":"adequate","p":"ˈædɪkwət","o":"adj.","e":"enough in quantity, or good enough in quality, for a particular purpose or need","z":"足够的；合格的；合乎需要的","x":"There is a lack of adequate provision for disabled students.","y":"为残疾学生提供的服务不够。","c":"Ch7 R2","u":"Unit 4","t":"学术","id":"adequate|Ch7 R2","b":"read"},{"w":"individual","p":"ˌɪndɪˈvɪdʒuəl","o":"n.","e":"a person considered separately rather than as part of a group","z":"个人","x":"The competition is open to both teams and individuals.","y":"团队和个人均可参加比赛。","c":"Ch7 R2","u":"Unit 4","t":"学术","id":"individual|Ch7 R2","b":"read"},{"w":"estimate","p":"ˈestɪmət","o":"v.","e":"to form an idea of the cost, size, value, etc. of sth., but without calculating it exactly","z":"估价；估算","x":"It is hard to estimate how many children suffer from dyslexia.","y":"很难估计有多少孩子有诵读困难。","c":"Ch7 R2","u":"Unit 4","t":"学术","id":"estimate|Ch7 R2","b":"read"},{"w":"counterfeit","p":"ˈkaʊntəfɪt","o":"adj.","e":"(of money and goods for sale) made to look exactly like sth. in order to trick people into thinking that they are getting the real thing","z":"伪造的；仿造的；假冒的","x":"He admitted possessing and delivering counterfeit currency.","y":"他供认持有并散播假币。","c":"Ch7 R2","u":"Unit 4","t":"六级","id":"counterfeit|Ch7 R2","b":"read"},{"w":"item","p":"ˈaɪtəm","o":"n.","e":"a single article or object","z":"一件商品（或物品）","x":"The computer was my largest single item of expenditure.","y":"电脑是我花钱最多的一件东西。","c":"Ch7 R2","u":"Unit 4","t":"学术","id":"item|Ch7 R2","b":"read"},{"w":"cybercrime","p":"ˈsaɪbəˌkraɪm","o":"n.","e":"a crime that is committed with the help of computers and/or the Internet","z":"网络犯罪","x":"Cybercrime is at such an all-time high that the FBI has listed it as one of the top security threats.","y":"网络犯罪处于历史最高水平，以至于联邦调查局已经将它列为最大的安全威胁之一。","c":"Ch7 R3","u":"Unit 4","t":"四级","id":"cybercrime|Ch7 R3","b":"read"},{"w":"cripple","p":"ˈkrɪpl","o":"v.","e":"to seriously damage or harm sb./sth.","z":"严重毁坏（或损害）","x":"A total cut-off of supplies would cripple the country’s economy.","y":"全面切断物品供应会使该国经济陷入瘫痪。","c":"Ch7 R3","u":"Unit 4","t":"六级","id":"cripple|Ch7 R3","b":"read"},{"w":"attachment","p":"əˈtætʃmənt","o":"n.","e":"a document that you send to sb. using e-mail","z":"（用电子邮件发送的）附件","x":"When you send an e-mail you can also send a sound or graphic file as an attachment.","y":"在发送电子邮件时，你也可以附上一份声音或图片文件。","c":"Ch7 R3","u":"Unit 4","t":"学术","id":"attachment|Ch7 R3","b":"read"},{"w":"equipment","p":"ɪˈkwɪpmənt","o":"n.","e":"the things that are needed for a particular purpose or activity","z":"设备；器材","x":"The shop sells camping equipment.","y":"这家商店出售露营装备。","c":"Ch7 R3","u":"Unit 4","t":"学术","id":"equipment|Ch7 R3","b":"read"},{"w":"deter","p":"dɪˈtɜ:(r)","o":"v.","e":"to make sb. decide not to do sth. or continue doing sth., especially by making them understand the difficulties and unpleasant results of their actions","z":"制止；阻止；威慑；使不敢","x":"The high price of the service could deter people from seeking advice.","y":"这么高的服务费可能使咨询者望而却步。","c":"Ch8 R1","u":"Unit 4","t":"六级","id":"deter|Ch8 R1","b":"read"},{"w":"display","p":"dɪˈspleɪ","o":"v.","e":"to put sth. in a place where people can see it easily; to show sth. to people","z":"陈列；展出；展示","x":"The exhibition gives local artists an opportunity to display their work.","y":"这次展览为当地艺术家提供了展示自己作品的机会。","c":"Ch8 R1","u":"Unit 4","t":"学术","id":"display|Ch8 R1","b":"read"},{"w":"prosecute","p":"ˈprɒsɪkju:t","o":"v.","e":"to officially charge sb. with a crime in court","z":"起诉；控告；检举","x":"Trespassers will be prosecuted.","y":"闲人莫入，违者必究。","c":"Ch8 R1","u":"Unit 4","t":"六级","id":"prosecute|Ch8 R1","b":"read"},{"w":"detective","p":"dɪˈtektɪv","o":"n.","e":"a person, especially a police officer, whose job is to examine crimes and catch criminals","z":"侦探；警探","x":"She hired a private detective in an attempt to find her daughter.","y":"她雇了一名私人侦探，试图找到自己的女儿。","c":"Ch8 R1","u":"Unit 4","t":"学术","id":"detective|Ch8 R1","b":"read"},{"w":"colleague","p":"ˈkɒli:g","o":"n.","e":"a person that you work with, especially in a profession or a business","z":"同事；同僚","x":"We were friends and colleagues for more than 20 years.","y":"20多年来我们既是朋友又是同事。","c":"Ch8 R1","u":"Unit 4","t":"学术","id":"colleague|Ch8 R1","b":"read"},{"w":"researcher","p":"rɪ'sɜ:tʃə(r)","o":"n.","e":"a scientist who devotes himself to doing research","z":"研究员；调查者","x":"It was an unexpected turn for a researcher.","y":"对于一个学术研究者来说，这是一个出乎意料的转机。","c":"Ch8 R1","u":"Unit 4","t":"学术","id":"researcher|Ch8 R1","b":"read"},{"w":"bond","p":"bɒnd","o":"n.","e":"sth. that forms a connection between people or groups, such as a feeling of friendship or shared ideas and experiences","z":"纽带；联系；关系","x":"A bond of friendship had been forged between them.","y":"他们之间形成了一种友谊的纽带。","c":"Ch8 R1","u":"Unit 4","t":"学术","id":"bond|Ch8 R1","b":"read"},{"w":"imposition","p":"ˌɪmpəˈzɪʃn","o":"n.","e":"the act of introducing sth. such as a new law or rule, or a new tax","z":"（新法律或规则等的）颁布，实施；（新税的）征收","x":"The main grievance of the drivers is the imposition of higher fees for driving licenses.","y":"让驾驶员深感不满的是驾驶执照收费的提高。","c":"Ch8 R1","u":"Unit 4","t":"六级","id":"imposition|Ch8 R1","b":"read"},{"w":"punitive","p":"ˈpju:nətɪv","o":"adj.","e":"intended as punishment","z":"惩罚性的；刑罚的；处罚的","x":"There are calls for more punitive measures against people who drink and drive.","y":"有人呼吁对酒后驾车的人要有更具处罚性的措施。","c":"Ch8 R1","u":"Unit 4","t":"六级","id":"punitive|Ch8 R1","b":"read"},{"w":"license","p":"ˈlaɪsns","o":"n.","e":"an official document that shows that permission has been given to do, own or use sth.","z":"许可证；执照","x":"You need a license to fish in this river.","y":"在这条河里钓鱼要有许可证。","c":"Ch8 R1","u":"Unit 4","t":"学术","id":"license|Ch8 R1","b":"read"},{"w":"deterrent","p":"dɪˈterənt","o":"n.","e":"a thing that makes sb. less likely to do sth.","z":"威慑因素；遏制力","x":"Hopefully his punishment will act as a deterrent to others.","y":"但愿对他的惩罚能起到杀一儆百的作用。","c":"Ch8 R1","u":"Unit 4","t":"六级","id":"deterrent|Ch8 R1","b":"read"},{"w":"severity","p":"sɪˈverətɪ","o":"n.","e":"quality of being severe","z":"严格；严厉；剧烈","x":"A prison sentence should match the severity of the crime.","y":"刑期长短要和罪行轻重一致。","c":"Ch8 R1","u":"Unit 4","t":"四级","id":"severity|Ch8 R1","b":"read"},{"w":"law enforcement agencies","p":"","o":"","e":"government offices that are responsible for upholding laws and finding people who break them","z":"执法机构","x":"Law enforcement agencies from different countries could foster the habit of cooperation.","y":"来自不同国家的执法机构可以培养联合行动的习惯。","c":"Ch8 R2","u":"Unit 4","t":"四级","id":"law enforcement agencies|Ch8 R2","b":"read"},{"w":"swirl","p":"swɜ:l","o":"v.","e":"to move around quickly in a circle; to make sth. do this","z":"（使）打旋，旋动，起旋涡","x":"The water swirled down the drain.","y":"水打着旋流进了下水道。","c":"Ch8 R2","u":"Unit 4","t":"六级","id":"swirl|Ch8 R2","b":"read"},{"w":"sufficient","p":"səˈfɪʃnt","o":"adj.","e":"enough for a particular purpose; as much as you need","z":"足够的；充足的","x":"These reasons are not sufficient to justify the ban.","y":"这些理由不足以证明实施禁令有理。","c":"Ch8 R2","u":"Unit 4","t":"学术","id":"sufficient|Ch8 R2","b":"read"},{"w":"invisible","p":"ɪnˈvɪzəbl","o":"adj.","e":"that cannot be seen","z":"看不见的；隐形的","x":"The belt is invisible even under the thinnest garments.","y":"这种腰带即便在最薄的衣衫下都看不出来。","c":"Ch8 R2","u":"Unit 4","t":"学术","id":"invisible|Ch8 R2","b":"read"},{"w":"retrieve","p":"rɪˈtri:v","o":"v.","e":"(formal) to bring or get sth. back","z":"取回；索回","x":"She bent to retrieve her comb from the floor.","y":"她弯腰从地上捡起她的梳子。","c":"Ch8 R2","u":"Unit 4","t":"六级","id":"retrieve|Ch8 R2","b":"read"},{"w":"analysis","p":"əˈnæləsɪs","o":"n.","e":"the detailed study or examination of sth. in order to understand more about it; the result of the study","z":"（对事物的）分析，分析结果","x":"The book is an analysis of poverty and its causes.","y":"这本书分析了贫困及其原因。","c":"Ch8 R2","u":"Unit 4","t":"学术","id":"analysis|Ch8 R2","b":"read"},{"w":"document","p":"ˈdɒkjumənt","o":"n.","e":"an official paper or book that gives information about sth., or that can be used as evidence or proof of sth.","z":"文件；公文；文献；证件","x":"Copies of the relevant documents must be filed at court.","y":"有关文件副本必须送交法院备案。","c":"Ch8 R2","u":"Unit 4","t":"学术","id":"document|Ch8 R2","b":"read"},{"w":"technique","p":"tekˈni:k","o":"n.","e":"a particular way of doing sth., especially one in which you have to learn special skills","z":"技巧；技艺；工艺","x":"The artist combines different techniques in the same painting.","y":"这位艺术家在同一幅画中把不同的画法结合在一起。","c":"Ch8 R2","u":"Unit 4","t":"学术","id":"technique|Ch8 R2","b":"read"},{"w":"strand","p":"strænd","o":"n.","e":"a single thin piece of thread, wire, hair, etc.","z":"（线、绳、金属线、毛发等的）股，缕","x":"She wore a single strand of pearls around her neck.","y":"她脖子上戴着一串珍珠。","c":"Ch8 R2","u":"Unit 4","t":"六级","id":"strand|Ch8 R2","b":"read"},{"w":"confirm","p":"kənˈfɜ:m","o":"v.","e":"to state or show that sth. is definitely true or correct, especially by providing evidence","z":"（尤指提供证据来）证实，证明，确认","x":"His guilty expression confirmed my suspicions.","y":"他内疚的表情证实了我的猜疑。","c":"Ch8 R2","u":"Unit 4","t":"学术","id":"confirm|Ch8 R2","b":"read"},{"w":"retribution","p":"ˌretrɪˈbju:ʃn","o":"n.","e":"severe punishment for sth. seriously wrong that sb. has done","z":"严惩；惩罚；报应","x":"People are seeking retribution for the latest terrorist outrages.","y":"人们在设法对恐怖分子最近的暴行进行严惩。","c":"Ch8 R3","u":"Unit 4","t":"六级","id":"retribution|Ch8 R3","b":"read"},{"w":"incapacitation","p":"ɪnkəpæsɪˈteɪʃən","o":"n.","e":"the effect of a sentence in terms of positively preventing (rather than merely deterring) future offending","z":"无能力；隔离惩罚","x":"Some people believe the incapacitation approach is more effective than the rehabilitation approach.","y":"有些人认为“隔离法”比“塑新法”更有效。","c":"Ch8 R3","u":"Unit 4","t":"六级","id":"incapacitation|Ch8 R3","b":"read"},{"w":"rehabilitation","p":"ˌri:əˌbɪlɪˈteɪʃn","o":"n.","e":"the restoration of someone to a useful place in society","z":"康复；恢复；塑新","x":"He was well known for his work in the field of drug rehabilitation.","y":"他因在戒毒康复领域所做的工作而为人熟知。","c":"Ch8 R3","u":"Unit 4","t":"六级","id":"rehabilitation|Ch8 R3","b":"read"},{"w":"incarceration","p":"ɪnˌkɑ:səˈreɪʃn","o":"n.","e":"the state of being imprisoned","z":"监禁；禁闭","x":"Her childhood was overshadowed by her mother’s incarceration in a psychiatric hospital.","y":"她的母亲被关在精神病院，这给她的童年蒙上了阴影。","c":"Ch8 R3","u":"Unit 4","t":"六级","id":"incarceration|Ch8 R3","b":"read"},{"w":"react","p":"riˈækt","o":"v.","e":"to change or behave in a particular way as a result of or in response to sth.","z":"起反应；（对…）作出反应；回应","x":"The market reacted by falling a further two points.","y":"股市的反应是再下跌两个百分点。","c":"Ch8 R3","u":"Unit 4","t":"学术","id":"react|Ch8 R3","b":"read"},{"w":"sentence","p":"ˈsentəns","o":"n.","e":"the punishment given by a court","z":"判决；宣判；判刑","x":"The prisoner has served (=completed) his sentence and will be released tomorrow.","y":"犯人服刑期满，明天将获释。","c":"Ch8 R3","u":"Unit 4","t":"四级","id":"sentence|Ch8 R3","b":"read"},{"w":"inmate","p":"ˈɪnmeɪt","o":"n.","e":"one of the people living in an institution such as a prison or a mental hospital","z":"（监狱或精神病院等处）同住者；同狱犯人；同病房者","x":"A comely woman coach jogs alongside an inmate in the prison yard.","y":"一个清秀的女教练和犯人一起在监狱院子里慢跑。","c":"Ch8 R3","u":"Unit 4","t":"六级","id":"inmate|Ch8 R3","b":"read"},{"w":"release","p":"rɪˈli:s","o":"n.","e":"the act of setting a person or an animal free; the state of being set free","z":"释放；获释","x":"The government has been working to secure the release of the hostages.","y":"政府一直在努力争取使人质获释。","c":"Ch8 R3","u":"Unit 4","t":"学术","id":"release|Ch8 R3","b":"read"},{"w":"alternative","p":"ɔ:lˈtɜ:nətɪv","o":"n.","e":"a thing that you can choose to do or have out of two or more possibilities","z":"可供选择的事物","x":"You can be paid in cash weekly or by cheque monthly; those are the two alternatives.","y":"你的工资可以按周以现金支取，或按月以支票支取。二者可选其一。","c":"Ch8 R3","u":"Unit 4","t":"学术","id":"alternative|Ch8 R3","b":"read"},{"w":"probation","p":"prəˈbeɪʃn","o":"n.","e":"a system that allows a person who has committed a crime not to go to prison if they behave well and if they see an official (called a probation officer) regularly for a fixed period of time","z":"缓刑制；缓刑","x":"The prisoner was put on probation.","y":"犯人已获缓刑。","c":"Ch8 R3","u":"Unit 4","t":"六级","id":"probation|Ch8 R3","b":"read"},{"w":"assist","p":"əˈsɪst","o":"v.","e":"to help sb. to do sth.","z":"帮助；协助；援助","x":"We will assist you in finding somewhere to live.","y":"我们将帮你找个住的地方。","c":"Ch8 R3","u":"Unit 4","t":"学术","id":"assist|Ch8 R3","b":"read"},{"w":"ultimate","p":"ˈʌltɪmət","o":"adj.","e":"happening at the end of a long process","z":"最后的；最终的；终极的","x":"We will accept ultimate responsibility for whatever happens.","y":"无论出什么事情，我们愿承担最终责任。","c":"Ch8 R3","u":"Unit 4","t":"学术","id":"ultimate|Ch8 R3","b":"read"},{"w":"dreary","p":"ˈdrɪəri","o":"adj.","e":"that makes you feel sad; dull and not interesting","z":"令人沮丧的；沉闷的；枯燥无味的","x":"They live such dreary lives.","y":"他们的生活如此乏味！","c":"Ch8 R3","u":"Unit 4","t":"六级","id":"dreary|Ch8 R3","b":"read"},{"w":"confine","p":"kənˈfaɪn","o":"v.","e":"to keep sb./sth. inside the limits of a particular activity, subject, area, etc.","z":"限制；限定","x":"The work will not be confined to the Glasgow area.","y":"此项工作不会局限于格拉斯哥地区","c":"Ch8 R3","u":"Unit 4","t":"学术","id":"confine|Ch8 R3","b":"read"},{"w":"respond","p":"rɪˈspɒnd","o":"v.","e":"(formal) to give a spoken or written answer to sb./sth.","z":"（口头或书面）回答，回应","x":"She never responded to my letter.","y":"她从来没给我回过信。","c":"Ch8 R3","u":"Unit 4","t":"四级","id":"respond|Ch8 R3","b":"read"},{"w":"access","p":"ˈækses","o":"v.","e":"to find information, especially on a computer","z":"存取，获取","x":"Users can access their voice mail remotely.","y":"用户可以远程获取语音邮件。","c":"Ch8 R3","u":"Unit 4","t":"四级","id":"access|Ch8 R3","b":"read"},{"w":"adolescence","p":"ˌædəˈlesəns","o":"n","e":"the period of life when a child develops into an adult","z":"青春期","x":"Many changes happen during adolescence.","y":"","c":"U1 Growing Up","u":"U1","t":"学术","id":"adolescence|U1","b":"ielts"},{"w":"adulthood","p":"ˈædʌlthʊd","o":"n","e":"the state or condition of being fully grown","z":"成年期","x":"He took on more responsibility in adulthood.","y":"","c":"U1 Growing Up","u":"U1","t":"学术","id":"adulthood|U1","b":"ielts"},{"w":"bond","p":"bɒnd","o":"n","e":"a close connection that joins people","z":"纽带；关系","x":"The twins share a strong bond.","y":"","c":"U1 Growing Up","u":"U1","t":"学术","id":"bond|U1","b":"ielts"},{"w":"brotherhood","p":"ˈbrʌðəhʊd","o":" const PASS=[{"ti":"Marriage in transition","u":"Unit 1","seg":[{"t":"Marriage as an "},{"t":"institution","id":"institution|Ch1 R1"},{"t":" has changed a great deal in fifty years. The clearest "},{"t":"trend","id":"trend|Ch1 R1"},{"t":" is that couples now "},{"t":"postpone","id":"postpone|Ch1 R1"},{"t":" the wedding until both partners have finished their education. In most large cities the "},{"t":"majority","id":"majority|Ch1 R1"},{"t":" of young people live together before they marry, while a small "},{"t":"minority","id":"minority|Ch1 R1"},{"t":" decide not to marry at all. Sociologists disagree about the "},{"t":"primary","id":"primary|Ch1 R1"},{"t":" cause. Some argue that it is economic: a single "},{"t":"spouse","id":"spouse|Ch1 R1"},{"t":" can no longer support a family on one salary. Others point to a "},{"t":"considerable","id":"considerable|Ch1 R1"},{"t":" change in values, and to the fact that a "},{"t":"community","id":"community|Ch1 R1"},{"t":" now expects far less of a wedding and far more of a partnership. Whatever the explanation, the birth rate continues to "},{"t":"decline","id":"decline|Ch1 R1"},{"t":", and old customs have had to "},{"t":"adapt","id":"adapt|Ch1 R1"},{"t":". Most couples "},{"t":"eventually","id":"eventually|Ch1 R1"},{"t":" settle into arrangements their grandparents would not recognise."}]},{"ti":"When a family is rebuilt","u":"Unit 1","seg":[{"t":"When a single parent remarries, the new "},{"t":"household","id":"household|Ch1 R2"},{"t":" has to be rebuilt from nothing. Children often "},{"t":"resent","id":"resent|Ch1 R2"},{"t":" the stranger who suddenly shares their home, and small disagreements can turn into open "},{"t":"conflict","id":"conflict|Ch1 R2"},{"t":". Parents tend to "},{"t":"assume","id":"assume|Ch1 R3"},{"t":" that affection will grow by itself, but research "},{"t":"reveals","id":"reveal|Ch1 R3"},{"t":" a more complicated picture: a child's first reaction is usually "},{"t":"negative","id":"negative|Ch1 R3"},{"t":" and may last for years. What matters is whether adults handle the "},{"t":"shift","id":"shift|Ch1 R2"},{"t":" "},{"t":"appropriately","id":"appropriately|Ch1 R3"},{"t":". Those who discuss the new rules openly, and who accept that loyalty to the absent parent is not "},{"t":"disobedient","id":"disobedient|Ch1 R3"},{"t":" behaviour, do far better. One "},{"t":"consequence","id":"consequence|Ch1 R2"},{"t":" is that the couple needs time alone; another is that each child develops a different "},{"t":"trait","id":"trait|Ch1 R3"},{"t":" in response to the same "},{"t":"circumstance","id":"circumstance|Ch1 R3"},{"t":"."}]},{"ti":"The picture on the screen","u":"Unit 2","seg":[{"t":"The "},{"t":"mass media","id":"mass media|Ch3 R3"},{"t":" still "},{"t":"portray","id":"portray|Ch3 R3"},{"t":" men and women in very different ways. Advertisements "},{"t":"reinforce","id":"reinforce|Ch3 R3"},{"t":" an old "},{"t":"stereotype","id":"stereotype|Ch3 R3"},{"t":": the man is "},{"t":"dominant","id":"dominant|Ch3 R1"},{"t":" and "},{"t":"muscular","id":"muscular|Ch3 R3"},{"t":", the woman gentle and "},{"t":"submissive","id":"submissive|Ch3 R3"},{"t":". Viewers "},{"t":"perceive","id":"perceive|Ch3 R3"},{"t":" these images as harmless, yet they "},{"t":"exaggerate","id":"exaggerate|Ch3 R3"},{"t":" a difference between the sexes that is in fact small. Studies of television "},{"t":"feature","id":"feature|Ch3 R3"},{"t":" two findings. The "},{"t":"initial","id":"initial|Ch3 R3"},{"t":" effect is that children imitate what they see; the lasting effect is that adults stop noticing it. Producers "},{"t":"defend","id":"defend|Ch3 R3"},{"t":" such programmes by saying that they merely reflect society. But the "},{"t":"privilege","id":"privilege|Ch3 R3"},{"t":" of appearing on screen is not shared equally, and the picture on the screen slowly becomes the picture in people's heads."}]},{"ti":"Work, care and health","u":"Unit 2","seg":[{"t":"Women now enter almost every "},{"t":"occupation","id":"occupation|Ch4 R2"},{"t":", yet "},{"t":"discrimination","id":"discrimination|Ch4 R2"},{"t":" has not disappeared. The "},{"t":"disparity","id":"disparity|Ch4 R3"},{"t":" in pay is smaller than it was, but it remains: a woman in the same job still earns less, and the "},{"t":"compensation","id":"compensation|Ch4 R3"},{"t":" she receives for overtime rarely closes the gap. Some countries now "},{"t":"prohibit","id":"prohibit|Ch4 R3"},{"t":" employers from asking about past salaries, and economists "},{"t":"predict","id":"predict|Ch4 R3"},{"t":" that such laws will help, though slowly. Harder to measure is the "},{"t":"persistent","id":"persistent|Ch4 R2"},{"t":" "},{"t":"strain","id":"strain|Ch4 R2"},{"t":" of combining paid work with care at home, which appears as illness rather than as a pay gap. Researchers who study "},{"t":"longevity","id":"longevity|Ch4 R2"},{"t":" find that people in demanding jobs have a shorter "},{"t":"life expectancy","id":"life expectancy|Ch4 R2"},{"t":" than those who set their own hours. The "},{"t":"stress","id":"stress|Ch1 R2"},{"t":" is not only physical; it also threatens a person's sense of "},{"t":"identity","id":"identity|Ch4 R2"},{"t":", especially when the job disappears."}]},{"ti":"The screen in your pocket","u":"Unit 3","seg":[{"t":"Fifty years ago television gathered the whole family in one room, and a "},{"t":"documentary","id":"documentary|Ch5 R1"},{"t":" on the evening news was something people discussed the next day. Today the same "},{"t":"content","id":"content|Ch5 R1"},{"t":" arrives on a "},{"t":"portable","id":"portable|Ch5 R1"},{"t":" screen, and the viewer often feels "},{"t":"isolated","id":"isolated|Ch5 R1"},{"t":" rather than part of an "},{"t":"audience","id":"audience|Ch5 R1"},{"t":". The change is not only one of size. A single video can "},{"t":"transmit","id":"transmit|Ch5 R1"},{"t":" an image around the world in minutes, and its "},{"t":"appeal","id":"appeal|Ch5 R1"},{"t":" depends less on quality than on "},{"t":"immediacy","id":"immediacy|Ch5 R2"},{"t":". For some this brings "},{"t":"companionship","id":"companionship|Ch5 R1"},{"t":"; for others it is a "},{"t":"distraction","id":"distraction|Ch6 R3"},{"t":" that no one can escape, because the screen is always "},{"t":"accessible","id":"accessible|Ch6 R2"},{"t":". Researchers who study the medium describe it as "},{"t":"pervasive","id":"pervasive|Ch6 R2"},{"t":": it fills the gaps of the day. Whether it can actually "},{"t":"enhance","id":"enhance|Ch6 R3"},{"t":" our lives, or merely fill them, remains an open question."}]},{"ti":"Drawing the line","u":"Unit 4","seg":[{"t":"Every society draws a line between acceptable behaviour and "},{"t":"deviance","id":"deviance|Ch7 R1"},{"t":", but the line keeps moving. An act that one generation treated as a serious "},{"t":"assault","id":"assault|Ch7 R1"},{"t":" may now be handled by "},{"t":"regulation","id":"regulation|Ch7 R2"},{"t":", while conduct nobody thought criminal a decade ago — "},{"t":"corporate","id":"corporate|Ch7 R2"},{"t":" fraud, the "},{"t":"trafficking","id":"trafficking|Ch7 R2"},{"t":" of stolen data, "},{"t":"cybercrime","id":"cybercrime|Ch7 R3"},{"t":" — now fills the courts. The official "},{"t":"statistics","id":"statistics|Ch7 R2"},{"t":" suggest that harsher punishment does not by itself "},{"t":"deter","id":"deter|Ch8 R1"},{"t":" offenders. What does seem to matter is the certainty of being caught, which is why "},{"t":"law enforcement agencies","id":"law enforcement agencies|Ch8 R2"},{"t":" put money into "},{"t":"analysis","id":"analysis|Ch8 R2"},{"t":" rather than into building more prisons. Critics of the system argue that "},{"t":"incarceration","id":"incarceration|Ch8 R3"},{"t":" answers none of the questions that produced the offence, and that "},{"t":"rehabilitation","id":"rehabilitation|Ch8 R3"},{"t":" is both cheaper and more effective. The "},{"t":"severity","id":"severity|Ch8 R1"},{"t":" of a penalty, they say, matters round them. "},{"t":"cognitive","id":"cognitive|U2"},{"t":" development depends on both genes and experience, and a child's "},{"t":"memory","id":"memory|U2"},{"t":" improves steadily with age. Some ideas, such as time, are too "},{"t":"abstract","id":"abstract|U2"},{"t":" for a young child's "},{"t":"mind","id":"mind|U2"},{"t":"."}]},{"ti":"No quick fix","u":"U3","seg":[{"t":"Governments keep telling us to eat less and move more, yet "},{"t":"obesity","id":"obesity|U3"},{"t":" continues to rise. One "},{"t":"factor","id":"factor|U3"},{"t":" is the size of the "},{"t":"portion","id":"portion|U3"},{"t":" served in restaurants; another is the amount of "},{"t":"fat","id":"fat|U3"},{"t":" and sugar hidden in processed food. A poor "},{"t":"diet","id":"diet|U3"},{"t":" raises the "},{"t":"risk","id":"risk|U3"},{"t":" of heart disease and "},{"t":"stroke","id":"stroke|U3"},{"t":". Doctors recommend "},{"t":"moderate","id":"moderate|U3"},{"t":" exercise — a "},{"t":"brisk","id":"brisk|U3"},{"t":" walk is enough — and ask patients to cut their salt "},{"t":"intake","id":"intake|U3"},{"t":". There is no magic "},{"t":"cure","id":"cure|U3"},{"t":", but small daily changes "},{"t":"prevent","id":"prevent|U3"},{"t":" most cases."}]},{"ti":"Time, money and what matters","u":"U4","seg":[{"t":"Ask people what makes a good "},{"t":"lifestyle","id":"lifestyle|U4"},{"t":" and the answers are surprisingly similar: health, time with family, and work that brings a sense of "},{"t":"fulfillment","id":"fulfillment|U4"},{"t":". Yet many employees say they are under "},{"t":"pressure","id":"pressure|U4"},{"t":" to work long hours, and that "},{"t":"leisure","id":"leisure|U4"},{"t":" is the first thing they give up. An "},{"t":"optimist","id":"optimist|U4"},{"t":" believes a positive "},{"t":"outlook","id":"outlook|U4"},{"t":" protects them from stress; a "},{"t":"pessimist","id":"pessimist|U4"},{"t":" expects the opposite. Psychologists suggest setting one clear "},{"t":"goal","id":"goal|U4"},{"t":" at a time, keeping a "},{"t":"hobby","id":"hobby|U4"},{"t":" that allows "},{"t":"self-expression","id":"self-expression|U4"},{"t":", and remembering that money is only one "},{"t":"aspect","id":"aspect|U4"},{"t":" of a good life."}]},{"ti":"The first term at university","u":"U5","seg":[{"t":"Starting university is a shock. The "},{"t":"curriculum","id":"curriculum|U5"},{"t":" is broader than at school, the "},{"t":"syllabus","id":"syllabus|U5"},{"t":" for each "},{"t":"program","id":"program|U5"},{"t":" runs to fifty pages, and nobody checks your "},{"t":"homework","id":"homework|U5"},{"t":". You are expected to "},{"t":"conduct","id":"conduct|U5"},{"t":" your own "},{"t":"research","id":"research|U5"},{"t":", use the resources in the "},{"t":"library","id":"library|U5"},{"t":", and "},{"t":"analyse","id":"analyse|U5"},{"t":" the results of a small project rather than copy someone else's findings. A "},{"t":"tutor","id":"tutor|U5"},{"t":" will "},{"t":"review","id":"review|U5"},{"t":" your first essay, and if you "},{"t":"struggle","id":"struggle|U5"},{"t":", ask for help early: it is much easier to "},{"t":"revise","id":"revise|U5"},{"t":" a plan than to rescue a thesis in the last week."}]},{"ti":"Too many visitors","u":"U7","seg":[{"t":"Tourism is now one of the world's largest industries, and for many a "},{"t":"rural","id":"rural|U7"},{"t":" "},{"t":"community","id":"community|U7"},{"t":" it is the main source of income. A "},{"t":"remote","id":"remote|U7"},{"t":" "},{"t":"village","id":"village|U7"},{"t":" that was once "},{"t":"peaceful","id":"peaceful|U7"},{"t":" may now see a coach party every morning, and a single "},{"t":"tourist","id":"tourist|U7"},{"t":" can spend more in a week than a farmer earns in a month. The "},{"t":"effect","id":"effect|U7"},{"t":" is not always good: "},{"t":"local","id":"local|U7"},{"t":" people lose the "},{"t":"unspoilt","id":"unspoilt|U7"},{"t":" "},{"t":"landscape","id":"landscape|U7"},{"t":" they grew up in, and prices rise. "},{"t":"eco-tourism","id":"eco-tourism|U7"},{"t":" was meant to solve this, but even well-run projects need careful planning. Every "},{"t":"journey","id":"journey|U7"},{"t":" changes the place it reaches."}]}];

/* 存储三级降级：localStorage → sessionStorage → 内存
   微信内置预览、部分 file:// 打开方式会禁掉 localStorage，此时不至于崩，也不至于静默丢数据 */
const MEM={};
const STORE_MODE=(function(){
  const probe=w=>{ try{ const k='__p__'; w.setItem(k,'1'); const v=w.getItem(k); w.removeItem(k); return v==='1'; }catch(e){ return false; } };
  try{ if(probe(localStorage)) return 'local'; }catch(e){}
  try{ if(probe(sessionStorage)) return 'session'; }catch(e){}
  return 'memory';
})();
const PERSIST_OK = STORE_MODE==='local';

function rawGet(){
  try{
    if(STORE_MODE==='local') return localStorage.getItem(KEY);
    if(STORE_MODE==='session') return sessionStorage.getItem(KEY);
  }catch(e){}
  return MEM[KEY]||null;
}
function rawSet(v){
  try{
    if(STORE_MODE==='local'){ localStorage.setItem(KEY,v); return; }
    if(STORE_MODE==='session'){ sessionStorage.setItem(KEY,v); return; }
  }catch(e){}
  MEM[KEY]=v;
}

/* ---------- 定位单词在句中的位置 ---------- */
function locate(sentence, word){
  const s=String(sentence||'').replace(/\b([A-Za-z]+)\/([A-Za-z]+)\b/g,'$1');
  const lw=String(word).toLowerCase().trim();
  const ec=c=>c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  if(lw.indexOf(' ')>0){
    const parts=word.split(/\s+/).map(p=>ec(p));
    let m=s.match(new RegExp('\\b'+parts.join('\\s+')+'\\b','i'));
    if(m) return {s,i:m.index,j:m.index+m[0].length};
    const head=(word.split(/\s+/).filter(p=>!/^(be|a|an|to|the)$/i.test(p))[0]||word.split(/\s+/)[0]);
    const tail=word.split(/\s+/).pop();
    m=s.match(new RegExp('\\b'+ec(head.slice(0,4))+'[A-Za-z]*\\s+(?:[A-Za-z]+\\s+)?'+ec(tail.slice(0,Math.max(4,tail.length-2)))+'[A-Za-z]*','i'));
    return m?{s,i:m.index,j:m.index+m[0].length}:null;
  }
  const need=lw.length<=4?lw.length:lw.length-3;
  const re=/[A-Za-z][A-Za-z'-]*/g;
  let m,best=null,bestN=0;
  while((m=re.exec(s))){
    const t=m[0].toLowerCase();
    let n=0; while(n<lw.length&&n<t.length&&lw[n]===t[n]) n++;
    if(n>=need&&n>bestN){ best=m; bestN=n; }
  }
  return best?{s,i:best.index,j:best.index+best[0].length}:null;
}
const defOk=e=>!!e && String(e).length<=110;
const toks=e=>new Set(String(e||'').toLowerCase().match(/[a-z]{3,}/g)||[]);
function jac(a,b){
  const A=toks(a),B=toks(b); if(!A.size||!B.size) return 0;
  let x=0; A.forEach(t=>{ if(B.has(t)) x++; });
  return x/(A.size+B.size-x);
}

/* ---------- 组题 ---------- */
function sample(a,n){ return shuffle(a.slice()).slice(0,n); }
function uniqByWord(a){
  const seen=new Set(), out=[];
  a.forEach(x=>{ if(!seen.has(x.w)){ seen.add(x.w); out.push(x); } });
  return out;
}

// 范围里词不够 10 个时：先在同一单元里补，再退回全书
function topUp(pick,n,ok){
  if(n<=0) return [];
  const have=new Set(pick.map(d=>d.id));
  const su=scopeUnitOf(pick);
  const tiers=su?[DATA.filter(d=>d.u===su),DATA]:[DATA];
  const out=[];
  for(const t of tiers){
    if(out.length>=n) break;
    const rest=uniqByWord(t.filter(d=>ok(d)&&!have.has(d.id)&&!out.some(o=>o.id===d.id)));
    out.push(...sample(rest,n-out.length));
  }
  return out;
}

// I·A：10 空 + 15 词库
function buildIA(scope){
  const ok=d=>d.x&&locate(d.x,d.w);
  const cand=scope.filter(ok);
  let pick=sample(cand,SET);
  if(pick.length<SET) pick=pick.concat(topUp(pick,SET-pick.length,ok));
  const items=pick.map(d=>{
    const L=locate(d.x,d.w);
    return {kind:'IA',d,pre:L.s.slice(0,L.i),post:L.s.slice(L.j),ans:d.w};
  });
  const answers=new Set(items.map(i=>i.ans));
  const extra=bankDistractors(items.map(i=>i.d),answers,5);
  return {kind:'IA',items,bank:shuffle([...answers].map(w=>({w})).concat(extra))};
}

function bankDistractors(answersD,answersSet,n){
  const cands=[];
  answersD.forEach(d=>{ (NEAR[d.id]||[]).forEach(id=>{ const x=byId[id]; if(x&&!answersSet.has(x.w)) cands.push(x); }); });
  let out=uniqByWord(cands).filter(x=>!answersSet.has(x.w));
  if(out.length<n){
    const pos=new Set(answersD.map(d=>d.o));
    const more=DATA.filter(x=>pos.has(x.o)&&!answersSet.has(x.w)&&!out.some(o=>o.w===x.w));
    out=out.concat(sample(more,n-out.length));
  }
  return sample(out,n).map(x=>({w:x.w}));
}

// I·B：10 句划线词 + A–J 定义
function buildIB(scope){
  const ok=d=>defOk(d.e)&&d.x&&locate(d.x,d.w);
  let cand=scope.filter(ok);
  if(cand.length<SET) cand=cand.concat(topUp(cand,SET-cand.length,ok));
  const picked=[];
  for(const d of sample(cand,cand.length)){
    if(picked.length>=SET) break;
    if(picked.some(p=>jac(p.e,d.e)>0.28)) continue;
    picked.push(d);
  }
  const defs=shuffle(picked.map(d=>d.e));
  const items=picked.map(d=>{
    const L=locate(d.x,d.w);
    return {kind:'IB',d,pre:L.s.slice(0,L.i),mid:L.s.slice(L.i,L.j),post:L.s.slice(L.j),
      ans:letter(defs.indexOf(d.e))};
  });
  return {kind:'IB',items,defs};
}

// I·C：10 题加粗词 + 四个释义
function buildIC(scope){
  const ok=d=>defOk(d.e)&&d.x&&locate(d.x,d.w);
  let cand=scope.filter(ok);
  if(cand.length<SET) cand=cand.concat(topUp(cand,SET-cand.length,ok));
  let pick=sample(cand,SET);
  const items=pick.map(d=>{
    const L=locate(d.x,d.w);
    const opts=[d.e];
    const pool=(CONF[d.id]||[]).map(id=>byId[id]).filter(x=>x&&defOk(x.e));
    for(const x of shuffle(pool)){
      if(opts.length>=4) break;
      if(opts.some(t=>jac(t,x.e)>0.42)) continue;
      if(x.e===d.e) continue;
      opts.push(x.e);
    }
    if(opts.length<4){
      for(const x of shuffle(DATA.filter(x=>defOk(x.e)&&x.o===d.o))){
        if(opts.length>=4) break;
        if(opts.some(t=>jac(t,x.e)>0.42)) continue;
        opts.push(x.e);
      }
    }
    const bag=shuffle(opts.slice(0,4));
    return {kind:'IC',d,pre:L.s.slice(0,L.i),mid:L.s.slice(L.i,L.j),post:L.s.slice(L.j),
      opts:bag,ans:bag.indexOf(d.e)};
  });
  return {kind:'IC',items};
}

// II·A：短文 10 空 + 15 词库
function buildIIA(scope){
  const scopeIds=new Set(scope.map(d=>d.id));
  const full=scopeIds.size>=DATA.length;
  // 只有命中所选范围的短文才可选，避免选 Unit 3 却出 Unit 1 的词
  const scored=PASS.map(p=>{
    const idx=p.seg.map((s,i)=>s.id?i:-1).filter(i=>i>=0);
    return {p, idx, hit:idx.filter(i=>scopeIds.has(p.seg[i].id)).length};
  });
  let cand=scored;
  if(!full){
    cand=scored.filter(s=>s.hit>0);
    if(!cand.length) cand=scored;                 // 范围里没有任何短文词时才兜底
  }
  const pick=cand[Math.floor(Math.random()*cand.length)];
  const p=pick.p;
  let inScope=pick.idx.filter(i=>scopeIds.has(p.seg[i].id));
  if(!inScope.length) inScope=pick.idx.slice();
  // 短文里属于本范围的词不足 10 个时，先用同单元的补
  let slots=inScope.slice();
  if(slots.length<SET){
    const rest=pick.idx.filter(i=>slots.indexOf(i)<0);
    const su=scopeUnitOf(scope);
    const same=su?rest.filter(i=>{ const d=byId[p.seg[i].id]; return d&&d.u===su; }):[];
    slots=slots.concat(same);
    if(slots.length<SET) slots=slots.concat(rest.filter(i=>slots.indexOf(i)<0));
  }
  const n=Math.min(SET,slots.length);
  const chosen=sample(slots,n).sort((a,b)=>a-b);
  const items=chosen.map(i=>{
    const d=byId[p.seg[i].id];
    return {kind:'IIA',d,slot:i,ans:d.w};
  });
  const answers=new Set(items.map(i=>i.ans));
  const extra=bankDistractors(items.map(i=>i.d),answers,5);
  return {kind:'IIA',items,pass:p,slotOf:{},bank:shuffle([...answers].map(w=>({w})).concat(extra))};
}

/* ---------- 状态 ---------- */
let set=null, cursor=0, answered=[], score=0, wrongD=[];
const build={
  IA:buildIA, IB:buildIB, IC:buildIC, IIA:buildIIA
};

/* ---------- 范围：单元 → 课文 两级 ---------- */
const unitNo=u=>parseInt((String(u).match(/\d+/)||[0])[0],10)||0;
const chKey=c=>{ const m=String(c).match(/Ch\s*(\d+)\s*R\s*(\d+)/i); return m?(+m[1])*100+(+m[2]):0; };
const unitsAll=()=>[...new Set(bankData().map(d=>d.u))].sort((a,b)=>unitNo(a)-unitNo(b));
const chaptersOf=u=>[...new Set(bankData().filter(d=>d.u===u).map(d=>d.c))].sort((a,b)=>chKey(a)-chKey(b));
const chUnit=c=>{ const d=DATA.find(x=>x.c===c); return d?d.u:null; };
const countU=u=>bankData().filter(d=>d.u===u).length;
const countC=c=>bankData().filter(d=>d.c===c).length;
// 某篇课文在短文（II·A 用）里被用到的词数，取覆盖最多的那篇
const passHits=c=>{ let m=0; PASS.forEach(p=>{ const n=p.seg.filter(s=>s.id&&s.id.split('|')[1]===c).length; if(n>m) m=n; }); return m; };

function activeUnit(){
  const s=prefs.scope||'all';
  if(s.indexOf('u:')===0) return s.slice(2);
  if(s.indexOf('ch:')===0) return chUnit(s.slice(3));
  return null;
}
function scopeUnitOf(arr){
  const us=[...new Set(arr.map(d=>d.u))];
  return us.length===1?us[0]:null;
}

function bankData(){ return DATA.filter(d=>d.b===(prefs.bank||'read')); }
function pool(){
  const s=prefs.scope||'all', B=bankData();
  if(s==='all') return B;
  if(s==='unmastered') return B.filter(d=>!mastered(d));
  if(s.indexOf('u:')===0) return B.filter(d=>d.u===s.slice(2));
  if(s.indexOf('tag:')===0) return B.filter(d=>d.t===s.slice(4));
  if(s.indexOf('ch:')===0) return B.filter(d=>d.c===s.slice(3));
  return B;
}

/* ---------- 首页 ---------- */
function renderHome(){
  $('sDone').textContent=store.stat.a||0;
  $('sOk').textContent=DATA.filter(mastered).length;
  $('sWrong').textContent=wrongList().length;

  $('typeList').innerHTML=TYPES.map(t=>
    `<button class="type${prefs.type===t.k?' on':''}" data-k="${t.k}">
      <span class="code">${t.code}</span>
      <span class="tx"><span class="nm">${t.nm}</span><span class="ds">${t.ds}</span></span>
    </button>`).join('');

  const bank=prefs.bank||'read';
  const B=bankData();
  const banks=[['read','读写教程',DATA.filter(d=>d.b==='read').length],
               ['ielts','雅思词汇',DATA.filter(d=>d.b==='ielts').length]];
  $('bankN').textContent='当前词库 '+B.length+' 词';
  $('bankChips').innerHTML=banks.map(([v,n,c])=>
    `<button class="chip sm${bank===v?' on':''}" data-b="${v}">${n}<span class="n">${c}</span></button>`).join('');

  const au=activeUnit();
  const top=[['all','全部',B.length]]
    .concat(unitsAll().map(u=>['u:'+u,
      (bank==='ielts'?((bankData().find(x=>x.u===u)||{}).c||u):u),countU(u)]))
    .concat(bank==='read'
      ? [['tag:四级','四级',B.filter(d=>d.t==='四级').length],
         ['tag:六级','六级',B.filter(d=>d.t==='六级').length],
         ['tag:学术','学术',B.filter(d=>d.t==='学术').length],
         ['unmastered','没掌握',B.filter(d=>!mastered(d)).length]]
      : [['unmastered','没掌握',B.filter(d=>!mastered(d)).length]]);
  $('scopeChips').innerHTML=top.map(([v,n,c])=>{
    const cls=prefs.scope===v?' on':(v.indexOf('u:')===0&&au===v.slice(2)?' parent':'');
    return `<button class="chip sm${cls}" data-s="${v}">${n}<span class="n">${c}</span></button>`;
  }).join('');

  if(au && bank==='read'){
    $('chapLab').hidden=false; $('scopeSub').hidden=false;
    $('chapTitle').textContent='课文 · '+au;
    const subs=[['u:'+au,'整个单元',countU(au)]]
      .concat(chaptersOf(au).map(c=>['ch:'+c,c,countC(c)]));
    $('scopeSub').innerHTML=subs.map(([v,n,c])=>
      `<button class="chip sm${prefs.scope===v?' on':''}" data-s="${v}">${n}<span class="n">${c}</span></button>`).join('');
  }else{
    $('chapLab').hidden=true; $('scopeSub').hidden=true; $('scopeSub').innerHTML='';
  }

  const p=pool(), su=scopeUnitOf(p);
  let note='';
  if(prefs.type==='IIA' && (prefs.scope||'').indexOf('ch:')===0 && passHits(prefs.scope.slice(3))<5)
    note=' · 该课文无配文，II·A 用同单元短文';
  $('poolN').textContent='本组范围 '+p.length+' 词'+
    (p.length<SET?'（不足 '+SET+'，从'+(su?'同单元':'全书')+'补足）':'')+note;
}

/* ---------- 开始 ---------- */
function startSet(list, type){
  const t=type||prefs.type;
  const sc=list||pool();
  if(sc.length<3) toast('范围里的词太少，先选大一点的范围');
  set=build[t](sc);
  if(!set.items.length){ toast('这个范围出不了题，换一个范围'); return; }
  cursor=0; answered=set.items.map(()=>false); score=0; wrongD=[]; usedDefs=new Set();
  $('qtype').textContent=TYPES.find(x=>x.k===t).code+' · '+TYPES.find(x=>x.k===t).nm;
  $('prog').style.width='0%';
  show('quiz');
  renderItem();
}

/* ---------- 渲染当前题 ---------- */
function renderItem(){
  const it=set.items[cursor];
  $('cnt').textContent=(cursor+1)+' / '+set.items.length;
  $('score').textContent='得分 '+(+score.toFixed(1));
  $('prog').style.width=(cursor/set.items.length*100)+'%';
  const box=$('qbody');

  if(it.kind==='IA'){
    box.innerHTML=`
      <div class="stem"><div class="ln">第 ${slotNo()} 空 · 从词库中选词填入</div>
        ${esc(it.pre)}<span class="blank cur" id="blank">${answered[cursor]?'':''}</span>${esc(it.post)}</div>
      <div class="bank"><div class="btitle"><span>词库 ${set.bank.length} 词（含干扰词）</span><span>已用 <b id="usedN">0</b></span></div>
        <div class="bgrid" id="bgrid">${bankHTML()}</div></div>`;
  }else if(it.kind==='IIA'){
    const filled=slotFilled();
    box.innerHTML=`
      <div class="passage" id="passage">${passageHTML()}</div>
      <div class="bank"><div class="btitle"><span>词库 ${set.bank.length} 词（含干扰词）</span><span>已用 <b id="usedN">0</b></span></div>
        <div class="bgrid" id="bgrid">${bankHTML()}</div></div>`;
    const cur=$('passage').querySelector('.blank.cur');
  }else if(it.kind==='IB'){
    box.innerHTML=`
      <div class="stem"><div class="ln">划线词的意思是</div>
        ${esc(it.pre)}<span class="big ul">${esc(it.mid)}</span>${esc(it.post)}</div>
      <div class="deflist" id="dl">${set.defs.map((d,i)=>
        `<button class="drow${usedDefs.has(letter(i))?' used':''}" data-l="${letter(i)}">
          <span class="L">${letter(i)}</span><span>${esc(d)}</span></button>`).join('')}</div>`;
  }else{
    box.innerHTML=`
      <div class="stem"><div class="ln">与加粗词意思最接近的是</div>
        ${esc(it.pre)}<span class="big bd">${esc(it.mid)}</span>${esc(it.post)}</div>
      <div class="opts" id="opts">${it.opts.map((o,i)=>
        `<button class="opt" data-i="${i}"><span class="i">${letter(i)}</span><span>${esc(o)}</span></button>`).join('')}</div>`;
  }

  if(it.kind==='IA'||it.kind==='IIA'){
    const n=[...set.bank].filter(b=>b.used).length;
    const u=$('usedN'); if(u) u.textContent=n;
  }
}

let usedDefs=new Set();
function slotNo(){ return cursor+1; }

function bankHTML(){
  return set.bank.map((b,i)=>
    `<button class="bw${b.used?' used':''}${b.ok?' ok':''}${b.no?' no':''}" data-i="${i}">${esc(b.w)}</button>`
  ).join('');
}

function passageHTML(){
  const p=set.pass;
  const map={}; set.items.forEach((it,k)=>{ map[it.slot]={k,it}; });
  let html='', cur=set.items[cursor];
  p.seg.forEach((s,i)=>{
    if(!s.id){ html+=esc(s.t); return; }
    const m=map[i];
    if(!m){ html+=esc(s.t); return; }
    const it=m.it, done=answered[m.k];
    const cls='blank'+(m.k===cursor?' cur':'')+(done?(it._good?' ok':(it._picked?' no':'')):'');
    const txt=done&&it._picked?esc(it._picked):'';
    html+=`<span class="${cls}">${txt||'&nbsp;'}</span><span class="bn">(${m.k+1})</span>`;
  });
  return html;
}

function slotFilled(){
  return set.items.map(it=>it._picked||'').filter(Boolean);
}

/* ---------- 作答 ---------- */
function bindQuiz(){
  $('qbody').addEventListener('click',e=>{
    const bw=e.target.closest('.bw');
    if(bw){ pickWord(+bw.dataset.i); return; }
    const dr=e.target.closest('.drow');
    if(dr){ pickDef(dr.dataset.l); return; }
    const op=e.target.closest('.opt');
    if(op){ pickOpt(+op.dataset.i); return; }
  });
}

function pickWord(idx){
  if(answered[cursor]) return;
  const b=set.bank[idx];
  if(!b||b.used) return;
  const it=set.items[cursor];
  const good=b.w===it.ans;
  answered[cursor]=true;
  b.used=true; b.ok=good; if(!good) b.no=false;
  if(!good){ /* 干扰词或错词：标红但归还 */ b.used=false; b.no=true; }
  it._picked=b.w; it._good=good;

  // 空格立即回填
  if(it.kind==='IA'){ const bl=$('blank'); if(bl){ bl.textContent=b.w; bl.classList.add(good?'ok':'no'); bl.classList.remove('cur'); } }
  if(it.kind==='IIA'){ const p=$('passage'); if(p) p.innerHTML=passageHTML(); }

  if(good){ score+=PTS[it.kind]; }
  else { wrongD.push(it.d); }

  // 答错时把正确词标绿
  if(!good){ const c=set.bank.find(x=>x.w===it.ans); if(c) c.ok=true; }
  rec(it.d,good);
  reveal(it,good);
}

function pickDef(L){
  if(answered[cursor]) return;
  const it=set.items[cursor];
  const good=L===it.ans;
  answered[cursor]=true; it._picked=L; it._good=good;
  if(good) score+=PTS[it.kind]; else wrongD.push(it.d);
  if(good) usedDefs.add(L);
  const rows=$('dl');
  if(rows){
    [...rows.children].forEach(r=>{
      if(r.dataset.l===L) r.classList.add(good?'ok':'no');
      if(!good&&r.dataset.l===it.ans) r.classList.add('ok');
      if(r.dataset.l===it.ans) r.classList.add('used');
    });
  }
  rec(it.d,good);
  reveal(it,good);
}

function pickOpt(i){
  if(answered[cursor]) return;
  const it=set.items[cursor];
  const good=i===it.ans;
  answered[cursor]=true; it._picked=i; it._good=good;
  if(good) score+=PTS[it.kind]; else wrongD.push(it.d);
  const box=$('opts');
  if(box) [...box.children].forEach((b,k)=>{
    if(k===i) b.classList.add(good?'ok':'no');
    if(!good&&k===it.ans) b.classList.add('ok');
  });
  rec(it.d,good);
  reveal(it,good);
}

/* ---------- 反馈弹层 ---------- */
function reveal(it,good){
  const d=it.d;
  const head=good?'<span class="verd ok">✓ 答对了</span>':'<span class="verd no">✕ 答错了</span>';
  let ansLine='';
  if(it.kind==='IB') ansLine=`<div class="def" style="margin:0 0 6px">正确项 <b>${it.ans}</b>：${esc(d.e)}</div>`;
  if(it.kind==='IC') ansLine=`<div class="def" style="margin:0 0 6px">正确项 <b>${letter(it.ans)}</b></div>`;

  const wrap=document.createElement('div');
  wrap.className='sheet-wrap';
  wrap.innerHTML=`<div class="sheet">
    ${head}
    ${ansLine}
    <div class="wline"><span class="w">${esc(d.w)}</span>
      <span class="ipa">${d.p?'/'+esc(d.p)+'/':''}</span>
      <button class="spk" data-say="${esc(d.w)}">🔊</button>
      <span class="ipa">${esc(d.o)}</span></div>
    <div class="zh">${esc(d.z)}</div>
    ${defOk(d.e)?`<div class="def">${esc(d.e)}</div>`:''}
    <div class="ex"><div class="en">${esc(d.x)}</div><div class="cn">${esc(d.y)}</div></div>
    <div class="acts"><button class="btn btn-main" id="btnNext">${cursor===set.items.length-1?'看结果':'下一题'}</button></div>
  </div>`;
  document.body.appendChild(wrap);
  $('score').textContent='得分 '+(+score.toFixed(1));
  $('prog').style.width=((cursor+1)/set.items.length*100)+'%';

  wrap.addEventListener('click',e=>{
    if(e.target.closest('[data-say]')){ say(e.target.closest('[data-say]').dataset.say); return; }
    if(e.target.closest('#btnNext')){ wrap.remove(); advance(); return; }
  });
  if(good&&prefs.autoSay) say(d.w);
}

function say(t){
  try{
    const u=new SpeechSynthesisUtterance(t); u.lang='en-US'; u.rate=.95;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}

function advance(){
  if(cursor===set.items.length-1){ finish(); return; }
  cursor++; renderItem();
}

/* ---------- 结果 ---------- */
function finish(){
  const full=+(set.items.length*PTS[set.kind]).toFixed(1);
  $('donePts').textContent=(+score.toFixed(1));
  $('doneFull').textContent=' / '+full;
  const right=set.items.length-wrongD.length;
  $('doneSub').textContent=`答对 ${right} / ${set.items.length} 题　正确率 ${Math.round(right/set.items.length*100)}%`;
  $('doneWrong').innerHTML=wrongD.length
    ? `<div class="lab"><span>这组答错的词</span><i>${wrongD.length}</i></div>
       <div class="rows">${wrongD.map(d=>`<div class="row"><span class="w">${esc(d.w)}</span><span class="z">${esc(d.z)}</span></div>`).join('')}</div>`
    : `<div class="empty"><b>全对</b>这一组没有答错的词</div>`;
  $('btnRetryWrong').hidden=!wrongD.length;
  show('done');
  renderHome();
}

  const hit=[],miss=[];
  parts.forEach(t=>{

    if(!d){ const c=DATA.filter(x=>x.w.toLowerCase().startsWith(t)); if(c.length===1) d=c[0]; }

  });
  save(); renderHome();
  $('addMsg').innerHTML=`已加入 ${hit.length} 个${hit.length?'：'+esc(hit.join('、')):''}`+
    (miss.length?`<br>词库里没有：${esc(miss.join('、'))}`:'');

/* 导入 / 备份 */
function doImport(text){
  let added=0,skipped=0;
  const t=String(text||'').trim();
  let obj=null;
  try{ obj=JSON.parse(t); }catch(e){}
  if(obj&&obj.cards){
    Object.keys(obj.cards).forEach(k=>{
      const v=obj.cards[k]||{};
      const d=byId[k]||byWord[String(k).split('|')[0].trim().toLowerCase()];
      if(!d){ skipped++; return; }
      const c=cardOf(d);
      if((v.w||0)>0&&(v.l!==1)){ c.w=Math.max(c.w,v.w||1); c.l=0; added++; }
    });
  }else{
    t.split(/[\n,;，；\s"'\[\]{}|]+/).map(s=>s.trim().toLowerCase()).filter(Boolean).forEach(w=>{
      const d=byWord[w]||(DATA.filter(x=>x.w.toLowerCase().startsWith(w)).length===1?DATA.find(x=>x.w.toLowerCase().startsWith(w)):null);
      if(d){ const c=cardOf(d); if(!c.w) c.w=1; c.l=0; c.t=Date.now(); added++; } else skipped++;
    });
  }
  save(); renderHome();
  return {added,skipped};
}

function toast(msg){
  const el=document.createElement('div'); el.className='toast'; el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1800);
}

/* 弹层 */
function dlg(title,desc,val,okText,onOk){
  const wrap=document.createElement('div'); wrap.className='mask';
  wrap.innerHTML=`<div class="dlg"><h3>${esc(title)}</h3><p>${esc(desc)}</p>
    <textarea id="dlgBox"></textarea><div class="msg" id="dlgMsg"></div>
    <div class="acts"><button class="btn btn-ghost" id="dlgCancel">关闭</button>
    <button class="btn btn-main" id="dlgOk">${esc(okText)}</button></div></div>`;
  document.body.appendChild(wrap);
  const box=wrap.querySelector('#dlgBox'); box.value=val||'';
  wrap.querySelector('#dlgCancel').onclick=()=>wrap.remove();
  wrap.addEventListener('click',e=>{ if(e.target===wrap) wrap.remove(); });
  wrap.querySelector('#dlgOk').onclick=()=>{ onOk(box.value,wrap); };
  setTimeout(()=>box.focus(),80);
  return wrap;
}

$('btnExport').onclick=()=>{
  const w=dlg('备份进度','复制这段文本，换手机或清缓存后用「恢复进度」粘回来。',JSON.stringify(store),'复制',(v,wrap)=>{
    const box=wrap.querySelector('#dlgBox'); box.select();
    try{ document.execCommand('copy'); wrap.querySelector('#dlgOk').textContent='已复制 ✓'; }
    catch(e){ wrap.querySelector('#dlgOk').textContent='请长按手动复制'; }
  });
};
$('btnImportBak').onclick=()=>{
  dlg('恢复进度','把备份内容整段粘进来，会覆盖当前进度。','','恢复',(v,wrap)=>{
    try{
      const o=JSON.parse(v); if(!o||!o.cards) throw 0;
      store=o; if(!store.stat) store.stat={a:0,r:0}; save();
      wrap.remove(); renderHome(); show('home');
      toast('已恢复 '+Object.keys(o.cards).length+' 条记录');
    }catch(e){ wrap.querySelector('#dlgMsg').textContent='格式不对，要贴完整的备份文本'; }
  });
};
$('btnImport').onclick=()=>{
  const wrap=document.createElement('div'); wrap.className='mask';
  wrap.innerHTML=`<div class="dlg"><h3>从别处导入错词</h3>
    <p>支持：闪卡的进度 JSON、本应用备份、纯词表（一行一个）。</p>
    <div class="acts" style="margin-top:0">
      <button class="btn btn-ghost" id="impClip">读剪贴板</button>
      <button class="btn btn-ghost" id="impFile">选文件</button>
    </div>
    <textarea id="impBox" style="margin-top:10px" placeholder="也可以直接粘贴到这里"></textarea>
    <div class="msg" id="impMsg"></div>
    <div class="acts"><button class="btn btn-ghost" id="impCancel">关闭</button>
      <button class="btn btn-main" id="impOk">导入</button></div>
    <input type="file" id="fileInput" accept=".json,.txt,text/plain,application/json" hidden></div>`;
  document.body.appendChild(wrap);
  const box=wrap.querySelector('#impBox'), msg=wrap.querySelector('#impMsg');
  const run=(text)=>{
    if(!String(text||'').trim()){ msg.textContent='没有内容'; return; }
    const r=doImport(text);
    msg.textContent=`导入了 ${r.added} 个错词`+(r.skipped?`，${r.skipped} 个没匹配上`:'');
    setTimeout(()=>{ wrap.remove(); renderWrong(); },700);
  };
  wrap.querySelector('#impClip').onclick=async()=>{
    try{ const t=await navigator.clipboard.readText(); box.value=t; run(t); }
    catch(e){ msg.textContent='读不到剪贴板，请手动粘贴'; }
  };
  wrap.querySelector('#impFile').onclick=()=>wrap.querySelector('#fileInput').click();
  wrap.querySelector('#fileInput').onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    const rd=new FileReader(); rd.onload=()=>{ box.value=rd.result; run(rd.result); }; rd.readAsText(f);
  };
  wrap.querySelector('#impCancel').onclick=()=>wrap.remove();
  wrap.querySelector('#impOk').onclick=()=>run(box.value);
  wrap.addEventListener('click',e=>{ if(e.target===wrap) wrap.remove(); });
};

bindQuiz();
renderHome();
show('home');

  const w=$('storeWarn');
  if(STORE_MODE==='local'){ w.hidden=true; return; }
  w.hidden=false;

    w.textContent='进度只能存在当前标签页，关掉就没了。想要长期保存，请用手机自带浏览器（Safari / Chrome）打开这个文件。';
  }else{

      ? '现在是在微信里预览，进度存不住。点右上角「···」→「在浏览器打开」，之后进度就能一直保存。'

  }
})();

/* 链接导入：#w=sexism,bias */
(function(){
  const m=location.hash.match(/[#&]w=([^&]+)/);
  if(!m) return;
  try{
    doImport(decodeURIComponent(m[1]).replace(/\+/g,' '));
    history.replaceState(null,'',location.pathname+location.search);
    renderWrong(); show('wrong');
  }catch(e){}
})();
</script>
